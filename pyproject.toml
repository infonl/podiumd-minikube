[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podiumd-minikube"
version = "0.1.0"
description = "Sets up, deploys and inspects the podiumd-minikube cluster"
requires-python = ">=3.12"
dependencies = [
    "PyYAML",   # values.yaml, the rendered manifest, .podiumd-versions.yaml
    "certifi",  # public CAs for the local CA's trust bundle (pki)
]

[project.optional-dependencies]
# The live suite in tests/ and the tools of run_python_checks; unpinned on purpose, new rules are welcome.
dev = [
    "pytest>=8.0",
    "pytest-cov",  # coverage of the unit tests (run_python_checks)
    "requests>=2.31",
    "ruff",
    "pymarkdownlnt",
    "pylint",
    "vulture",
    "bandit",
    "basedpyright",
    "jscpd",
    "types-PyYAML",
    "types-requests",
    "flake8-pyproject",  # flake8 reads [tool.flake8] in pyproject.toml
    "wemake-python-styleguide",  # flake8 plugin, brings its own pinned flake8
    "flake8-bugbear",  # B907 and B042 only ([tool.flake8] select)
    "pip-audit",
]

[project.scripts]
podiumd-minikube = "podiumd_minikube.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
podiumd_minikube = ["py.typed"]

# ruff, flake8, pylint, isort, vulture, bandit, basedpyright, pymarkdown and pytest
# config for all Python code in this repository: src/, unit_tests/ and the
# live-cluster suite in tests/. vendor/ holds verbatim upstream copies and is
# not checked.

[tool.ruff]
# Shared with [tool.ruff.format] and pylint max-line-length.
line-length = 120
indent-width = 4
force-exclude = true
extend-exclude = ["vendor", ".claude"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "AIR",
    # "ANN", # flake8-annotations
    "ARG",
    "ASYNC",
    "B",    # flake8-bugbear
    "BLE",
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    #"D",    # pydocstyle
    "DJ",
    "DTZ",
    "E",    # pycodestyle
    "EM",
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # Pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "INP",
    "INT",
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",
    "PD",
    "PERF", # perflint
    "PGH",
    "PIE",  # flake8-pie
    "PL",   # pylint: ruff owns the pylint checks it has (pylint drops them, see [tool.pylint."messages control"])
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T10",
    "T20",
    "TCH",
    "TID",
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
    "ANN201",  # public function without a return annotation (production code; tests ignore it)
    "ANN202",  # private function without a return annotation (production code; tests ignore it)
    # Preview rules, each selected by its code (explicit-preview-rules):
    "PLR0904",  # too many public methods
    "PLR0914",  # too many locals
    "PLR6201",  # membership test on a list or tuple literal, a set is meant
    "PLW0717",  # too many statements in a try body: the except catches only what it is meant for
    "PLW1514",  # text mode open without an explicit encoding
    "PLR6301",  # method that does not use self: a module-level function (WPS602 forbids staticmethod)
    "RUF039",   # regex pattern not a raw string
    "FURB113",  # repeated append instead of extend
    "FURB140",  # starmap instead of a comprehension that unpacks
]
# Only the preview rules selected by code above, not every preview rule of a selected group.
preview = true
explicit-preview-rules = true
ignore = [
    "COM812", # Conflicts when used with the formatter
    "ISC001", # Rule may cause conflicts when used with the formatter, disable is recommended by ruff
    "T201", # 'print' statement found, sometimes these are deliberate
    "EXE001", # shebang permission mismatch between host and Docker container
    "E501", # line-too-long: pylint's job now (C0301), avoid flagging the same line twice
    "ERA001", # commented-out-code: current hits are prose that resembles code
]
# The WPS codes in noqa comments belong to flake8 (wemake-python-styleguide), not to ruff.
external = ["WPS"]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# Mirror [tool.isort] below so ruff and isort agree on import layout.
force-single-line = true
lines-between-types = 1
# No target-version is set, so ruff doesn't know tomllib (3.11+) is stdlib.
extra-standard-library = ["tomllib"]
known-first-party = ["podiumd_minikube"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true  # Enable additional checks for try-except-pass

[tool.ruff.lint.per-file-ignores]
# tests/ and unit_tests/: pytest asserts, fixture/mock params (ARG), no
# __init__.py (INP001), unused unpacked vars (RUF059), fixed-argv
# kubectl/helm calls (S603/S607), dev passwords (S105), unannotated returns
# (ANN201/ANN202). bandit does not
# scan them either. Test values in asserts (PLR2004), fixtures and fakes
# with many parameters (PLR0913, PLR0917), imports inside a test (PLC0415),
# setup and assert together in a try (PLW0717), many tests (PLR0904) and
# locals (PLR0914).
"{tests,unit_tests}/**" = [
    "S101", "ARG001", "ARG005", "INP001", "RUF059", "S603", "S607", "S105", "ANN201", "ANN202",
    "PLR2004", "PLR0913", "PLR0917", "PLC0415", "PLW0717", "PLR0904", "PLR0914",
]
# files/: scripts an app's `manage.py shell` runs, not a package.
"files/**" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# pylint covers checks ruff lacks; overlapping rules are owned by one tool.
# tests/ and unit_tests/ also disable [tool.podiumd-minikube.pylint-tests]:
# pylint has no per-directory config.

[tool.pylint."messages control"]
# Owned by ruff (PL rules, [tool.ruff.lint]), which also reads the noqa comments that suppress them.
disable = [
    "too-many-arguments",             # PLR0913
    "too-many-positional-arguments",  # PLR0917
    "too-many-return-statements",     # PLR0911
    "too-many-branches",              # PLR0912
    "too-many-statements",            # PLR0915
    "too-many-locals",                # PLR0914
    "too-many-public-methods",        # PLR0904
    "too-many-boolean-expressions",   # PLR0916
    "import-outside-toplevel",        # PLC0415
    "unspecified-encoding",           # PLW1514
]

[tool.pylint.format]
# Matches [tool.ruff] line-length.
max-line-length = 120

# Added by run_python_checks to pylint's --disable for tests only.
[tool.podiumd-minikube.pylint-tests]
disable = [
    # False positives under tests/:
    "missing-function-docstring",
    "wrong-import-position",
    "unused-argument",
    "protected-access",
    "unused-variable",
    "redefined-outer-name",
    "duplicate-code",
    # Not enforced for tests:
    "consider-using-from-import",
    "use-implicit-booleaness-not-comparison",
    "import-error",
    "superfluous-parens",
    "too-many-lines",
    "subprocess-run-check",
    "missing-class-docstring",
    "useless-return",
    "unnecessary-lambda",
    "too-few-public-methods",
    "line-too-long",
    "comparison-of-constants",
]

[tool.flake8]
# Only the WPS rules (wemake-python-styleguide) that ruff and pylint lack.
# B042 and B907 (flake8-bugbear): the two bugbear rules ruff lacks.
select = ["WPS", "B042", "B907"]
max-line-length = 120
# Jones complexity of a line (default 14): only the really dense lines
max-line-complexity = 20
max-cognitive-average = 6
max-name-length = 30
max-tuple-unpack-length = 3
max-except-exceptions = 2
max-lines-in-finally = 1
max-noqa-comments = 5
ignore = [
    # done by ruff or pylint
    "WPS210",  # too many locals: PLR0914
    "WPS211",  # too many arguments: PLR0913, PLR0917
    "WPS214",  # too many methods: PLR0904
    "WPS421",  # print: T201, off on purpose (the commands print)
    "WPS432",  # magic number: PLR2004 (comparisons), elsewhere a named constant is not clearer
    "WPS441",  # control variable used after its loop: B020, PLW2901 (a comprehension reusing names is no bug)
    # opinion, or in conflict with this code base
    "WPS110",  # names like result, data, value: clear in their context
    "WPS201",  # too many imports: isort force-single-line gives one import per line
    "WPS202",  # too many module members: a module groups one concept
    "WPS204",  # overused expression: flags raise X(msg), the pattern ruff EM asks for
    "WPS226",  # string constant overuse: YAML and JSON keys are data
    "WPS237",  # complex f-string: a subscript or call in an f-string reads fine
    "WPS332",  # walrus outside a comprehension: used on purpose (if match := RE.match(...))
    "WPS407",  # mutable module constant: freezing nested dicts breaks json and yaml dumps
    "WPS430",  # nested function: closures on purpose (callbacks, fakes)
    "WPS529",  # implicit .get(): flags a dispatch on which keys a dict has; SIM401 catches the if/else default case
]
# flake8 applies only the longest pattern that matches a file (* matches / too).
per-file-ignores = [
    # tests: counts and sizes (asserts, comparisons, line complexity, annotations of fixtures), test idioms (short
    # names, == [] in an assert, nested classes for fakes, list multiplication, slices, float values). Also here:
    # unpacking the documents of a render (WPS236), `(item,) = ...` and `[item] = ...` asserting exactly one
    # (WPS359, WPS460), `assert not [...]` (WPS444), an expected value chosen by a parameter (WPS509).
    "tests/*:WPS111,WPS114,WPS118,WPS218,WPS219,WPS221,WPS228,WPS230,WPS234,WPS236,WPS301,WPS324,WPS358,WPS359,WPS362,WPS431,WPS435,WPS444,WPS458,WPS460,WPS509,WPS520",
    "unit_tests/*:WPS111,WPS114,WPS118,WPS218,WPS219,WPS221,WPS228,WPS230,WPS234,WPS236,WPS301,WPS324,WPS358,WPS359,WPS362,WPS431,WPS435,WPS444,WPS458,WPS460,WPS509,WPS520",
]

[tool.isort]
# Compatible with 'ruff format'; mirrored by [tool.ruff.lint.isort]. The two
# attach comments between imports differently: fence such blocks with
# "# isort: off" / "# isort: on".
line_length = 120
multi_line_output = 3
lines_between_types = 1
use_parentheses = true
include_trailing_comma = true
force_single_line = true
default_section = "THIRDPARTY"
extra_standard_library = ["tomllib"]
known_first_party = ["podiumd_minikube"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# vulture runs on src/ only (see run_python_checks):
# test fixtures and mock params look like dead code. False positives go here,
# each with its reason.
[tool.vulture]
ignore_names = []

[tool.bandit]
skips = [
    # covered by ruff:
    "B108",
    "B110",  # S110 in ruff
    "B501",
]

[tool.basedpyright]
exclude = [
    "**/__pycache__",
    ".venv",
    "vendor",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnusedImport = false  # done by ruff F401
reportUntypedBaseClass = false # done by ruff N801
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportCallInDefaultInitializer = "error"
reportInvalidCast = "error"
reportPrivateLocalImportUsage = "error"
reportUnannotatedClassAttribute = "error"

[[tool.basedpyright.executionEnvironments]]
root = "unit_tests"
extraPaths = ["unit_tests"]
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

# Live-cluster suite: test modules import helpers from tests/conftest.py.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["tests"]
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.basedpyright.executionEnvironments]]
root = "src"

[tool.pymarkdown]
# Long prose lines and headings in README/plan text are fine.
plugins.md013.enabled = false

[tool.pytest.ini_options]
# A plain `pytest` from the repo root runs the offline unit tests; the
# live-cluster suite runs from tests/ (its own pytest.ini).
testpaths = ["unit_tests"]
# Test modules import their fakes from unit_tests/conftest.py.
pythonpath = ["unit_tests"]
# --tb=short: long tracebacks print the arguments of each frame, tokens included.
addopts = "-ra --tb=short"

[tool.coverage.run]
branch = true
source = ["src/podiumd_minikube"]

[tool.coverage.report]
fail_under = 85
