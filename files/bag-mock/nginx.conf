worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log off;
  default_type application/hal+json;

  map $arg_expand $bag_address {
    "" bag-adressen-0363200003761447-body.json;
    default bag-adressen-0363200003761447-expand-body.json;
  }
  map $arg_q $bag_search {
    "fake+search+text" bag-adressen-zoeken-fake-search-text-body.json;
    default "";
  }

  server {
    listen 8080;
    root /bag;

    location = /lvbag/individuelebevragingen/v2/adressen/0363200003761447 {
      try_files /$bag_address =404;
    }

    location = /lvbag/individuelebevragingen/v2/adressen {
      try_files /$bag_search =404;
    }

    location / {
      return 404;
    }
  }
}
