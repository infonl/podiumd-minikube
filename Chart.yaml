apiVersion: v2
name: podiumd-minikube
description: >-
  Reproduces the dimpact-zaakafhandelcomponent docker-compose dev stack on
  minikube, built on top of the published podiumd chart.
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: podiumd
    repository: "@dimpact"
    # Placeholder only - never used to actually fetch anything. The real
    # version lives in .podiumd-versions.yaml (gitignored) - run
    # podiumd-minikube set-podiumd-version to set it; podiumd-minikube deploy and
    # podiumd-minikube provision-cluster refuse to proceed with a clear message if
    # you haven't yet. See src/podiumd_minikube/dependency.py's own header
    # for why this field is never populated with a real version at all
    # (a `helm dependency update` run without going through that script
    # first - bypassing podiumd-minikube deploy and podiumd-minikube set-podiumd-version entirely - would
    # fail against this placeholder rather than silently fetching some
    # unrelated default).
    version: "0.0.0-set-via-podiumd-versions-yaml"
    condition: podiumd.enabled
  - name: monitoring-logging
    repository: "@dimpact"
    # The metrics profile. Helm fetches it even when the profile is off, so
    # .podiumd-versions.yaml always records a version; placeholder as above.
    version: "0.0.0-set-via-podiumd-versions-yaml"
    condition: metrics.enabled
