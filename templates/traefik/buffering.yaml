{{/*
Reads each request body whole and forwards it with a Content-Length, as the
NGINX Gateway Fabric edge of ExternalsPodiumD does. uWSGI apps (Objecten)
get an empty body from a chunked request: ITA's logboek POST got 403.
lib.manifests.buffer_requests attaches it to the Ingresses of uWSGI apps.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buffering
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  buffering: {}
