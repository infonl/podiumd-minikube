{{- /* frontendUrl as keycloak.PUBLIC_URL: setup-configuration discovers the endpoints at the first start, before keycloak.sync_realm runs. */}}
{{- $realm := .Files.Get "vendor/dimpact-zaakafhandelcomponent/keycloak/zaakafhandelcomponent-realm.json" | fromJson }}
{{- $_ := set $realm.attributes "frontendUrl" "https://keycloak.local" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
data:
  zaakafhandelcomponent-realm.json: {{ toJson $realm | quote }}
