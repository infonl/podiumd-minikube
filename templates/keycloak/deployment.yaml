apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        checksum/realm: {{ (.Files.Glob "vendor/dimpact-zaakafhandelcomponent/keycloak/*.json").AsConfig | sha256sum }}
    spec:
      # See templates/solr/deployment.yaml's comment.
      enableServiceLinks: false
      containers:
        - name: keycloak
          # Bumped to 26.7.1 per PodiumD 4.9's own release notes (Dimpact
          # Confluence) - mostly security/CVE fixes upstream (admin
          # fine-grained-permission bypasses, a JWE request-object signature
          # check, SAML broker login), nothing that touches --import-realm
          # or PKCE enforcement behavior this project depends on.
          image: quay.io/keycloak/keycloak:26.7.1
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HEALTH_ENABLED
              value: "true"
            # The public https host, for browsers and backends alike, as in
            # ExternalsPodiumD; the edge terminates TLS.
            - name: KC_HOSTNAME
              value: https://keycloak.local
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              value: keycloak
            - name: KC_IMPORT
              value: /opt/keycloak/data/import/zaakafhandelcomponent-realm.json
            # Bounded heap that follows what is in use: kc.sh sets -XX:+UseG1GC,
            # which the later -XX:-UseG1GC switches off for the serial GC. TieredStopAtLevel=1:
            # only the C1 compiler, less code cache and compiler memory.
            - name: JAVA_OPTS_APPEND
              value: "-Xms64m -Xmx512m -XX:ActiveProcessorCount=2 -XX:-UseG1GC -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
