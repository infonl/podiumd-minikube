apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  rules:
    - host: keycloak.local
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: keycloak
                port:
                  name: http
    # Keycloak's admin host (KC_HOSTNAME_ADMIN), as ExternalsPodiumD's keycloak-admin.
    - host: keycloak-admin.local
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: keycloak
                port:
                  name: http
