{{/*
The Secret the chart's openbao-config Job reads the Keycloak client secret
from; the chart renders it only with its Keycloak operator, which minikube
does not run.
*/}}
{{- if .Values.podiumd.openbao.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-podiumd-realm-secrets
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
type: Opaque
stringData:
  openbao-oidc-secret: {{ .Values.podiumd.openbao.configuration.secrets.keycloak_client_secret | quote }}
{{- end }}
