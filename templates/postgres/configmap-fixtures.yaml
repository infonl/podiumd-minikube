{{/*
One ConfigMap per app's fixture SQL directory - mounted separately (see
deployment.yaml) since each needs to land in its own subdirectory under
/docker-entrypoint-initdb.d/fixtures/<app>, which a single combined
ConfigMap volume mount can't do without per-key subPath entries.
Open Zaak's fixture is ZAC's catalogus and Applicaties only; podiumd's
create_required_catalogi_job adds the e2e zaaktype to that catalogus.
*/}}
{{- /* ZAC's fixture catalogus has RSIN 002564440; ZAC's bron RSIN instead, so podiumd's
     create_required_catalogi_job finds it, as in ExternalsPodiumD. */}}
{{- $fixtureRsin := "'002564440'" }}
{{- $zacRsin := printf "'%s'" .Values.podiumd.zac.organizations.bron.rsin }}
{{- range $app := list "openzaak" "openklant" "openarchiefbeheer" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-fixtures-{{ $app }}
  labels:
    {{- include "podiumd-minikube.labels" $ | nindent 4 }}
data:
  {{- range $path, $_ := $.Files.Glob (printf "vendor/dimpact-zaakafhandelcomponent/postgres/fixtures/%s/*.sql" $app) }}
  {{ base $path }}: |
    {{- $.Files.Get $path | replace $fixtureRsin $zacRsin | nindent 4 }}
  {{- end }}
---
{{- end }}
