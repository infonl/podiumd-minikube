apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume - never run two pods at once
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        checksum/init-scripts: {{ (.Files.Glob "vendor/dimpact-zaakafhandelcomponent/postgres/*").AsConfig | sha256sum }}
    spec:
      # See templates/solr/deployment.yaml's comment - avoids Kubernetes'
      # auto-injected <SERVICE_NAME>_PORT env vars colliding with any
      # container's own same-named config variable.
      enableServiceLinks: false
      containers:
        - name: postgres
          # The release's Postgres major (podiumd's global.images.postgres); PostGIS 3.5.
          image: postgis/postgis:{{ required "images.postgresMajor: set by podiumd-minikube deploy from podiumd's values.yaml" .Values.images.postgresMajor }}-3.5
          # As podiumd-infra's Azure Postgres; the default 100 ran out with
          # every profile on (each app's workers keep their connections).
          args: ["postgres", "-c", "max_connections=500"]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            # One directory per major: postgres.migrate_major restores into a fresh one.
            - name: PGDATA
              value: /var/lib/postgresql/data/pg{{ .Values.images.postgresMajor }}
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
