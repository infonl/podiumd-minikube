{{/*
Runs vendor/dimpact-zaakafhandelcomponent/openklant/create_superuser.py
against the same image/database/settings the openklant Deployment itself
uses (same envFrom Secret/ConfigMap, named "openklant" by the chart's own
fullname template) - see that script's own header for why this Job exists
at all (this chart's values.yaml has no configuration.superuser field to
begin with) and why it's safe to rerun: it's idempotent (get_or_create +
set_password), so re-applying its already-succeeded, unchanged spec is a
safe no-op like any other Job here.

With OMC on, it also creates OMC's actor (files/openklant/create_omc_actor.py).

Unlike openformulieren's own version of this Job, no DJANGO_SETTINGS_MODULE
override is needed - openklant's settings.djangoSettingsModule is never
overridden to a docker_no2fa-style shim in the first place (see
settings.disable2fa's own comment above for why this app doesn't need
one), so the ConfigMap-sourced value this Job inherits is already the
real, working openklant.conf.docker.

The image is podiumd's (its values.yaml pins the tag).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: openklant-create-superuser
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "podiumd-minikube.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-superuser
          image: "{{ .Values.podiumd.openklant.image.repository }}:{{ .Values.podiumd.openklant.image.tag }}"
          imagePullPolicy: {{ .Values.podiumd.openklant.image.pullPolicy }}
          workingDir: /app
          command:
            - sh
            - -c
            {{- if .Values.podiumd.omc.enabled }}
            - python src/manage.py shell < /app/create_superuser.py && python src/manage.py shell < /app/create_omc_actor.py
            {{- else }}
            - python src/manage.py shell < /app/create_superuser.py
            {{- end }}
          envFrom:
            - secretRef:
                name: openklant
            - configMapRef:
                name: openklant
          env:
            - name: DJANGO_SUPERUSER_USERNAME
              value: {{ .Values.podiumd.openklant.configuration.superuser.username | quote }}
            - name: DJANGO_SUPERUSER_PASSWORD
              value: {{ .Values.podiumd.openklant.configuration.superuser.password | quote }}
            - name: DJANGO_SUPERUSER_EMAIL
              value: {{ .Values.podiumd.openklant.configuration.superuser.email | quote }}
            - name: OMC_ACTOR_ID
              value: {{ .Values.podiumd.omc.settings.omc.actor.id | quote }}
          volumeMounts:
            - name: create-superuser-script
              mountPath: /app/create_superuser.py
              subPath: create_superuser.py
              readOnly: true
            - name: create-superuser-script
              mountPath: /app/create_omc_actor.py
              subPath: create_omc_actor.py
              readOnly: true
      volumes:
        - name: create-superuser-script
          configMap:
            name: openklant-create-superuser-script
