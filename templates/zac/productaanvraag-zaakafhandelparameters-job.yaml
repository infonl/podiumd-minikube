{{/*
Runs vendor/dimpact-zaakafhandelcomponent/zac/seed_productaanvraag_zaakafhandelparameters.py
against ZAC's own REST API - see that script's own header for why this is a
custom Job at all (ZAC has no setup_configuration-style declarative
mechanism of its own, unlike every Django app elsewhere in this flow) and
why it's safe to rerun: it's a plain GET-then-PUT update, not a destructive
recreate - re-applying this Job's already-succeeded, unchanged spec is a
safe no-op like any other Job here.

The script is stdlib-only; it runs on podiumd's own python image
(chart.BUNDLED_IMAGES).

The script logs in as its own Keycloak user in group beheerders (see its
header): every zaakafhandelparameters endpoint requires a user with the
beheerder PABC role, not a service account.
*/}}
{{- if .Values.podiumd.zac.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: zac-productaanvraag-zaakafhandelparameters
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  # The wait-for-zac init container below can take as long as ZAC's first boot.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        {{- include "podiumd-minikube.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      # ZAC refuses connections until WildFly has deployed it; on a fresh
      # start this Job used to fail for good before that (podiumd-tests
      # handoff section 4). Any HTTP answer below 500 means ZAC is up;
      # redirects are not followed (ZAC answers 302 to keycloak.local, which
      # does not resolve in the cluster).
      initContainers:
        - name: wait-for-zac
          image: {{ required "images.python: set by podiumd-minikube deploy from podiumd's values.yaml" .Values.images.python }}
          command:
            - python
            - -c
            - |
              import time, urllib.error, urllib.request
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              opener = urllib.request.build_opener(NoRedirect)
              while True:
                  try:
                      opener.open("http://zac/rest/", timeout=10)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code < 500:
                          break
                  except OSError:
                      pass
                  print("waiting for zac", flush=True)
                  time.sleep(5)
      containers:
        - name: seed-zaakafhandelparameters
          image: {{ required "images.python: set by podiumd-minikube deploy from podiumd's values.yaml" .Values.images.python }}
          command:
            - python
            - /app/seed_productaanvraag_zaakafhandelparameters.py
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.podiumd.zac.auth.server | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.podiumd.keycloak.config.realm | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-podiumd-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-podiumd-admin
                  key: password
            # ZAC requires https (AUTH_SSL_REQUIRED "all", as ExternalsPodiumD).
            - name: ZAC_BASE_URL
              value: https://zac.local/rest
            - name: OPENZAAK_BASE_URL
              value: https://openzaak.local
            - name: ZGW_JWT_CLIENT_ID
              value: {{ .Values.podiumd.zac.zgwApis.clientId | quote }}
            - name: ZGW_JWT_SECRET
              value: {{ .Values.podiumd.zac.zgwApis.secret | quote }}
            - name: CATALOGUS_DOMEIN
              value: "ALG"
            - name: CATALOGUS_RSIN
              value: {{ .Values.podiumd.zac.organizations.bron.rsin | quote }}
            - name: ZAAKTYPE_IDENTIFICATIE
              value: {{ .Values.podiumd.zac.productaanvraag.zaaktypeIdentificatie | quote }}
            - name: CASE_DEFINITION_KEY
              value: {{ .Values.podiumd.zac.productaanvraag.caseDefinitionKey | quote }}
            - name: DEFAULT_GROEP_ID
              value: {{ .Values.podiumd.zac.productaanvraag.defaultGroepId | quote }}
            - name: NIET_ONTVANKELIJK_RESULTAAT_NAAM
              value: {{ .Values.podiumd.zac.productaanvraag.nietOntvankelijkResultaatNaam | quote }}
            - name: PRODUCTAANVRAAGTYPE
              value: {{ .Values.podiumd.zac.productaanvraag.productaanvraagtype | quote }}
          volumeMounts:
            - name: seed-script
              mountPath: /app/seed_productaanvraag_zaakafhandelparameters.py
              subPath: seed_productaanvraag_zaakafhandelparameters.py
              readOnly: true
      volumes:
        - name: seed-script
          configMap:
            name: zac-productaanvraag-seed-script
{{- end }}
