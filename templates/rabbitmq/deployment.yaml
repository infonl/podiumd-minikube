{{/*
Only needed for opennotificaties versions before 1.16.0 - that release
dropped RabbitMQ as a dependency in favor of Celery Beat + database-
persisted schedules (see values.yaml's own opennotificaties.image.tag
comment for the ADR link). podiumd 4.8.4's bundled opennotificaties is
past that line, so the current default (opennotificaties.rabbitmqEnabled:
false) doesn't deploy this at all - but this project also needs to keep
working against podiumd 4.7.x (see set-podiumd-version.sh), whose bundled
opennotificaties predates 1.16.0 and still needs a real broker. Gated on
an explicit flag rather than deleted: flip opennotificaties.rabbitmqEnabled
to true (and see that same comment for the other settings that need to
move back to it) when selecting a podiumd version old enough to need it.
*/}}
{{- if and .Values.podiumd.opennotificaties.enabled .Values.opennotificaties.rabbitmqEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.7-alpine
          ports:
            - name: amqp
              containerPort: 5672
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Found live: 256Mi got OOMKilled (exit 137) under normal
              # steady-state load with just opennotificaties + its worker
              # connected - no traffic spike needed. RabbitMQ's own memory
              # high watermark defaults to 40% of what it reads as the
              # container's available memory, so 256Mi only gave it roughly
              # 100MB of actual working room before it started struggling,
              # and the Erlang VM's own baseline overhead ate into that too.
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
            # Default timeoutSeconds (1s) is too tight - found live,
            # same class of fix as Solr's readiness probe in step 4.
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
{{- end }}
