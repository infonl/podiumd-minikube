apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solr
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  rules:
    - host: solr.local
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: zac-solr-solrcloud-common # the solr-operator's
                port:
                  number: 80
