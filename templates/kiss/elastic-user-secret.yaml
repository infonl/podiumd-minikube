{{/*
ECK keeps an existing <cluster>-es-elastic-user Secret instead of generating
a password, so KISS's settings.elastic.password works (podiumd-infra's
ensure-kiss-elastic-secret.sh does the same).
*/}}
{{- if index .Values.podiumd "kiss-eck" "enabled" }}
apiVersion: v1
kind: Secret
metadata:
  name: kiss-es-elastic-user
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
type: Opaque
stringData:
  elastic: {{ .Values.podiumd.kiss.settings.elastic.password | quote }}
{{- end }}
