{{- $content := "" }}
{{- range $set := splitList " " (include "podiumd-minikube.wiremockSets" .) }}
{{- range $path, $_ := $.Files.Glob (printf "vendor/dimpact-zaakafhandelcomponent/wiremocks/%s/**" $set) }}
{{- $content = print $content $path ($.Files.Get $path | sha256sum) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock
  template:
    metadata:
      labels:
        app: wiremock
      annotations:
        checksum/mappings: {{ $content | sha256sum }}
    spec:
      # See templates/solr/deployment.yaml's comment.
      enableServiceLinks: false
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.2
          args: ["--disable-gzip", "--verbose"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            # WireMock's file-based mapping loader only scans flat files
            # directly in mappings/, it doesn't recurse into subdirectories -
            # so each file is mounted individually via subPath rather than
            # the whole ConfigMap as one subdirectory.
            {{- range $set := splitList " " (include "podiumd-minikube.wiremockSets" .) }}
            {{- range $path, $_ := $.Files.Glob (printf "vendor/dimpact-zaakafhandelcomponent/wiremocks/%s/mappings/*.json" $set) }}
            - name: {{ $set }}-mappings
              mountPath: /home/wiremock/mappings/{{ base $path }}
              subPath: {{ base $path }}
            {{- end }}
            {{- range $path, $_ := $.Files.Glob (printf "vendor/dimpact-zaakafhandelcomponent/wiremocks/%s/__files/*" $set) }}
            - name: {{ $set }}-files
              mountPath: /home/wiremock/__files/{{ base $path }}
              subPath: {{ base $path }}
            {{- end }}
            {{- end }}
      volumes:
        {{- range $set := splitList " " (include "podiumd-minikube.wiremockSets" .) }}
        - name: {{ $set }}-mappings
          configMap:
            name: wiremock-{{ $set }}-mappings
        - name: {{ $set }}-files
          configMap:
            name: wiremock-{{ $set }}-files
        {{- end }}
