{{- $dir := "vendor/dimpact-zaakafhandelcomponent/wiremocks/bag-wiremock" }}
{{- $content := "" }}
{{- range $path, $_ := .Files.Glob (printf "%s/**" $dir) }}
{{- $content = print $content $path ($.Files.Get $path | sha256sum) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock
  template:
    metadata:
      labels:
        app: wiremock
      annotations:
        checksum/mappings: {{ $content | sha256sum }}
    spec:
      # See templates/solr/deployment.yaml's comment.
      enableServiceLinks: false
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.2
          args: ["--disable-gzip", "--verbose"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            # WireMock's file-based mapping loader only scans flat files
            # directly in mappings/, it doesn't recurse into subdirectories -
            # so each file is mounted individually via subPath rather than
            # the whole ConfigMap as one subdirectory.
            {{- range $path, $_ := .Files.Glob (printf "%s/mappings/*.json" $dir) }}
            - name: mappings
              mountPath: /home/wiremock/mappings/{{ base $path }}
              subPath: {{ base $path }}
            {{- end }}
            {{- range $path, $_ := .Files.Glob (printf "%s/__files/*.json" $dir) }}
            - name: files
              mountPath: /home/wiremock/__files/{{ base $path }}
              subPath: {{ base $path }}
            {{- end }}
      volumes:
        - name: mappings
          configMap:
            name: wiremock-bag-wiremock-mappings
        - name: files
          configMap:
            name: wiremock-bag-wiremock-files
