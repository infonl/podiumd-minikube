{{/*
The vendored BAG mappings and response files, mounted into the WireMock pod.
*/}}
{{- $dir := "vendor/dimpact-zaakafhandelcomponent/wiremocks/bag-wiremock" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-bag-wiremock-mappings
  labels:
    {{- include "podiumd-minikube.labels" $ | nindent 4 }}
data:
  {{- ($.Files.Glob (printf "%s/mappings/*.json" $dir)).AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-bag-wiremock-files
  labels:
    {{- include "podiumd-minikube.labels" $ | nindent 4 }}
data:
  {{- ($.Files.Glob (printf "%s/__files/*.json" $dir)).AsConfig | nindent 2 }}
