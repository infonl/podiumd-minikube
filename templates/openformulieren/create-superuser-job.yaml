{{/*
Runs vendor/dimpact-zaakafhandelcomponent/openformulieren/create_superuser.py
against the same image/database/settings the openformulieren Deployment
itself uses (same envFrom Secret/ConfigMap, named "openformulieren" by the
openforms chart's own fullname template) - see that script's own header for
why this Job exists at all (this chart's configuration.superuser field is
otherwise wired to nothing) and why it's safe to leave in the general,
unguarded manifest apply unlike pabc-migrations: it's idempotent
(get_or_create + set_password), so re-applying its already-succeeded,
unchanged spec is a safe no-op like any other Job here.
*/}}
{{- if .Values.podiumd.openformulieren.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openformulieren-create-superuser
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "podiumd-minikube.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-superuser
          image: "{{ .Values.podiumd.openformulieren.image.repository }}:{{ .Values.podiumd.openformulieren.image.tag }}"
          imagePullPolicy: {{ .Values.podiumd.openformulieren.image.pullPolicy }}
          workingDir: /app
          command:
            - sh
            - -c
            - python src/manage.py shell < /app/create_superuser.py
          envFrom:
            - secretRef:
                name: openformulieren
            - configMapRef:
                name: openformulieren
          env:
            # Overrides the ConfigMap's own DJANGO_SETTINGS_MODULE
            # (openforms.conf.docker_no2fa, needed by the actual
            # Deployment - see settings.djangoSettingsModule's own
            # comment) back to the real conf.docker: that shim's own
            # module isn't mounted into this Job (no reason to - creating
            # a user via the ORM never touches a login view or 2FA at
            # all), and importing a DJANGO_SETTINGS_MODULE that doesn't
            # exist on disk here breaks Django's settings loading in a
            # confusing way (confirmed live: manifests as "AUTH_USER_MODEL
            # refers to model 'auth.User' that has not been installed",
            # not a straightforward ModuleNotFoundError).
            - name: DJANGO_SETTINGS_MODULE
              value: openforms.conf.docker
            - name: DJANGO_SUPERUSER_USERNAME
              value: {{ .Values.podiumd.openformulieren.configuration.superuser.username | quote }}
            - name: DJANGO_SUPERUSER_PASSWORD
              value: {{ .Values.podiumd.openformulieren.configuration.superuser.password | quote }}
            - name: DJANGO_SUPERUSER_EMAIL
              value: {{ .Values.podiumd.openformulieren.configuration.superuser.email | quote }}
          volumeMounts:
            - name: create-superuser-script
              mountPath: /app/create_superuser.py
              subPath: create_superuser.py
              readOnly: true
      volumes:
        - name: create-superuser-script
          configMap:
            name: openformulieren-create-superuser-script
{{- end }}
