{{/* These raw templates are the metrics profile's default implementation - superseded by the optional monitoring-logging dependency (templates from the "monitoring-logging" Chart.yaml dependency) when monitoringLogging.enabled is true, to avoid running two Grafanas and Prometheuses at once. */}}
{{- if and .Values.metrics.enabled (not .Values.monitoringLogging.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
data:
  prometheus.yaml: {{ .Files.Get "vendor/dimpact-zaakafhandelcomponent/metrics/prometheus.yaml" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
data:
  grafana-datasources.yaml: {{ .Files.Get "vendor/dimpact-zaakafhandelcomponent/metrics/grafana-datasources.yaml" | quote }}
{{- end }}
