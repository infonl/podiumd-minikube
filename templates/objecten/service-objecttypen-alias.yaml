{{- if and .Values.podiumd.objecten.enabled .Values.objecten.merged (not (dig "objecttypenCompatService" "enabled" false .Values.podiumd)) }}
# Merged objecten shape without podiumd's own objecttypen Service (helm-charts
# #631): keeps the "objecttypen" host that other apps' config uses resolving
# to the merged objecten Service.
apiVersion: v1
kind: Service
metadata:
  name: objecttypen
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: objecten.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}
