apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.30.6
          # No auth/TLS env vars needed - a single-node dev/test SMTP sink
          # every pod can relay through unauthenticated, same posture as
          # the greenmail deployment this replaces. Ports are the image's
          # own defaults (verified via `docker inspect`), so no MP_SMTP_*/
          # MP_UI_* overrides needed either.
          ports:
            - name: smtp
              containerPort: 1025
            - name: web
              containerPort: 8025
          # A static Go binary, not a JVM (unlike the greenmail image this
          # replaces) - sized well below greenmail's own 50m/128Mi/256Mi
          # footprint accordingly.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: web
      port: 8025
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  labels:
    {{- include "podiumd-minikube.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: mailpit.local
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: mailpit
                port:
                  name: web
