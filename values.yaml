          schedule: "15 6-14 * * 1-5"
          token: objectenContactToken
      oidc:
        authority: https://keycloak.local/realms/podiumd/
        clientSecret: kissClientSecret
      # As ExternalsPodiumD and podiumd-infra.
      organisatieIds:
