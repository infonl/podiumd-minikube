        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: notificaties-api
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48

        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            # Discovery on the public https host, as ExternalsPodiumD.
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: openzaak
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              # As ExternalsPodiumD: administrators are superusers, every user is staff.
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      secrets:
        # The "openzaak" client's secret in podiumd's realm config.
        keycloak_client_secret: keycloakOpenzaakClientSecret
      # No PKCE, see the data comment above.
      pkceEnabled: false
      oidcUrl: https://openzaak.local
      # Local admin login; podiumd-tests uses admin/admin.
      superuser:
        username: admin
        password: admin
        email: noreply@example.com
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      # Required: Django refuses every request without SECRET_KEY.
      secretKey: openZaakSecretKey
      # As ExternalsPodiumD: the public host, its nginx Service, and two proxies (edge, nginx).
      allowedHosts: openzaak.local,openzaak-nginx.podiumd-minikube.svc.cluster.local
      numProxies: 2
      # As ExternalsPodiumD: Secure cookies and https URLs (the edge
      # terminates TLS). Its domain for URLs built outside a request comes
      # from sites_config in configuration.data.
      isHttps: true
      # The image reads DISABLE_2FA only in its dev settings, which need
      # django-debug-toolbar; this module honours it (vendored docker_no2fa.py).
      djangoSettingsModule: openzaak.conf.docker_no2fa
      # Chart default is "localhost:25" - a compose-only value that's just
      # a no-op inside this pod in Kubernetes. Pointed at mailpit (see
      # templates/mailpit/) instead, matching compose's own openzaak-mail
      # relay role - no auth needed, mailpit accepts unauthenticated SMTP.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openzaak
        password: openzaak
        name: openzaak
      # Own Redis DBs per app, numbered as the podiumd chart's defaults (which
      # ExternalsPodiumD and podiumd-infra keep): django-solo caches singletons
      # (NotificationsConfig) under the same key in every app, so a shared DB
      # serves one app's config to another.
      cache:
        default: redis-ha-master:6379/4
        axes: redis-ha-master:6379/4
      celery:
        # Own broker DB: Celery workers sharing one consume each other's tasks
        # ("Received unregistered task of type ...", seen live).
        brokerUrl: redis://redis-ha-master:6379/5
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openzaak-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openzaak/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      hosts:
        - host: openzaak.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openklant (always on - core) ---
  openklant:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
    configuration:
      oidcUrl: https://openklant.local
      secrets:
        keycloak_client_secret: keycloakOpenklantClientSecret
      job:
        enabled: true
      # Open Klant's notifications to Open Notificaties, as podiumd-infra
      # (kees00): service notificaties-api, Open Zaak's client "zaak".
      # ExternalsPodiumD has none yet; included so the tests cover it.
      data: |-
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: notificaties-api
              label: Open Notificaties
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: zaak
              secret: zaakSecret
        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: notificaties-api
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48
        tokenauth_config_enable: true
        tokenauth:
          items:
            - identifier: contact
              token: openklantContactToken
              contact_person: Contact
              email: contact@example.com
            # As ExternalsPodiumD.
            - identifier: zac
              token: openklantZacToken
              contact_person: ZAC
              email: zac@example.com
            - identifier: ita
              token: openklantItaToken
              contact_person: ITA
              email: ita@example.com
            - identifier: omc
              token: openklantOmcToken
              contact_person: OMC
              email: omc@example.com
            # As ExternalsPodiumD.
            - identifier: openinwoner
              token: openklantOpeninwonerToken
              contact_person: Open Inwoner
              email: openinwoner@example.com
            # As ExternalsPodiumD: Open Archiefbeheer's Open Klant plugin.
            - identifier: openarchiefbeheer
              token: openklantOpenarchiefbeheerToken
              contact_person: Open Archiefbeheer
              email: openarchiefbeheer@example.com
            # As ExternalsPodiumD (dimp test, 4.9.4): Open Formulieren's customer interactions.
            - identifier: openformulieren
              token: openklantOpenformulierenToken
              contact_person: Open Formulieren
              email: openformulieren@example.com

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: openklant
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      # The chart creates no superuser; templates/openklant/create-superuser-job.yaml does.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
    flower:
      enabled: false
    worker:
      replicaCount: 1
    tags:
      redis: false
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      # See openzaak's own allowedHosts comment above - same gap, same fix.
      allowedHosts: openklant.local
      # As ExternalsPodiumD, which sets Open Klant's domain here, not in
      # sites_config.
      siteDomain: openklant.local
      isHttps: true
      # Read by the production settings (open_api_framework), no shim needed.
      disable2fa: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openklant
        password: openklant
        name: openklant
      secretKey: openKlantSecretKey
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/7
        axes: redis-ha-master:6379/7
      celery:
        # Own broker DB, see openzaak's celery comment.
        brokerUrl: redis://redis-ha-master:6379/8
        # Set both: this chart's own configmap.yaml has a typo reading
        # "resultBackendl" (not "resultBackend") - found live while fixing
        # the same bug on openarchiefbeheer's chart (see that comment).
        resultBackend: redis://redis-ha-master:6379/8
        resultBackendl: redis://redis-ha-master:6379/8
    ingress:
      enabled: true
      hosts:
        - host: openklant.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openinwoner (profile: openinwoner) ---
  # As ExternalsPodiumD and podiumd-infra: Keycloak admin login, Open Zaak client
  # "openinwoner", digidMock and eherkenningMock (the real DigiD and eHerkenning are
  # unreachable), Elasticsearch through ECK, one replica each. Not configured, as
  # both references: the e-Suite services and the Open Zaak api group.
  openinwoner:
    enabled: false
    replicaCount: 1
    # Laptop budget: one Celery child per worker (defaults 4 and 8). The chart
    # ignores worker.concurrency, so the image default needs an env var.
    extraEnvVars:
      - name: CELERY_WORKER_CONCURRENCY
        value: "1"
      # With 1 web process: the first request on a recycled worker takes 2.5-6 s
      # (Django warm-up, --lazy-apps); the image recycles every 100 requests.
      - name: UWSGI_MAX_REQUESTS
        value: "1000" # as Open Zaak, Objecten and Open Formulieren
    worker:
      replicaCount: 1
    lowLatencyWorker:
      replicaCount: 1
      concurrency: 1
    beat:
      replicaCount: 1
    nginx:
      replicaCount: 1
    tags:
      redis: false
    # Job openinwoner-configure-kvk writes KvKConfig, as podiumd-infra kees00.
    # The FQDN: Django's URLValidator rejects a host without a dot. The Job
    # bypasses manifests.route_outbound, so KvK skips the Frank!Gateway outway.
    kvk:
      apiRoot: http://api-proxy.podiumd-minikube.svc.cluster.local/api/
    configuration:
      enabled: true
      secrets:
        keycloak_client_secret: keycloakOpeninwonerClientSecret
      job:
        enabled: true
      oidcUrl: https://openinwoner.local
      data: |-
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: admin-oidc-provider
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
            - identifier: admin-oidc
              oidc_provider_identifier: admin-oidc-provider
              enabled: true
              oidc_rp_scopes_list:
                - openid
                - email
                - profile
              userinfo_claims_source: id_token
              oidc_rp_client_id: openinwoner
              oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
              oidc_rp_sign_algo: RS256
              # ExternalsPodiumD's settings in options: mozilla-django-oidc-db 2.0.1
              # stores the deprecated flat fields as group_settings, but reads
              # groups_settings at login (KeyError, a 500 on /oidc/callback/).
              options:
                user_settings:
                  claim_mappings:
                    username:
                      - preferred_username
                    first_name:
                      - given_name
                    last_name:
                      - family_name
                groups_settings:
                  claim_mapping:
                    - groups
                  superuser_group_names:
                    - administrators
                  make_users_staff: true
                  sync: true

        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: openzaak-zaken-api
              label: Open Zaak - Zaken API
              api_root: https://openzaak.local/zaken/api/v1/
              api_type: zrc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: openzaak-documenten-api
              label: Open Zaak - Documenten API
              api_root: https://openzaak.local/documenten/api/v1/
              api_type: drc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: openzaak-catalogi-api
              label: Open Zaak - Catalogi API
              api_root: https://openzaak.local/catalogi/api/v1/
              api_type: ztc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: openzaak-besluiten-api
              label: Open Zaak - Besluiten API
              api_root: https://openzaak.local/besluiten/api/v1/
              api_type: brc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: vng-selectielijst
              label: VNG Selectielijst
              api_root: https://selectielijst.openzaak.nl/api/v1/
              api_type: orc
              auth_type: no_auth
            - identifier: brp-api
              label: BRP API proxy
              api_root: http://api-proxy/haalcentraal/api/brp/
              api_type: orc
              auth_type: no_auth
            - identifier: kvk-api
              label: KVK API proxy
              api_root: http://api-proxy/api/
              api_type: orc
              auth_type: no_auth
            - identifier: bag-api
              label: BAG API proxy
              api_root: http://api-proxy/lvbag/individuelebevragingen/v2/
              api_type: orc
              auth_type: no_auth
            - identifier: notificaties-api
              label: Notificaties API
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret

        sites_config_enable: true
        sites_config:
          items:
            - domain: openinwoner.local
              name: Open Inwoner
    settings:
      # Laptop budget: 1 web process (image default 4); see UWSGI_MAX_REQUESTS above.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: openInwonerSecretKey
      allowedHosts: openinwoner.local,openinwoner-nginx.podiumd-minikube.svc.cluster.local
      isHttps: true
      numProxies: 2
      digidMock: true
      eherkenningMock: true
      database:
        host: postgres
        port: 5432
        name: openinwoner
        username: openinwoner
        password: openinwoner
      email:
        host: mailpit
        port: 1025
        useTLS: false
        defaultFrom: noreply@example.com
      # The chart's default DBs, on this chart's single Redis.
      cache:
        default: redis-ha-master:6379/11
        axes: redis-ha-master:6379/11
      celery:
        brokerUrl: redis://redis-ha-master:6379/12
        resultBackend: redis://redis-ha-master:6379/12
    # ExternalsPodiumD's nodeSet: one node, anonymous superuser (Open
    # Inwoner sends no credentials), minus its Azure nodeSelector and
    # storage class.
    eck-elasticsearch:
      annotations:
        co.elastic.co/config-checksum: "xpack-anonymous-auth"
      nodeSets:
        - name: default
          count: 1
          config:
            cluster.initial_master_nodes:
              - openinwoner-elasticsearch-es-default-0
            node.roles:
              - master
              - data
              - ingest
            node.store.allow_mmap: false
            # Laptop budget: thread pools sized for 1 CPU instead of the node's 6.
            node.processors: 1
            # Laptop budget: no ML module (its native controller); nothing here uses ML.
            xpack.ml.enabled: false
            xpack.security.authc:
              anonymous:
                username: anonymous
                roles: superuser
                authz_exception: false
          podTemplate:
            spec:
              terminationGracePeriodSeconds: 60
              containers:
                - name: elasticsearch
                  resources:
                    requests:
                      cpu: 200m
                      memory: 1536Mi
                    limits:
                      cpu: 1000m
                      memory: 1536Mi
                  env:
                    - name: ES_JAVA_OPTS
                      value: *esJavaOpts
                    - name: PRE_STOP_ADDITIONAL_WAIT_SECONDS
                      value: "15"
          volumeClaimTemplates:
            - metadata:
                name: elasticsearch-data
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 8Gi

  # --- pabc (always on - core) ---
  pabc:
    enabled: true
    replicaCount: 1
    postgresql:
      enabled: false # point at the shared Postgres instead of the chart's bundled bitnami one
    # As ExternalsPodiumD's ontw environments (icat, dim1): PABC seeded once
    # from podiumd's files/pabc-dataset.json, its realm roles and groups by the Keycloak Job.
    datasetConfigMap:
      enabled: true
    seedJob:
      enabled: true
    settings:
      database:
        host: postgres
        port: 5432
        username: pabc
        password: pabc
        name: pabc
      apiKeys:
        - zac-test-api-key
      oidc:
        authority: https://keycloak.local/realms/podiumd/
        oidcUrl: https://pabc.local
        clientId: pabc
        clientSecret: pabcClientSecret
        functioneelBeheerderRole: administrator
        # As ExternalsPodiumD: the username claim. requireHttps and
        # pkceEnabled stay at the chart defaults (Keycloak is https here; the
        # pabc chart does not read pkceEnabled, the vendored realm's "pabc"
        # client requires S256, which PABC's middleware always sends).
        nameClaimType: preferred_username
      keycloakAdmin:
        clientId: pabc-admin-client
        clientSecret: pabcAdminClientSecret
    ingress:
      enabled: true
      hosts:
        - host: pabc.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- brp-personen-mock (always on - core) ---
  brppersonenmock:
    enabled: true
    # Its default nameOverride "brp-personen-mock" is the api-proxy's target.

  # --- api-proxy (always on), as ExternalsPodiumD ---
  # Apps call BRP, KvK and BAG at http://api-proxy/<path>: BRP goes to
  # brp-personen-mock, KvK to KvK's test API (needs internet), BAG to
  # templates/bag-mock (Kadaster's key is not public). Also served on api-proxy.local.
  apiproxy:
    enabled: true
    resolverIp: 10.96.0.10 # minikube's kube-dns; the chart's 10.0.0.10 is AKS's
    locations:
      bag:
        hostHeader: bag-mock
        targetUrl: http://bag-mock:8080/lvbag/individuelebevragingen/v2/
      brp:
        hostHeader: brp-personen-mock
        targetUrl: http://brp-personen-mock:5010/haalcentraal/api/brp/
      # KvK's public test-environment key (developers.kvk.nl), as podiumd-infra;
      # podiumd_minikube.openbao also stores it for the Frank!Gateway outway.
      kvkSearch:
        apikey: &kvkTestApiKey l7xx1f2691f2520d487b902f4e0b57a0b197
        hostHeader: api.kvk.nl
        path: /api/v2/zoeken
        targetUrl: https://api.kvk.nl/test/api/v2/zoeken
      kvkBasic:
        apikey: *kvkTestApiKey
        hostHeader: api.kvk.nl
        path: /api/v1/basisprofielen
        targetUrl: https://api.kvk.nl/test/api/v1/basisprofielen
      kvkBranch:
        apikey: *kvkTestApiKey
        hostHeader: api.kvk.nl
        path: /api/v1/vestigingsprofielen
        targetUrl: https://api.kvk.nl/test/api/v1/vestigingsprofielen

  # --- Optional profiles: podiumd.<app>.enabled, all set by deploy --full. ---

  # --- objecten (+ objecttypen, its always-on dependency once either
  # profile is on) ---
  objecten:
    enabled: false
    replicaCount: 1
    worker:
      replicaCount: 1
    flower:
      enabled: false # as podiumd
    tags:
      redis: false
    configuration:
      enabled: true
      # Open Object only (podiumd >= 4.10): podiumd's create-required-objecttypen
      # Job calls oidcUrl's API with this superuser token (manifests.fixup_merged_objecten).
      oidcUrl: https://objecten.local
      secrets:
        keycloak_client_secret: keycloakObjectenClientSecret
        create_required_objecttypen_token: objectenRequiredObjecttypenToken
      job:
        # The productaanvraag flow's Objects API side: Objecttypen and Open Notificaties
        # services, the productaanvraag objecttype, and ZAC's and Open Formulieren's tokens.
        enabled: true
      # The image creates this user at start (OBJECTS_SUPERUSER_*).
      superuser:
        username: admin
        password: admin
        email: admin@example.com
      # objecttypen-api: dotted Service name, see ZAC's zgwApis.url.
      # notificaties-api: "object created" notifications, client "notificaties" as ExternalsPodiumD.
      # objecttypes_config: references by UUID; create_required_objecttypen_job creates them.
      # tokenauth "zaak" (ZAC) and "formulier" (Open Formulieren, Open Zaak): only on
      # Productaanvraag-Dimpact, as podiumd-infra.
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: objecten.local
              name: Objecten

        zgw_consumers_config_enable: True
        zgw_consumers:
          services:
            - identifier: objecttypen-api
              label: Objecttypen API
              api_root: https://objecttypen.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token objectenToObjecttypenToken

            - identifier: notificaties-api
              label: Open Notificaties
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret

            # As ExternalsPodiumD.
            - identifier: autorisaties-api
              label: Open Zaak - Autorisaties API
              api_root: https://openzaak.local/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: objecten
              secret: objectenSecret

        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: notificaties-api
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48

        objecttypes_config_enable: true
        # podiumd<4.10: service_identifier exists only in the classic shape; Open Object
        # rejects it, so manifests.fixup_merged_objecten removes it there.
        objecttypes:
          items:
            # podiumd-infra's only Productaanvraag-Dimpact, created by
            # podiumd.objecttypen.create_required_objecttypen_job.
            - service_identifier: objecttypen-api
              uuid: 11a5f7fd-013e-4e29-9cd1-738249fc3479
              name: Productaanvraag-Dimpact
            # KISS/ITA, as ExternalsPodiumD; UUIDs fixed by
            # podiumd.objecttypen.create_required_objecttypen_job.
            - service_identifier: objecttypen-api
              uuid: 90984726-2692-49d8-8f9d-742075cb761d
              name: Medewerker
            - service_identifier: objecttypen-api
              uuid: c8d301f9-80b8-4575-8b29-3e9431f92994
              name: Afdeling
            - service_identifier: objecttypen-api
              uuid: cbec27ac-157b-490b-b586-9e8a8f5bbb85
              name: Groep
            - service_identifier: objecttypen-api
              uuid: 72240cd6-29bb-4a66-b1c3-ab6589a39a22
              name: InterneTaak
            - service_identifier: objecttypen-api
              uuid: e4d2e353-80ea-4962-8276-920d59a3e8de
              name: Kennisartikel
            - service_identifier: objecttypen-api
              uuid: 6a0d8f9d-f7e2-4e57-a91b-01656968a62d
              name: VAC
            - service_identifier: objecttypen-api
              uuid: 2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
              name: Activiteitenlog

        tokenauth_config_enable: true
        tokenauth:
          items:
            - identifier: zaak
              token: objectenZaakToken
              contact_person: ZAC
              email: zac@example.com
              application: ZAC
              permissions:
                - object_type: 11a5f7fd-013e-4e29-9cd1-738249fc3479
                  mode: read_and_write
            - identifier: formulier
              token: objectenFormulierToken
              contact_person: Open Formulieren
              email: openformulieren@example.com
              application: Open Formulieren
              permissions:
                - object_type: 11a5f7fd-013e-4e29-9cd1-738249fc3479
                  mode: read_and_write
            # As ExternalsPodiumD (icat).
            - identifier: contact
              token: objectenContactToken
              contact_person: Contact
              email: contact@example.com
              application: Contact
              permissions:
                - object_type: 90984726-2692-49d8-8f9d-742075cb761d
                  mode: read_and_write
                - object_type: c8d301f9-80b8-4575-8b29-3e9431f92994
                  mode: read_and_write
                - object_type: cbec27ac-157b-490b-b586-9e8a8f5bbb85
                  mode: read_and_write
                - object_type: 72240cd6-29bb-4a66-b1c3-ab6589a39a22
                  mode: read_and_write
                - object_type: e4d2e353-80ea-4962-8276-920d59a3e8de
                  mode: read_and_write
                - object_type: 6a0d8f9d-f7e2-4e57-a91b-01656968a62d
                  mode: read_and_write
            - identifier: ita
              token: objectenItaToken
              contact_person: ITA
              email: ita@example.com
              application: ITA
              # As ExternalsPodiumD's test environment (dimp/test, also icat and
              # info) and podiumd-infra: Medewerker too, ITA reads a user's
              # groepen from it; dim1 alone leaves it out.
              permissions:
                - object_type: c8d301f9-80b8-4575-8b29-3e9431f92994
                  mode: read_and_write
                - object_type: cbec27ac-157b-490b-b586-9e8a8f5bbb85
                  mode: read_and_write
                - object_type: 2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
                  mode: read_and_write
                - object_type: 90984726-2692-49d8-8f9d-742075cb761d
                  mode: read_and_write
            - identifier: omc
              token: objectenOmcToken
              contact_person: OMC
              email: omc@example.com
              application: OMC
              permissions:
                - object_type: c8d301f9-80b8-4575-8b29-3e9431f92994
                  mode: read_and_write
                - object_type: cbec27ac-157b-490b-b586-9e8a8f5bbb85
                  mode: read_and_write
                - object_type: 2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
                  mode: read_and_write
            - identifier: openbeheer-token
              token: objectenOpenbeheerToken
              contact_person: Open Beheer
              email: openbeheer@example.com
              is_superuser: true
            # As ExternalsPodiumD.
            - identifier: integratieteam
              token: objectenIntegratieteamToken
              contact_person: Integratieteam
              email: integratieteam@example.com
              is_superuser: true
            # As ExternalsPodiumD: Open Archiefbeheer's Objecten plugin, no object type permissions.
            - identifier: openarchiefbeheer
              token: objectenOpenarchiefbeheerToken
              contact_person: Open Archiefbeheer
              email: openarchiefbeheer@example.com

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: objecten
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
    # django-solo's cache of NotificationsConfig went stale (seen live); see
    # templates/objecten/configmap-no-solo-cache-settings.yaml.
    extraVolumes:
      - name: no-solo-cache-settings
        configMap:
          name: objecten-no-solo-cache-settings
    extraVolumeMounts:
      - name: no-solo-cache-settings
        subPath: docker_no_solo_cache.py
        mountPath: /app/src/objects/conf/docker_no_solo_cache.py
        readOnly: true
    settings:
      # Laptop budget: 1 web process (image default 4); 2 threads keep requests concurrent.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: objectenApiSecretKey
      # As ExternalsPodiumD: also its internal Service, which KISS calls. The
      # objecttypen names reach Open Object (podiumd >= 4.10), which serves both APIs.
      allowedHosts: objecten.local,objecten.podiumd-minikube.svc.cluster.local,objecttypen,objecttypen.podiumd-minikube,objecttypen.local
      # Open Object only (podiumd >= 4.10); its chart requires it.
      siteDomain: objecten.local
      # See openzaak's isHttps comment.
      isHttps: true
      djangoSettingsModule: objects.conf.docker_no_solo_cache
      # Read by the production settings (open_api_framework), no shim needed.
      disable2fa: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        # Compose's objecten-api-database container's actual Postgres
        # user/db is literally named "objects", not "objecten" - copied
        # as-is, matching 00-create-databases.sql.
        username: objecten # as ExternalsPodiumD
        password: objecten
        name: objecten
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/1
        axes: redis-ha-master:6379/1
        # Compose never sets an OIDC-cache env var for objecten either -
        # see opennotificaties's identical CACHE_OIDC comment above (same
        # unconditional-render leak, same fix).
        oidc: redis-ha-master:6379/1
      celery:
        brokerUrl: redis://redis-ha-master:6379/2
        # Set both: see openklant/openarchiefbeheer's identical comment -
        # this chart's own configmap.yaml has the same "resultBackendl" typo.
        resultBackend: redis://redis-ha-master:6379/2
        resultBackendl: redis://redis-ha-master:6379/2
    ingress:
      enabled: true
      hosts:
        - host: objecten.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: objecten
      storageClassName: ""
      size: 10Gi

  # podiumd<4.10: the separate objecttypen subchart.
  objecttypen:
    enabled: false
    replicaCount: 1
    # No worker/beat/flower/redis blocks exist on this chart at all - it's
    # a stateless API with no celery use.
    configuration:
      enabled: true
      secrets:
        keycloak_client_secret: keycloakObjecttypenClientSecret
      job:
        # Only creates the tokens below: Objecttypen's setup_configuration has
        # no step for objecttypes; create_required_objecttypen_job creates them,
        # published.
        enabled: true
      # The Deployment reads these through envFrom even with job.enabled false.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
      # Tokens for the productaanvraag objecttype's readers: Objecten and Open
      # Formulieren (its admin lists objecttypes for a registration backend).
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: objecttypen.local
              name: Objecttypen

        tokenauth_config_enable: true
        tokenauth:
          items:
            - identifier: objecten
              token: objectenToObjecttypenToken
              contact_person: podiumd-minikube
              email: objecten@example.com
              application: Objects API
            - identifier: formulier
              token: openFormulierenToObjecttypenToken
              contact_person: Open Formulieren
              email: openformulieren@example.com
              application: Open Formulieren
            - identifier: integratieteam
              token: objecttypenIntegratieteamToken
              contact_person: Integratieteam
              email: integratieteam@example.com
            - identifier: omc
              token: objecttypenOmcToken
              contact_person: OMC
              email: omc@example.com
            # As ExternalsPodiumD.
            - identifier: zaak
              token: objecttypenZaakToken
              contact_person: Open Zaak
              email: zaak@example.com
            - identifier: openbeheer-token
              token: objecttypenOpenbeheerToken
              contact_person: Open Beheer
              email: openbeheer@example.com
              organization: Open Beheer
              application: Open Beheer
              administration: Open Beheer

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: objecttypen
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      # For create_required_objecttypen_job.
      oidcUrl: https://objecttypen.local
      token: objecttypenIntegratieteamToken
    # The KISS/ITA objecttypes, as podiumd; downloads each schema from
    # GitHub only when it creates that objecttype.
    create_required_objecttypen_job:
      enabled: true
    # See settings.djangoSettingsModule below for why this mount exists -
    # same ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # for openzaak's/opennotificaties'/openarchiefbeheer's own
    # docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: objecttypen-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/objecttypes/conf/docker_no2fa.py
        readOnly: true
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      secretKey: objecttypesApiSecretKey
      allowedHosts: objecttypen.local
      # The image reads DISABLE_2FA only in its dev settings; see openzaak's
      # djangoSettingsModule.
      djangoSettingsModule: objecttypes.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: objecttypen # as ExternalsPodiumD
        password: objecttypen
        name: objecttypen
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/0
        axes: redis-ha-master:6379/0
    ingress:
      enabled: true
      hosts:
        - host: objecttypen.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- opennotificaties ---
  opennotificaties:
    enabled: false
    replicaCount: 1
    # No image.tag pin: tracks the podiumd chart's version. Since 1.16.0
    # Celery Beat sends the scheduled notifications.
    worker:
      replicaCount: 1
    beat:
      replicaCount: 1
    flower:
      enabled: false # already the chart default; explicit for clarity
    tags:
      redis: false
    configuration:
      enabled: true
      oidcUrl: https://opennotificaties.local
      secrets:
        keycloak_client_secret: keycloakOpennotificatiesClientSecret
      job:
        # The objecten kanaal and ZAC's abonnement, so a submitted form creates a zaak.
        enabled: true
      superuser:
        # Matches compose's OPENNOTIFICATIES_SUPERUSER_USERNAME/_EMAIL and
        # DJANGO_SUPERUSER_PASSWORD exactly.
        username: admin
        password: admin
        email: admin@example.com
      # ZAC's abonnement has ExternalsPodiumD's kanalen (dim1): objecten for
      # productaanvragen, zaken and documenten for its Solr index, besluiten and zaaktypen.
      # autorisaties-api is required: without it Open Notificaties asks the public
      # autorisaties-api.vng.cloud and rejects every notification (403). Client
      # "notificaties", as ExternalsPodiumD.
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: opennotificaties.local
              name: Open Notificaties

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: opennotificaties
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true

        zgw_consumers_config_enable: True
        zgw_consumers:
          services:
            - identifier: autorisaties-api
              label: Open Zaak - Autorisaties API
              api_root: https://openzaak.local/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret
            # As ExternalsPodiumD: its own notifications, as client "notificaties".
            - identifier: notificaties-api
              label: Notificaties API
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret

        notifications_config_enable: True
        notifications_config:
          notifications_api_service_identifier: notificaties-api
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48

        autorisaties_api_config_enable: True
        autorisaties_api:
          authorizations_api_service_identifier: autorisaties-api

        vng_api_common_credentials_config_enable: True
        vng_api_common_credentials:
          items:
            # Open Zaak's notifications (client "zaak", as ExternalsPodiumD).
            - identifier: zaak
              secret: zaakSecret
            - identifier: notificaties
              secret: notificatiesSecret
            - identifier: objecten
              secret: objectenSecret

        notifications_kanalen_config_enable: true
        # Kanalen and filters as ExternalsPodiumD; internetaken,
        # klantcontacten and partijen as podiumd-infra (kees00). Defined
        # here because this Job re-runs every deploy: a kanaal listed
        # without filters would lose filters set elsewhere.
        notifications_kanalen_config:
          items:
            - naam: autorisaties
              filters:
                - autorisaties
            - naam: besluittypen
              filters:
                - catalogus
            - naam: informatieobjecttypen
              filters:
                - catalogus
            - naam: zaaktypen
              filters:
                - catalogus
            - naam: zaken
              filters:
                - bronorganisatie
                - zaaktype
                - vertrouwelijkheidaanduiding
            - naam: documenten
              filters:
                - bronorganisatie
                - informatieobjecttype
                - vertrouwelijkheidaanduiding
            - naam: besluiten
              filters:
                - verantwoordelijke_organisatie
                - besluittype
            - naam: objecten
              filters:
                - object
                - object_type
            - naam: internetaken
              filters:
                - nummer
                - gevraagde_handeling
                - toelichting
                - status
            - naam: klantcontacten
              filters:
                - hoofd_onderwerp_type
                - indicatie_contact_gelukt
                - verdere_actie_ondernomen
            - naam: partijen
              filters:
                - nummer
                - interne_notitie
                - soort_partij

        notifications_abonnementen_config_enable: true
        notifications_abonnementen_config:
          items:
            # Fixed uuid so re-running setup_configuration (idempotent, per
            # its own --help text) always updates the same abonnement
            # rather than accumulating duplicates.
            - uuid: fb4e3474-18c8-474b-94ae-980850ea4a7f
              callback_url: https://zac.local/rest/notificaties
              auth: openNotificatiesApiSecretKey
              kanalen:
                - naam: objecten
                - naam: zaken
                - naam: documenten
                - naam: besluiten
                - naam: zaaktypen
    settings:
      # Laptop budget: 1 web process (image default 4); 2 threads keep requests concurrent.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: opennotificatiesApiSecretKey
      allowedHosts: opennotificaties.local
      # See openzaak's isHttps comment.
      isHttps: true
      # Same DISABLE_2FA shim as openzaak (the package is "nrc").
      djangoSettingsModule: nrc.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: opennotificaties
        password: opennotificaties
        name: opennotificaties
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/3
        axes: redis-ha-master:6379/3
        # The chart always renders CACHE_OIDC; unset, it points at podiumd's production Redis.
        oidc: redis-ha-master:6379/3
      celery:
        # Own broker DB, see openzaak's celery comment.
        brokerUrl: redis://redis-ha-master:6379/6
        # PUBLISH_BROKER_URL has its own dedicated field (confirmed live
        # against secret.yaml) - matches brokerUrl now that both are Redis.
        publishBrokerUrl: redis://redis-ha-master:6379/6
        # Set here and in settings.messageBroker.celeryResultBackend: the ConfigMap and
        # the Secret both set CELERY_RESULT_BACKEND, and envFrom order decides which wins.
        resultBackend: redis://redis-ha-master:6379/6
      messageBroker:
        celeryResultBackend: redis://redis-ha-master:6379/6
    # See settings.djangoSettingsModule above for why this mount exists -
    # same ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # for openzaak's/openarchiefbeheer's own docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: opennotificaties-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/nrc/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      hosts:
        - host: opennotificaties.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: opennotificaties
      storageClassName: ""
      size: 10Gi

  # --- openarchiefbeheer ---
  openarchiefbeheer:
    enabled: false
    # Laptop budget: 1 web process with 2 threads (image default 4 x 1); the
    # chart ignores settings.uwsgi.
    extraEnvVars:
      - name: UWSGI_PROCESSES
        value: "1"
      - name: UWSGI_THREADS
        value: "2"
    # replicaCount, worker, beat and nginx already default to 1.
    tags:
      redis: false
    configuration:
      oidcUrl: https://openarchiefbeheer-ui.local
      secrets:
        keycloak_client_secret: keycloakOpenarchiefbeheerClientSecret
      job:
        enabled: true
      # Services as ExternalsPodiumD, with client "openarchiefbeheer".
      data: |-
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
          - identifier: openzaak-zaken-api
            label: Open Zaak - Zaken API
            api_root: https://openzaak.local/zaken/api/v1/
            api_type: zrc
            auth_type: zgw
            client_id: openarchiefbeheer
            secret: openarchiefbeheerSecret
          - identifier: openzaak-documenten-api
            label: Open Zaak - Documenten API
            api_root: https://openzaak.local/documenten/api/v1/
            api_type: drc
            auth_type: zgw
            client_id: openarchiefbeheer
            secret: openarchiefbeheerSecret
          - identifier: openzaak-catalogi-api
            label: Open Zaak - Catalogi API
            api_root: https://openzaak.local/catalogi/api/v1/
            api_type: ztc
            auth_type: zgw
            client_id: openarchiefbeheer
            secret: openarchiefbeheerSecret
          - identifier: openzaak-besluiten-api
            label: Open Zaak - Besluiten API
            api_root: https://openzaak.local/besluiten/api/v1/
            api_type: brc
            auth_type: zgw
            client_id: openarchiefbeheer
            secret: openarchiefbeheerSecret
          - identifier: vng-selectielijst
            label: Open Zaak (public) - Selectielijst API
            api_root: https://selectielijst.openzaak.nl/api/v1/
            api_type: orc
            auth_type: no_auth
          # As ExternalsPodiumD: the external registers' services.
          - identifier: objecten-api
            label: Objecten API
            api_root: https://objecten.local/api/v2/
            api_type: orc
            auth_type: api_key
            header_key: Authorization
            header_value: Token objectenOpenarchiefbeheerToken
          - identifier: openklant-klantinteracties
            label: Open Klant - Klantinteracties API
            api_root: https://openklant.local/klantinteracties/api/v1/
            api_type: kc
            auth_type: api_key
            header_key: Authorization
            header_value: Token openklantOpenarchiefbeheerToken
        api_configuration_enabled: true
        api_configuration:
          selectielijst_service_identifier: vng-selectielijst
        external_registers_enabled: true
        external_registers:
          openklant:
            enabled: true
            services_identifiers:
              - openklant-klantinteracties
          objecten:
            enabled: true
            services_identifiers:
              - objecten-api
        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: abc # podiumd's client id, as ExternalsPodiumD
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: false
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      # The chart creates no superuser; templates/openarchiefbeheer/create-superuser-job.yaml does.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
    # The image reads DISABLE_2FA only in its dev settings, which need
    # django-debug-toolbar; this module honours it (vendored docker_no2fa.py).
    settings:
      djangoSettingsModule: openarchiefbeheer.conf.docker_no2fa
      secretKey: oabSecretKey
      # As ExternalsPodiumD: the public host and the in-cluster nginx Service.
      allowedHosts: openarchiefbeheer-ui.local,openarchiefbeheer-nginx.podiumd-minikube.svc.cluster.local
      # See openzaak's isHttps comment.
      isHttps: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openarchiefbeheer
        password: openarchiefbeheer
        name: openarchiefbeheer
      cors:
        allowedOrigins: https://openarchiefbeheer-ui.local
      csrf:
        trustedOrigins: https://openarchiefbeheer-ui.local
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/13
        axes: redis-ha-master:6379/13
        choices: redis-ha-master:6379/14
      celery:
        brokerUrl: redis://redis-ha-master:6379/14
        # Set both: the chart's configmap.yaml reads "resultBackendl" (a typo).
        resultBackend: redis://redis-ha-master:6379/14
        resultBackendl: redis://redis-ha-master:6379/14
      frontend:
        # As ExternalsPodiumD and podiumd-infra: the UI's own host. The UI's CSP
        # (default-src 'self') refuses an API on another host.
        apiUrl: https://openarchiefbeheer-ui.local
        apiPath: /api/v1
        zaakUrlTemplate: "https://zac.local/zaken/{identificatie}"
      frontendUrl: https://openarchiefbeheer-ui.local
      requestsReadTimeout: "5000"
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openarchiefbeheer-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openarchiefbeheer/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      hosts:
        - host: openarchiefbeheer-ui.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: openarchiefbeheer
      storageClassName: ""
      size: 10Gi

  # --- openformulieren (aliased from the openforms chart) ---
  openformulieren:
    enabled: false
    # also pulls in objecten + objecttypen + opennotificaties (compose's
    # own "openformulieren" profile transitively enables all three - see
    # top-level openformulieren.enabled's comment).
    replicaCount: 1
    # As ExternalsPodiumD (dimp test, 4.9.4): the "Open Klant" customer
    # interactions API group, from the openklant-api service below.
    customerInteractionsConfigJob:
      enabled: true
    nginx:
      replicaCount: 1
    worker:
      replicaCount: 1
      concurrency: 1 # laptop budget; chart default 4
    beat:
      replicaCount: 1
    flower:
      enabled: false # chart default is true; not run in compose
    tags:
      redis: false
    configuration:
      enabled: true
      oidcUrl: https://openformulieren-nginx.local
      secrets:
        keycloak_client_secret: keycloakOpenformulierenClientSecret
      job:
        # Services and API groups of the productaanvraag flow.
        enabled: true
      # The chart creates no superuser; templates/openformulieren/create-superuser-job.yaml does.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
      # openzaak-*: dotted Service name, see ZAC's zgwApis.url; client "formulier",
      # as ExternalsPodiumD.
      data: |-
        zgw_consumers_config_enable: True
        zgw_consumers:
          services:
            # As ExternalsPodiumD.
            - identifier: brp-api
              label: BRP API proxy
              api_root: http://api-proxy/haalcentraal/api/brp/
              api_type: orc
              auth_type: no_auth
            - identifier: kvk-api
              label: KVK API proxy
              api_root: http://api-proxy/api/
              api_type: orc
              auth_type: no_auth
            - identifier: bag-api
              label: BAG API proxy
              api_root: http://api-proxy/lvbag/individuelebevragingen/v2/
              api_type: orc
              auth_type: no_auth
            - identifier: openzaak-zaken-api
              label: Open Zaak - Zaken API
              api_root: https://openzaak.local/zaken/api/v1/
              api_type: zrc
              auth_type: zgw
              client_id: formulier
              secret: formulierSecret

            - identifier: openzaak-documenten-api
              label: Open Zaak - Documenten API
              api_root: https://openzaak.local/documenten/api/v1/
              api_type: drc
              auth_type: zgw
              client_id: formulier
              secret: formulierSecret

            - identifier: openzaak-catalogi-api
              label: Open Zaak - Catalogi API
              api_root: https://openzaak.local/catalogi/api/v1/
              api_type: ztc
              auth_type: zgw
              client_id: formulier
              secret: formulierSecret

            - identifier: objecten-api
              label: Objects API
              api_root: https://objecten.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token objectenFormulierToken

            - identifier: objecttypen-api
              label: Objecttypen API
              api_root: https://objecttypen.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token openFormulierenToObjecttypenToken

            # As ExternalsPodiumD. Its "pdok" service is left out: Open
            # Formulieren's own migrations already create a service with that
            # api_root (no identifier), and a second one violates
            # zgw_consumers_service_api_root_key.
            - identifier: vng-selectielijst
              label: VNG Selectielijst
              api_root: https://selectielijst.openzaak.nl/api/v1/
              api_type: orc
              auth_type: no_auth

            # As ExternalsPodiumD (dimp test, 4.9.4); customerInteractionsConfigJob uses it.
            - identifier: openklant-api
              label: Open Klant - Klantinteracties API
              api_root: https://openklant.local/klantinteracties/api/v1/
              api_type: kc
              auth_type: api_key
              header_key: Authorization
              header_value: Token openklantOpenformulierenToken

        objects_api_config_enable: True
        objects_api:
          groups:
            - identifier: local-objects-api
              name: Local Objects API
              objects_service_identifier: objecten-api
              objecttypes_service_identifier: objecttypen-api
              documenten_service_identifier: openzaak-documenten-api
              catalogi_service_identifier: openzaak-catalogi-api
              organisatie_rsin: "856683164"

        # As ExternalsPodiumD's "Open Zaak" ZGW registration backend; the RSIN is
        # ZAC's bron RSIN. Open Forms 4.0 takes no catalogue or document types here.
        zgw_api_config_enable: True
        zgw_api:
          groups:
            - identifier: openzaak
              name: Open Zaak
              zaken_service_identifier: openzaak-zaken-api
              documenten_service_identifier: openzaak-documenten-api
              catalogi_service_identifier: openzaak-catalogi-api
              organisatie_rsin: "856683164"
              auteur: Aanvrager
              zaak_vertrouwelijkheidaanduiding: openbaar
              doc_vertrouwelijkheidaanduiding: openbaar
              objects_api_json_content_template: |-
                {
                  "data": {% json_summary %},
                  "type": "{{ "{{" }} productaanvraag_type {{ "}}" }}",
                  "bsn": "{{ "{{" }} variables.auth_bsn {{ "}}" }}",
                  "submission_id": "{{ "{{" }} submission.kenmerk {{ "}}" }}",
                  "language_code": "{{ "{{" }} submission.language_code {{ "}}" }}"
                }

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: openformulieren
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
    # The production settings read DISABLE_2FA (openforms/conf/base.py); the
    # chart has no setting for it.
    extraEnvVars:
      - name: DISABLE_2FA
        value: "True"
    settings:
      # Laptop budget: 1 web process (image default 4); 2 threads keep requests concurrent.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: openFormulierenSecretKey
      allowedHosts: openformulieren-nginx.local,openformulieren-nginx.podiumd-minikube.svc.cluster.local
      # As ExternalsPodiumD and podiumd-infra: the public host. Mails drop links
      # to any other host (the pause mail's resume link).
      baseUrl: "https://openformulieren-nginx.local"
      # See openzaak's isHttps comment.
      isHttps: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openformulieren
        password: openformulieren
        name: openformulieren
      cache:
        default: redis-ha-master:6379/9
        axes: redis-ha-master:6379/9
        portalLocker: redis-ha-master:6379/9
      celery:
        brokerUrl: redis://redis-ha-master:6379/10
        # Set both: see openklant/objecten/openarchiefbeheer's identical
        # comment - this chart's own configmap.yaml has the same
        # "resultBackendl" typo.
        resultBackend: redis://redis-ha-master:6379/10
        resultBackendl: redis://redis-ha-master:6379/10
      # As ExternalsPodiumD: its own public host only; two proxies (edge, nginx).
      cors:
        allowAllOrigins: false
        allowedOrigins:
          - https://openformulieren-nginx.local
      csp:
        reportSave: true
      numProxies: 2
    ingress:
      enabled: true
      hosts:
        - host: openformulieren-nginx.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: openformulieren
      storageClassName: ""
      size: 10Gi

