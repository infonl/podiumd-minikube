      allowedHosts: openbeheer.local,openbeheer-nginx.podiumd-minikube.svc.cluster.local
      apiDomain: openbeheer.local
      secretKey: openbeheerSecretKey
      environment: podiumd-minikube
      database:
        host: postgres
        port: 5432
        name: openbeheer
        username: openbeheer
        password: openbeheer
      email:
        host: mailpit
        port: 1025
        useTLS: false
        defaultFrom: noreply@example.com
      cache:
        default: redis:6379/17
        axes: redis:6379/17

  # --- omc (profile: omc), as ExternalsPodiumD (icat) ---
  # Notify goes to podiumd-tests' Notify mock (its webhook receiver, created
  # by its bootstrap); podiumd-tests also subscribes OMC to Open
  # Notificaties (neither reference environment does). Besluiten
  # on Open Zaak: ExternalsPodiumD's separate besluiten host does not exist
  # here.
  omc:
    enabled: false
    settings:
      aspnetcore:
        environment: Development
      notify:
        api:
          baseUrl: http://ptest-bootstrap-webhook-receiver.podiumd-minikube/notify
          # ExternalsPodiumD's NotifyNL test key (name-serviceId-secret).
          key: omcconfigtest-0c9cdaaf-7b0a-4d88-a8d8-dacbccf52734-173e579d-0f99-4d29-a6f8-7b522418f57b
        templateId:
          decisionMade: "00000000-0000-1000-8000-000000000000"
          email:
            zaakCreate: 716369c8-edba-44ff-a213-a045b4a8d246
            zaakUpdate: ed368ce1-89b5-4826-b34c-3f563fb418a9
            zaakClose: 123e14bd-181e-4a93-a15b-071bee52e383
          sms:
            zaakCreate: b2a51bd0-df3c-492a-9097-9384fa34060a
            zaakUpdate: 76e9ebe7-edae-4fac-ad3c-834586851ef2
            zaakClose: a8d0026a-afab-48e4-b034-c4d85bb3ca60
      omc:
        actor:
          id: 3a91832c-f2bd-4f22-8d5b-557b44c0ed38
        auth:
          jwt:
            secret: omcAuthJwtSecretForPodiumdMinikubeAtLeastSixtyFourCharactersLong0123
      zgw:
        auth:
          jwt:
            secret: omcSecret
            issuer: omc
          key:
            openklant: openklantOmcToken
            objecten: objectenOmcToken
            objectTypen: objecttypenOmcToken
        endpoint:
          openNotificaties: https://opennotificaties.local/api/v1
          openZaak: https://openzaak.local/zaken/api/v1
          openKlant: https://openklant.local/klantinteracties/api/v1
          contactMomenten: https://openklant.local/klantinteracties/api/v1
          besluiten: https://openzaak.local/besluiten/api/v1
          objecten: https://objecten.local/api/v2
          objectTypen: https://objecttypen.local/api/v2
        whitelist:
          zaakCreate:
            ids: "*"
          zaakUpdate:
            ids: "*"
          zaakClose:
            ids: "*"
          taskAssigned:
            ids: niet-bestaande-id
          decisionMade:
            ids: niet-bestaande-id
          message:
            allowed: false
    ingress:
      enabled: true
      hostname: omc.local

  # --- frankgateway + openbao (profile: frankgateway) ---
  # As ExternalsPodiumD's dim1 Frank!Gateway branch: outway only, OpenBao
  # with a static seal and Keycloak login, one replica each (single node).
  # Beyond it (user's choice, the chart runbook's step 6): the outway carries
  # the api-proxy's paths to the same targets, as the chart's reference routes
  # (only KvK's carries its API-key function; BAG's WireMock needs no key), and
  # lib.manifests.route_outbound points
  # the apps' http://api-proxy/ URLs at it. BRP on the outway, as the routes
  # doc places the real BRP; the mock stands in for it (the doc's internal
  # example routes the in-cluster mock east-west).
  # Fixed admin keys: helm template has no cluster for the chart's lookup and
  # would regenerate them on every render. The seal key comes from
  # .openbao/seal-key (lib.openbao), never from this file.
  frankgateway:
    enabled: false
    replicas: 1
    podDisruptionBudget:
      enabled: false
    admin:
      adminKey: frankgatewayAdminKeyPodiumdMinikube0001
      viewerKey: frankgatewayViewerKeyPodiumdMinikube001
    dashboard:
      enabled: false
    networkPolicies:
      enabled: false
    etcd:
      replicas: 1
      podDisruptionBudget:
        enabled: false
    instances:
      inway:
        enabled: false
      internal:
        enabled: false
      outway:
        enabled: true
        routes:
          apiproxy-brp:
            uri: "/haalcentraal/api/brp/*"
            name: apiproxy-brp
            labels:
              managed-by: iac
            upstream:
              type: roundrobin
              scheme: http
              pass_host: rewrite
              upstream_host: brp-personen-mock
              nodes:
                "brp-personen-mock:5010": 1
          apiproxy-bag:
            uri: "/lvbag/individuelebevragingen/v2/*"
            name: apiproxy-bag
            labels:
              managed-by: iac
            upstream:
              type: roundrobin
              scheme: http
              pass_host: rewrite
              upstream_host: wiremock
              nodes:
                "wiremock:8080": 1
          # The chart routes doc's KvK routes: the test dataset (/test/ prefix),
          # the key read from OpenBao at request time (lib.openbao stores it).
          apiproxy-kvk-basic:
            <<: &kvkRoute
              labels:
