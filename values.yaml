# Service naming convention used throughout this file (must match the raw
# templates written in build order step 2): plain, unprefixed Service names
# in this chart's own namespace - postgres, redis, keycloak, solr, wiremock.
# podiumd's own nested apps are similarly reachable by their plain
# fullnameOverride (see below) since podiumd already sets each one to just
# the app's own name (confirmed via `helm show values dimpact/podiumd`),
# e.g. http://openzaak/, http://openklant/, http://pabc/.

# -----------------------------------------------------------------------
# Our own profile flags - compose-profile equivalents. Mirrors
# start-docker-compose.sh's own opt-in behavior (no flags = core stack only).
# -----------------------------------------------------------------------
zac:
  enabled: true # "zac" profile - on by default so the app is visible
  # Off by default. Gates the teammate's zac 5.4.2/chart 1.0.289 PKCE
  # experiment (see podiumd.zac.image.tag's own comment below,
  # src/podiumd_minikube/chart.py, and plan.md's PKCE sections for
  # the full history) - keeps the experiment fully opt-in instead of
  # silently required just because this values.yaml carries the override.
  # Turning this on ALSO requires the currently-selected podiumd version
  # to actually bundle a zac chart with AUTH_ENABLE_PKCE support (e.g. via
  # a hand-bumped local `--path` checkout, per that comment) -
  # src/podiumd_minikube/chart.py refuses podiumd-minikube deploy with a clear
  # message rather than silently reproducing the exact incident this
  # experiment already caused once (Keycloak requiring PKCE, an
  # PKCE-unaware zac chart never sending it, every login broken) if it
  # detects that isn't the case.
  experimentalPkce: false
  # mailpit (SMTP test server) moved out of this profile - it's now
  # unconditional (templates/mailpit/), since every app's own email
  # settings point at it regardless of which optional profiles are on.
objecten:
  enabled: false
  # Which podiumd objecten shape is currently selected (see
  # src/podiumd_minikube/chart.py's ObjectenShape) - classic (separate objecttypen
  # subchart) vs merged (single "openobject" chart, aliased back to this
  # same "objecten" key, no objecttypen subchart at all). Set automatically
  # by podiumd-minikube deploy and podiumd-minikube provision-cluster from that detection on every run -
  # not meant to be set by hand. Only consumed by our own
  # templates/objecten/service-objecttypen-alias.yaml so far.
  merged: false
opennotificaties:
  enabled: false
openarchiefbeheer:
  enabled: false
openformulieren:
  enabled: false # also pulls in objecten + objecttypen + opennotificaties
openinwoner:
  enabled: false # with podiumd.openinwoner and podiumd.eck-operator (its Elasticsearch)
ita:
  enabled: false # with podiumd.ita; needs objecten (its objecttypes) and openklant
kiss:
  enabled: false # with podiumd.kiss and podiumd.kiss-eck (its Elasticsearch); needs objecten
omc:
  # With podiumd.omc; needs objecten, openklant and opennotificaties. OMC
  # 1.17.19 rejects every notification with a `source` property; podiumd-tests
  # marks that as an expected failure.
  enabled: false
referentielijsten:
  enabled: false # with podiumd.referentielijsten
openbeheer:
  enabled: false # with podiumd.openbeheer; needs objecten (objecttypen)
frankgateway:
  enabled: false # with podiumd.frankgateway and podiumd.openbao; apps then call BRP/KvK/BAG through its outway
clamav:
  enabled: false # with podiumd.clamav; EICAR-only signatures (templates/clamav)
metrics:
  enabled: false # monitoring-logging (Grafana, Prometheus, Loki, Alloy), as both reference environments
podiumd:
  enabled: true

  # --- Azure/production-specific pieces this chart doesn't use ---
  # --- Keycloak: podiumd's operator and realm config, as both reference environments ---
  keycloak-operator:
    enabled: true
    # As ExternalsPodiumD. It renders the Role that lets the operator write Keycloak's
    # ServiceMonitor: with the monitoring CRDs present it reconciles one, else a 403.
    enableServiceMonitor: true
    # Laptop budget: chart 768Mi; the heap is in manifests.KEYCLOAK_OPERATOR_JAVA_OPTS.
    operator:
      resources:
        limits:
          memory: 384Mi
    jobs:
      ensureOperatorSa:
        clientSecret: keycloakOperatorClientSecret
  keycloak:
    instances: "1"
    auth:
      adminUser: admin
      adminPassword: admin
    externalDatabase:
      database: keycloak
      user: keycloak
      password: keycloak
    # Laptop budget: chart 1700Mi/2Gi. The JVM flags are in manifests.KEYCLOAK_JAVA_OPTS.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 768Mi
    config:
      realm: podiumd # the chart's default; templates/zac's seed Job reads it
      adminFrontendUrl: https://keycloak-admin.local
      realmFrontendUrl: https://keycloak.local
      # As podiumd-infra and ExternalsPodiumD's ontw environments (icat, dim1, mayk):
      # the realm roles and groups podiumd-tests' bootstrap assigns.
      skipRoles: false
      skipGroups: false
      smtp:
        server: mailpit
        port: "1025"
        from: noreply@example.com
        fromDisplayName: PodiumD minikube
        starttls: "false"
      clients:
        # Grafana keeps anonymous access (monitoring-logging.grafana's grafana.ini).
        monitoring:
          secret: keycloakMonitoringClientSecret
          oidcUrl: https://grafana.local
        # No Datamigratie or Zaakbrug here.
        datamigratie:
          enabled: false
        zaakbrug:
          enabled: false
  # --- Redis: podiumd's redis-operator, as both reference environments ---
  redis-operator:
    enabled: true
    redis-ha:
      replicaCount: 1 # chart 3
      # Laptop budget: chart 256Mi/512Mi.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
  apisix:
    enabled: false # already false by default upstream, set explicitly for clarity
  zgw-office-addin:
    enabled: false
  # ita and kiss: own blocks before the monitoring-logging dependency.
  # One node, as podiumd-infra (ExternalsPodiumD runs three).
  kiss-eck:
    enabled: false
    # eck-stack's own defaults; one chart level deeper Helm ignores them and
    # renders these parts (eck-fleet-server then fails the render).
    eck-agent:
      enabled: false
    eck-fleet-server:
      enabled: false
    eck-beats:
      enabled: false
    eck-logstash:
      enabled: false
    eck-apm-server:
      enabled: false
    eck-autoops-agent-policy:
      enabled: false
    eck-package-registry:
      enabled: false
    # Laptop budget: Kibana is an admin UI no test uses; enable with
    # --set podiumd.kiss-eck.eck-kibana.enabled=true (ExternalsPodiumD runs it).
    eck-kibana:
      enabled: false
    eck-elasticsearch:
      nodeSets:
        - name: default
          count: 1
          config:
            node.roles:
              - data
              - ingest
              - master
            node.store.allow_mmap: false
            # Laptop budget: thread pools sized for 1 CPU instead of the node's 6.
            node.processors: 1
          # Laptop budget: an explicit heap (ECK's default 2Gi sizes it at 1 GiB);
          # 1Gi OOMKilled it with a 512m heap.
          podTemplate:
            spec:
              containers:
                - name: elasticsearch
                  # CPU as ExternalsPodiumD.
                  resources:
                    requests:
                      cpu: 200m
                      memory: 1536Mi
                    limits:
                      cpu: 1000m
                      memory: 1536Mi
                  env:
                    - name: ES_JAVA_OPTS
                      value: "-Xms256m -Xmx256m"
          volumeClaimTemplates:
            - metadata:
                name: elasticsearch-data
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
  eck-operator:
    enabled: false
    # podiumd's operator watches namespace "podiumd" only; ours is
    # podiumd-minikube (its Role/RoleBinding land there).
    managedNamespaces:
      - podiumd-minikube
  # As both reference projects, but laptop budget: clamd loads only the EICAR
  # signature (13 MiB instead of 973 MiB with the official databases) and
  # freshclam never runs (no internet needed). The "-" argument makes the
  # image exec clamd directly.
  clamav:
    enabled: false
    extraArgs:
      - --foreground
    extraVolumes:
      - name: signatures
        configMap:
          name: clamav-signatures
    # podiumd's clamdConfig reads /var/lib/clamav, where the image ships the
    # official databases; this mount replaces them.
    extraVolumeMounts:
      - name: signatures
        mountPath: /var/lib/clamav
        readOnly: true
    persistentVolume:
      enabled: false # podiumd's Azure managed-csi PVC; the signatures come from the ConfigMap
    hpa:
      enabled: false
    # clamd starts in about a second with one signature.
    startupProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
    readinessProbe:
      initialDelaySeconds: 5
    livenessProbe:
      initialDelaySeconds: 30
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
  zaakbrug:
    enabled: false

  # --- zac (always on - the app itself) ---
  zac:
    enabled: true
    replicaCount: 1
    # Digest-qualified image references (zac itself, curlImage, opa,
    # office_converter) fail to pull in-cluster - see
    # src/podiumd_minikube/manifests.py's own docstring for why, and why that's
    # a post-renderer now instead of hardcoded image.tag overrides here (an
    # earlier version of this fix hardcoded specific tags, which would
    # silently go stale the moment podiumd-minikube set-podiumd-version selects a
    # podiumd release whose bundled charts default to different versions).
    # As ExternalsPodiumD: ZAC's nginx in front of WildFly (podiumd enables
    # it); it adds HSTS and nosniff and allows 150 MB request bodies.
    nginx:
      useXForwardedHost: true
      allowedHosts: zac.local,zac.podiumd-minikube
    autoscaling:
      enabled: false
    # No image.tag override here by default (top-level zac.experimentalPkce
    # is false) - chart default applies. EXPERIMENTAL, tied to a
    # local-only podiumd dependency bump - not something
    # `podiumd-minikube set-podiumd-version 4.8.4 <ml-version>` alone reproduces.
    # PodiumD 4.9's own release notes (Dimpact Confluence, "PDF versie
    # 4.9") pin zac at chart 1.0.289/app 5.4.2 (both *real, published*
    # versions - unlike an earlier local-only experiment with unreleased
    # 1.0.287/5.4.0, back when PR #6490 - "feat: add configurable PKCE
    # support for the OIDC authorization code flow" - had only just merged),
    # but PodiumD 4.9 itself is unreleased ("NIET BEGONNEN" on that same
    # page) - `helm search repo dimpact/podiumd -l` confirms only up to
    # 4.8.4 exists. Until it ships, getting zac 1.0.289 requires a local
    # `--path` checkout of the podiumd chart with its own zac dependency
    # bumped by hand:
    #
    #   git clone --depth 1 --branch main \
    #     git@github.com:Dimpact-Samenwerking/helm-charts.git /tmp/helm-charts
    #   cd /tmp/helm-charts/charts/podiumd
    #   sed -i '' 's/version: 1.0.251 # ZAC 5.0.1 helm release/version: 1.0.289 # ZAC 5.4.2 helm release/' Chart.yaml
    #   helm repo add zac https://infonl.github.io/dimpact-zaakafhandelcomponent/  # if not already added
    #   helm dependency update .
    #   cd <this repo>
    #   podiumd-minikube set-podiumd-version --path /tmp/helm-charts/charts/podiumd
    #
    # (.podiumd-versions.yaml records the --path itself, gitignored/personal
    # like every other version choice there - re-run the above after any
    # fresh clone or `.podiumd-versions.yaml` loss.)
    #
    # Once that chart bump is in place, set top-level zac.experimentalPkce
    # to true - src/podiumd_minikube/chart.py then does the rest on
    # every podiumd-minikube deploy run: injects this tag override (chart default,
    # empty/falling back to .Chart.AppVersion "5.4", is NOT the same image
    # as 5.4.2 - confirmed via `docker manifest inspect` that
    # ghcr.io/infonl/zaakafhandelcomponent:5.4 and :5.4.2 have different
    # digests, 5.4 is frozen at the first 5.4.x patch, not a rolling
    # alias), patches the vendored realm's own PKCE requirement for this
    # client back on to match (see auth's comment below,
    # and src/podiumd_minikube/manifests.py), and reconciles that same
    # setting into the *already-imported* live Keycloak realm (Keycloak
    # only ever imports once - see
    # src/podiumd_minikube/keycloak.py's own header for why a values/
    # ConfigMap change alone never reaches an already-provisioned
    # cluster).
    #
    # The teammate who built this confirmed it live end to end at the
    # time (see plan.md's PKCE sections), against a local chart checkout
    # that isn't currently available - re-verifying the *on* state of
    # this switch (as opposed to the switch mechanism itself, which is:
    # each piece above tested individually, and zac.experimentalPkce's
    # own default-off state confirmed end to end on a fresh deploy - see
    # plan.md) is blocked until that checkout (or a real podiumd 4.9
    # release bundling zac 1.0.289+) is actually reachable again. Don't
    # take "on" being wired up here as proof it currently works - only
    # that it's ready to, once it can be tested.
    # Laptop budget: ExternalsPodiumD runs -Xmx1024m -Xms1024m. A small -Xms and a
    # periodic G1 cycle give unused heap back (the serial GC kept ZAC's heap near -Xmx).
    # TieredStopAtLevel=1: only the C1 compiler, less code cache and compiler memory.
    javaOptions: "-Xms64m -Xmx768m -XX:ActiveProcessorCount=2 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:TieredStopAtLevel=1"
    contextUrl: https://zac.local
    db:
      host: postgres
      name: zac
      user: zac
      password: password
    auth:
      server: https://keycloak.local
      secret: keycloakZacClientSecret
      # No enablePkce: off as ExternalsPodiumD; zac.experimentalPkce turns it on
      # together with the realm's PKCE requirement (podiumd_minikube.chart).
    keycloak:
      adminClient:
        secret: zacAdminClientSecret
    gemeente:
      code: "9999"
      naam: FakeZacGemeente
      mail: gemeente-zac-test@example.com
    organizations:
      verantwoordelijke:
        rsin: "316245124"
      bron:
        rsin: "123443210"
    mail:
      smtp:
        # Was a fake placeholder Mailjet hostname that nothing ever
        # actually pointed at - repointed at mailpit (see
        # templates/mailpit/), matching every other app's own email
        # settings. Chart docs confirm username/password are optional -
        # mailpit accepts unauthenticated SMTP, same as every other app.
        server: mailpit
        port: "1025"
        username: ""
        password: ""
    # Dotted Service DNS form (not the bare "openzaak" this file's own naming
    # convention comment above would suggest), deliberately deviating from
    # it here: OpenZaak echoes back self-referencing resource URLs (e.g. a
    # catalogus's own "url") built from whatever host ZAC connects with, and
    # some of those URLs get round-tripped as query filters (e.g.
    # /catalogi/api/v1/zaaktypen?catalogus=<url>) that OpenZaak re-validates
    # with Django's URLValidator - which rejects single-label hostnames like
    # bare "openzaak" ("Voer een geldige URL in."), confirmed live by running
    # that exact validator inside the openzaak pod. openzaak's own
    # ALLOWED_HOSTS already includes this dotted form alongside the bare one
    # (a podiumd/zac chart default) - this is what it's there for.
    zgwApis:
      url: https://openzaak.local/
      clientId: zac_client
      secret: openzaakZaakafhandelcomponentClientSecret
    notificationsSecretKey: openNotificatiesApiSecretKey
    # Not a podiumd/zac chart value at all - this project's own grouping for
    # templates/zac/productaanvraag-zaakafhandelparameters-job.yaml's env
    # vars (that custom Job is the only thing that reads this block). Gives
    # zaaktypeIdentificatie valid zaakafhandelparameters (case definition +
    # default group + "niet-ontvankelijk" resultaat - see
    # ZaaktypeCmmnConfiguration.isValide() in the ZAC source for why all
    # three are required before ZAC can start a zaak of this type at all)
    # and points its own productaanvraagtype at the value used below by
    # podiumd.openformulieren's own form-import Job, so ProductaanvraagService
    # matches an incoming productaanvraag object to this zaaktype. Confirmed
    # live end-to-end (form submit -> objects API -> opennotificaties -> ZAC
    # creates a zaak) before being made declarative here - see plan.md's
    # productaanvraag-flow entry.
    # The e2e zaaktype podiumd's create_required_catalogi_job creates, as
    # ExternalsPodiumD's environments use; group behandelaars of podiumd's PABC
    # dataset.
    productaanvraag:
      zaaktypeIdentificatie: zaaktype-voor-e2e-testen
      caseDefinitionKey: generiek-zaakafhandelmodel
      defaultGroepId: behandelaars
      nietOntvankelijkResultaatNaam: Geweigerd e2e
      productaanvraagtype: productaanvraag-zaaktype-voor-e2e-testen
    klantinteractiesApi:
      url: https://openklant.local
      token: fakeToken
    objectenApi:
      url: https://objecten.local
      token: fakeZacObjectsToken
    # BRP/KvK/BAG through the api-proxy, as ExternalsPodiumD.
    brpApi:
      url: http://api-proxy/haalcentraal/api/brp/
      apiKey:
        # Compose defaults both BRP_API_KEY and BRP_API_KEY_HEADER to empty
        # (docker-compose.yaml lines 797-798) - ZAC's own BrpConfiguration
        # validation rejects a header set without a matching key, so these
        # must stay in lockstep, empty together.
        value: ""
        header: ""
    kvkApi:
      url: http://api-proxy/
      apiKey: fakeKvkApiKey
    bagApi:
      url: http://api-proxy/lvbag/individuelebevragingen/v2/
      apiKey: fakeBagApiKey
    openForms:
      url: http://localhost:9999 # not used at the moment, matches compose's own placeholder
    pabcApi:
      url: http://pabc
      # Left empty, this is read by PabcClientHeadersFactory's companion
      # object via MicroProfile Config at class-init time - a missing value
      # throws NoSuchElementException there, which Java then caches forever
      # as "Could not initialize class ...PabcClientHeadersFactory" on every
      # later use (found live via the PabcReadinessHealthCheck). Matches
      # podiumd.pabc.settings.apiKeys (below) and compose's own
      # .env.example default.
      apiKey: zac-test-api-key
    zacInternalEndpointsApiKey: fakeZacInternalEndpointsApiKey
    smartDocuments:
      enabled: false
    signaleringen:
      deleteOlderThanDays: "14"
    # ZAC's SolrCloud through the chart's solr-operator, as ExternalsPodiumD; ZAC's
    # init-solr-zac-core container creates the zac collection.
    solr-operator:
      watchNamespaces: podiumd-minikube
      solr:
        replicas: 1 # chart 3
        # Laptop budget: chart -Xms512m -Xmx768m, 1Gi/2Gi. The GC is in manifests.tune_solr.
        javaMem: "-Xms64m -Xmx512m -XX:ActiveProcessorCount=2"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 768Mi
        storage:
          storageClassName: standard
      zookeeper-operator:
        watchNamespace: podiumd-minikube
        zookeeper:
          replicas: 1 # as ExternalsPodiumD
          # Laptop budget: chart 256Mi/512Mi. The heap is in manifests.tune_solr.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          storage:
            storageClassName: standard
    # Off, as ExternalsPodiumD gets by default: ZAC's OTel SDK stays off and its
    # bundled collector is not deployed. One chart level deeper than podiumd,
    # Helm renders that collector unless this is set (checked with helm 4.3.0).
    opentelemetry-collector:
      enabled: false
    ingress:
      enabled: true
      hosts:
        - host: zac.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openzaak (always on - core) ---
  openzaak:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
    # The bundled chart's own default (1.27.3) is older than the version
    # docker-compose.yaml pins (1.29.1) - our vendored fixture SQL does raw
    # INSERTs against this app's own tables, written against schema as of
    # 1.29.1, so the version matters for compatibility, not just parity.
    # openklant's bundled default (2.15.0) already matches compose exactly -
    # no override needed there.
    # Bumped to 1.29.3 per PodiumD 4.9's own release notes (Dimpact
    # Confluence) - one patch ahead of docker-compose.yaml's own still-pinned
    # 1.29.1. Confirmed via the upstream CHANGELOG.rst that 1.29.2/1.29.3 are
    # bugfix/security-only releases (no new data migrations - the last one,
    # in 1.29.0, is already included since we're moving forward from 1.29.1,
    # past it), so this shouldn't affect our vendored fixture SQL's own
    # schema assumptions.
    image:
      tag: "1.29.3"
    flower:
      enabled: false
    worker:
      # Compose only runs openzaak-celery under the opennotificaties/
      # openformulieren profiles - kept on unconditionally here instead
      # (deliberate divergence from compose parity), so it's available
      # regardless of which other profiles happen to be enabled.
      replicaCount: 1
      concurrency: 1 # laptop budget; chart default 4
    beat:
      replicaCount: 1 # as ExternalsPodiumD and podiumd-infra: runs daily-remove-imports
    # nginx.replicaCount left at its chart default (1) - compose runs
    # openzaak-nginx unconditionally (chunked transfer-encoding handling).
    # Its digest-qualified default image tag is handled by
    # src/podiumd_minikube/manifests.py now, not a hardcoded override here.
    tags:
      redis: false # point at the shared Redis instead of the chart's bundled one
    # As ExternalsPodiumD: finds catalogus ALG with ZAC's bron RSIN (the fixture
    # catalogus) and adds its document and besluit types and zaaktype-voor-e2e-testen.
    create_required_catalogi_job:
      enabled: true
      client_id: integratieteam
      secret: integratieteamSecret
      e2eTestZaaktype:
        create: true
    configuration:
      job:
        # Was disabled (with no configuration.data set, matching compose,
        # which doesn't use django-setup-configuration for openzaak at
        # all) - the Job's own management command used to exit with
        # "CommandError: No steps enabled, aborting." Now enabled for the
        # oidc_db_config_admin_auth step below (browser OIDC login for
        # openzaak's own django-admin, as an addition on top of compose
        # parity, not a replacement for the plain-login path it already
        # has).
        enabled: true
      # Adds Keycloak OIDC login as an *additional* way into openzaak's
      # django-admin, on top of the plain username/password login above -
      # see vendor/dimpact-zaakafhandelcomponent/keycloak/
      # zaakafhandelcomponent-realm.json's own "openzaak" client for the
      # Keycloak side (secret must match
      # configuration.secrets.keycloak_client_secret below) and plan.md's
      # PKCE sections for the rollout rationale.
      #
      # PKCE (RFC 9700 requires it for every authorization-code-flow
      # client): NOT enabled here, and the Keycloak client's own
      # pkce.code.challenge.method is deliberately left "" (not "S256") to
      # match - confirmed live this pinned openzaak image (still 2.0.1 as
      # of the 1.29.1->1.29.3 bump - that upgrade's own upstream changelog
      # never mentions bumping mozilla-django-oidc-db, and re-checking live
      # confirms it didn't) has zero PKCE support at all (no `oidc_use_pkce`
      # field anywhere in its setup-configuration pydantic models, not even
      # an unused DB column - checked the installed package's own source
      # directly, not just its changelog). Setting oidc_use_pkce: true here
      # fails validation outright ("Extra inputs are not permitted");
      # enforcing PKCE on the Keycloak client while the app can never send a
      # code_challenge would instead fail every login with "Missing
      # parameter: code_challenge_method" - the exact same failure mode
      # already hit for ZAC (see this file's own zac.image.tag comment) and
      # the same class of incident documented in the sibling podiumd
      # chart's own docs/apps/keycloak/keycloak-security-updates.md (PKCE
      # Enforcement section) for enabling this before every component
      # actually supports it.
      #
      # Unlike ZAC, this isn't just "revisit after the next version bump":
      # checked live across every Django-based ZGW component this project
      # runs (openzaak/openklant/objecten/objecttypen/opennotificaties/
      # openformulieren/openarchiefbeheer, whichever of 1.1.1/2.0.1
      # mozilla-django-oidc-db each one happens to bundle) - none of them
      # have PKCE support at any version, `grep -ri pkce` across the whole
      # installed package finds nothing, and the upstream project's own
      # CHANGELOG.rst and every GitHub issue/PR (searched directly) never
      # mention it either. tests/test_keycloak_realm.py guards that their
      # clients never require PKCE.
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: openzaak.local
              name: Open Zaak

        # openzaak's own outbound notifications (published whenever it
        # creates/updates a zaak/besluit/document, not the productaanvraag
        # flow's own objecten->opennotificaties->zac path above, which is
        # unrelated) were never wired here at all - compose itself doesn't
        # use django-setup-configuration for openzaak (see this block's own
        # job.enabled comment), so nothing ever set this. Found live: with
        # notifications_api_service unset, openzaak's own
        # notifications_api_common post-create hook raises
        # "Not notifying, Notifications API configuration is broken or
        # absent" as an uncaught 500 on the *whole* zaak-create request -
        # the zaak row is still written, but ZAC's own createZaak call sees
        # the 500 and aborts the productaanvraag flow right after, even
        # though nothing else in that flow depends on this notification
        # being delivered anywhere. Also found live: this alone wasn't
        # enough - django-solo's own cache for this exact singleton
        # intermittently served a stale, unconfigured copy even once the
        # database row was correct (see
        # vendor/dimpact-zaakafhandelcomponent/openzaak/docker_no2fa.py's
        # own SOLO_CACHE=None fix for that, already in place - the pod
        # just needed restarting once to pick it up, since that file is a
        # subPath ConfigMap mount and those never live-update).
        #
        # openzaak's own kanalen (zaken, besluiten, ...) still need
        # registering with opennotificaties separately, since
        # setup_configuration has no step for that - `manage.py
        # register_kanalen` would do it, but that's an authenticated HTTP
        # call against opennotificaties itself, and 403'd live (this
        # plain vng_api_common_credentials entry has no matching
        # Autorisatie granting kanaal-management scope). Registered
        # declaratively instead, straight on opennotificaties' own
        # notifications_kanalen_config below - see that block's own
        # comment.
        # Client ids, identifiers and Applicatie uuids as ExternalsPodiumD:
        # Open Zaak notifies as "zaak"; Open Notificaties checks it through
        # this Autorisaties API as "notificaties".
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: notificaties-api
              label: Open Notificaties
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: zaak
              secret: zaakSecret
            # As ExternalsPodiumD; Open Zaak validates zaakobject URLs with
            # it. Token: Open Formulieren's Objecten token, as podiumd-infra
            # (its "formulier"). The fixtures' own service row
            # (http://objecten-api.local:8000) only works in docker-compose.
            - identifier: objecten-api
              label: Objecten API
              api_root: https://objecten.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token fakeOpenFormulierenObjectsToken
            # As ExternalsPodiumD.
            - identifier: autorisaties-api
              label: Open Zaak - Autorisaties
              api_root: https://openzaak.local/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: zaak
              secret: zaakSecret

        vng_api_common_credentials_config_enable: true
        vng_api_common_credentials:
          items:
            - identifier: zaak
              secret: zaakSecret
            - identifier: notificaties
              secret: notificatiesSecret
            - identifier: openinwoner
              secret: openinwonerSecret
            - identifier: ita
              secret: itaSecret
            - identifier: contact
              secret: contactSecret
            - identifier: omc
              secret: omcSecret
            - identifier: openbeheer
              secret: openbeheerSecret
            # As ExternalsPodiumD.
            - identifier: integratieteam
              secret: integratieteamSecret
            - identifier: objecten
              secret: objectenSecret

        vng_api_common_applicaties_config_enable: true
        vng_api_common_applicaties:
          items:
            - uuid: 6bf5bfb4-e76b-469f-b993-4aedb832b61f
              client_ids:
                - zaak
              heeft_alle_autorisaties: true
              label: Zaak
            - uuid: c5989254-922d-43f9-a32a-3fa2a44f6230
              client_ids:
                - notificaties
              heeft_alle_autorisaties: true
              label: Notificaties
            - uuid: 74f76546-7c1a-40f0-8a05-81af12a7eaef
              client_ids:
                - openinwoner
              heeft_alle_autorisaties: true
              label: Openinwoner
            - uuid: 86499f7a-0b68-4424-ad04-4cf88de06b59
              client_ids:
                - ita
              heeft_alle_autorisaties: true
              label: Internetaakafhandeling
            - uuid: ebd9f2c0-8f50-4b1a-bb77-672c3ec5c43b
              client_ids:
                - contact
              heeft_alle_autorisaties: true
              label: Contact
            - uuid: 746c65d7-b88e-4043-a1c0-15451004fbfa
              client_ids:
                - omc
              heeft_alle_autorisaties: true
              label: OMC
            - uuid: 3690fccd-b625-4896-8829-992b14bca77a
              client_ids:
                - openbeheer
              heeft_alle_autorisaties: true
              label: Open Beheer
            # As ExternalsPodiumD.
            - uuid: 3595eece-ba8a-47c9-a388-496086c9677f
              client_ids:
                - integratieteam
              heeft_alle_autorisaties: true
              label: Integratieteam
            - uuid: d0782c50-9cc2-4aa3-86e6-03e1cfb29813
              client_ids:
                - objecten
              heeft_alle_autorisaties: true
              label: Objecten

        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: notificaties-api

        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            # Discovery on the public https host, as ExternalsPodiumD.
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: openzaak
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              # As ExternalsPodiumD: administrators are superusers, every user is staff.
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      secrets:
        # Must match the "openzaak" client's own "secret" field in
        # vendor/dimpact-zaakafhandelcomponent/keycloak/
        # zaakafhandelcomponent-realm.json exactly.
        keycloak_client_secret: keycloakOpenzaakClientSecret
      # false, matching the Keycloak client's own pkce.code.challenge.method
      # ("" not "S256") - see this block's own data comment above for why.
      # Only meaningful at all if this project ever switches to podiumd's
      # own keycloak-operator-managed realm instead of the vendored static
      # realm.json import (keycloak-operator.enabled is false here - see
      # that key's own comment) - inert otherwise.
      pkceEnabled: false
      oidcUrl: https://openzaak.local
      # Matches docker-compose.yaml's DJANGO_SUPERUSER_PASSWORD/
      # OPENZAAK_SUPERUSER_USERNAME/OPENZAAK_SUPERUSER_EMAIL exactly. Found
      # live: left unset, the container never creates the 'admin' user our
      # vendored fixture-seeding script polls for
      # (`select count(id) from accounts_user where username = 'admin'`),
      # so the seed script waited forever and the ZGW API fixtures (zac's
      # own client credentials) never got applied - causing ZAC's boot-time
      # calls to Open Zaak to fail with a 403 invalid-client-identifier.
      superuser:
        username: admin
        password: admin
        email: noreply@example.com
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      # Matches docker-compose.yaml's openzaak.local value exactly. Found
      # live: left unset, Django refuses every request with
      # "ImproperlyConfigured: The SECRET_KEY setting must not be empty" -
      # same class of gap as openklant's secretKey fix above, just missed
      # for openzaak specifically in the initial pass.
      secretKey: openZaakSecretKey
      # Default ALLOWED_HOSTS only covers the chart's own in-cluster
      # fullname/namespace-qualified name (which already covers ZAC's
      # backend calls via the "openzaak" Service DNS name) - found live:
      # browsing via the ingress hostname got Django's own
      # DisallowedHost 400 error page, since "openzaak.local" was never in
      # that list.
      # As ExternalsPodiumD: also its nginx Service, and two proxies (edge, nginx).
      allowedHosts: openzaak.local,openzaak-nginx.podiumd-minikube.svc.cluster.local
      numProxies: 2
      # As ExternalsPodiumD: Secure cookies and https URLs (the edge
      # terminates TLS). Its domain for URLs built outside a request comes
      # from sites_config in configuration.data.
      isHttps: true
      # Confirmed live: DISABLE_2FA is only read by openzaak.conf.dev/.ci,
      # neither part of the conf.docker->production->includes.base chain
      # this container actually uses, so settings.disable2fa is a dead
      # values.yaml field for this chart - without this override, a fresh
      # superuser with no registered device hits a real "Tweestapsauthenticatie
      # instellen" (set up two-step auth) wall instead of reaching the
      # admin. See the vendored docker_no2fa.py's own header for why
      # DJANGO_SETTINGS_MODULE=openzaak.conf.dev isn't an option either
      # (pulls in django-debug-toolbar, not installed in this production
      # image) - same fix already used for openarchiefbeheer.
      djangoSettingsModule: openzaak.conf.docker_no2fa
      # Chart default is "localhost:25" - a compose-only value that's just
      # a no-op inside this pod in Kubernetes. Pointed at mailpit (see
      # templates/mailpit/) instead, matching compose's own openzaak-mail
      # relay role - no auth needed, mailpit accepts unauthenticated SMTP.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openzaak
        password: openzaak
        name: openzaak
      # Own Redis DBs per app, numbered as the podiumd chart's defaults (which
      # ExternalsPodiumD and podiumd-infra keep): django-solo caches singletons
      # (NotificationsConfig) under the same key in every app, so a shared DB
      # serves one app's config to another.
      cache:
        default: redis-ha-master:6379/4
        axes: redis-ha-master:6379/4
      celery:
        # DB 3, not the more obvious 1 - objecten's own worker (already
        # active) also brokers on db1, and Celery workers are competing
        # consumers on whatever queue they share: with openzaak's worker
        # now on too (see worker.replicaCount above), both would silently
        # steal tasks meant for the other (confirmed live for the
        # openklant/openformulieren db2 equivalent of this exact
        # collision - "Received unregistered task of type ..." errors,
        # discarded instead of processed). No other app here brokers on
        # db3.
        brokerUrl: redis://redis-ha-master:6379/5
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openzaak-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openzaak/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      hosts:
        - host: openzaak.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openklant (always on - core) ---
  openklant:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
    configuration:
      oidcUrl: https://openklant.local
      secrets:
        keycloak_client_secret: keycloakOpenklantClientSecret
      job:
        enabled: true
      # Open Klant's notifications to Open Notificaties, as podiumd-infra
      # (kees00): service notificaties-api, Open Zaak's client "zaak".
      # ExternalsPodiumD has none yet; included so the tests cover it.
      data: |-
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: notificaties-api
              label: Open Notificaties
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: zaak
              secret: zaakSecret
        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: notificaties-api
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48
        tokenauth_config_enable: true
        tokenauth:
          items:
            - identifier: contact
              token: openklantContactToken
              contact_person: Contact
              email: contact@example.com
            - identifier: ita
              token: openklantItaToken
              contact_person: ITA
              email: ita@example.com
            - identifier: omc
              token: openklantOmcToken
              contact_person: OMC
              email: omc@example.com
            # As ExternalsPodiumD.
            - identifier: openinwoner
              token: openklantOpeninwonerToken
              contact_person: Open Inwoner
              email: openinwoner@example.com
            # As ExternalsPodiumD: Open Archiefbeheer's Open Klant plugin.
            - identifier: openarchiefbeheer
              token: openklantOpenarchiefbeheerToken
              contact_person: Open Archiefbeheer
              email: openarchiefbeheer@example.com
            # As ExternalsPodiumD (dimp test, 4.9.4): Open Formulieren's customer interactions.
            - identifier: openformulieren
              token: openklantOpenformulierenToken
              contact_person: Open Formulieren
              email: openformulieren@example.com

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: openklant
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      # No compose equivalent to match (compose never sets openklant
      # SUPERUSER credentials either) and, unlike openzaak/opennotificaties/
      # objecttypen/openformulieren, this chart's values.yaml has no
      # configuration.superuser field at all to begin with - these values
      # are consumed by templates/openklant/create-superuser-job.yaml
      # instead, a custom Job added for exactly this gap. See that Job's
      # own header comment.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
    flower:
      enabled: false
    worker:
      # Compose runs openklant as a single bare container with no celery
      # worker at all - kept on unconditionally here instead (deliberate
      # divergence from compose parity).
      replicaCount: 1
    # nginx.replicaCount left at its chart default (1), even though compose
    # runs openklant without one: verified directly that this chart's own
    # Ingress template hardwires its backend to the "<fullname>-nginx"
    # Service specifically (not configurable to point elsewhere), so
    # scaling nginx to 0 would make openklant.local completely unreachable.
    # Its digest-qualified default image tag is handled by
    # src/podiumd_minikube/manifests.py now, not a hardcoded override here.
    tags:
      redis: false
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      # See openzaak's own allowedHosts comment above - same gap, same fix.
      allowedHosts: openklant.local
      # As ExternalsPodiumD, which sets Open Klant's domain here, not in
      # sites_config.
      siteDomain: openklant.local
      isHttps: true
      # Unlike openzaak/opennotificaties/objecttypen/openformulieren, this
      # actually works natively - confirmed live by reading
      # open_api_framework.conf.base (the shared maykinmedia library
      # openklant's own conf/base.py wildcard-imports from) directly inside
      # the running pod: it reads DISABLE_2FA itself, in the real
      # production settings chain, and sets
      # MAYKIN_2FA_ALLOW_MFA_BYPASS_BACKENDS accordingly - no
      # docker_no2fa.py-style shim needed here at all.
      disable2fa: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openklant
        password: openklant
        name: openklant
      # Matches docker-compose.yaml's openklant.local value exactly (yes,
      # it really does reuse openzaak's own secret key literally - a
      # copy-paste artifact in compose itself, not something we introduced).
      secretKey: openZaakSecretKey
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/7
        axes: redis-ha-master:6379/7
      celery:
        # DB 4, not the more obvious 2 - openformulieren's own worker
        # (already active) also brokers on db2, and Celery workers are
        # competing consumers on whatever queue they share: confirmed
        # live, this exact collision made openklant's worker steal
        # openformulieren's own scheduled tasks ("Received unregistered
        # task of type 'openforms.forms.tasks.activate_forms'" - silently
        # discarded instead of executed) the moment this worker was
        # enabled. No other app here brokers on db4.
        brokerUrl: redis://redis-ha-master:6379/8
        # Set both: this chart's own configmap.yaml has a typo reading
        # "resultBackendl" (not "resultBackend") - found live while fixing
        # the same bug on openarchiefbeheer's chart (see that comment).
        resultBackend: redis://redis-ha-master:6379/8
        resultBackendl: redis://redis-ha-master:6379/8
    ingress:
      enabled: true
      hosts:
        - host: openklant.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openinwoner (profile: openinwoner) ---
  # As ExternalsPodiumD and podiumd-infra: Keycloak admin login (no
  # superuser Job), Open Zaak client "openinwoner", digidMock, Elasticsearch
  # through ECK (podiumd.eck-operator, on with this profile, one node as
  # podiumd-infra). eherkenningMock as ExternalsPodiumD: the real DigiD and
  # eHerkenning are unreachable from here. One replica each, as
  # podiumd-infra. Not configured:
  # the e-Suite services (external) and the Open Zaak api group, which both
  # reference projects leave commented out.
  openinwoner:
    enabled: false
    replicaCount: 1
    # Laptop budget: one Celery child per worker (defaults 4 and 8). The chart
    # ignores worker.concurrency, so the image default needs an env var.
    extraEnvVars:
      - name: CELERY_WORKER_CONCURRENCY
        value: "1"
    worker:
      replicaCount: 1
    lowLatencyWorker:
      replicaCount: 1
      concurrency: 1
    beat:
      replicaCount: 1
    nginx:
      replicaCount: 1
    tags:
      redis: false
    configuration:
      enabled: true
      secrets:
        keycloak_client_secret: keycloakOpeninwonerClientSecret
      job:
        enabled: true
      oidcUrl: https://openinwoner.local
      data: |-
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: admin-oidc-provider
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
            - identifier: admin-oidc
              oidc_provider_identifier: admin-oidc-provider
              enabled: true
              oidc_rp_scopes_list:
                - openid
                - email
                - profile
              userinfo_claims_source: id_token
              oidc_rp_client_id: openinwoner
              oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
              oidc_rp_sign_algo: RS256
              # ExternalsPodiumD's settings in options: mozilla-django-oidc-db 2.0.1
              # stores the deprecated flat fields as group_settings, but reads
              # groups_settings at login (KeyError, a 500 on /oidc/callback/).
              options:
                user_settings:
                  claim_mappings:
                    username:
                      - preferred_username
                    first_name:
                      - given_name
                    last_name:
                      - family_name
                groups_settings:
                  claim_mapping:
                    - groups
                  superuser_group_names:
                    - administrators
                  make_users_staff: true
                  sync: true

        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: openzaak-zaken-api
              label: Open Zaak - Zaken API
              api_root: https://openzaak.local/zaken/api/v1/
              api_type: zrc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: openzaak-documenten-api
              label: Open Zaak - Documenten API
              api_root: https://openzaak.local/documenten/api/v1/
              api_type: drc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: openzaak-catalogi-api
              label: Open Zaak - Catalogi API
              api_root: https://openzaak.local/catalogi/api/v1/
              api_type: ztc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: openzaak-besluiten-api
              label: Open Zaak - Besluiten API
              api_root: https://openzaak.local/besluiten/api/v1/
              api_type: brc
              auth_type: zgw
              client_id: openinwoner
              secret: openinwonerSecret
            - identifier: vng-selectielijst
              label: VNG Selectielijst
              api_root: https://selectielijst.openzaak.nl/api/v1/
              api_type: orc
              auth_type: no_auth
            - identifier: brp-api
              label: BRP API proxy
              api_root: http://api-proxy/haalcentraal/api/brp/
              api_type: orc
              auth_type: no_auth
            - identifier: kvk-api
              label: KVK API proxy
              api_root: http://api-proxy/api/
              api_type: orc
              auth_type: no_auth
            - identifier: bag-api
              label: BAG API proxy
              api_root: http://api-proxy/lvbag/individuelebevragingen/v2/
              api_type: orc
              auth_type: no_auth
            - identifier: notificaties-api
              label: Notificaties API
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret

        sites_config_enable: true
        sites_config:
          items:
            - domain: openinwoner.local
              name: Open Inwoner
    settings:
      # Laptop budget: 2 web processes (image default 4), not 1: with --lazy-apps and
      # UWSGI_MAX_REQUESTS=100 a single worker's ~6 s restart stalls every request.
      uwsgi:
        processes: 2
        threads: 2
      secretKey: openInwonerSecretKey
      allowedHosts: openinwoner.local,openinwoner-nginx.podiumd-minikube.svc.cluster.local
      isHttps: true
      numProxies: 2
      digidMock: true
      eherkenningMock: true
      database:
        host: postgres
        port: 5432
        name: openinwoner
        username: openinwoner
        password: openinwoner
      email:
        host: mailpit
        port: 1025
        useTLS: false
        defaultFrom: noreply@example.com
      # The chart's default DBs, on this chart's single Redis.
      cache:
        default: redis-ha-master:6379/11
        axes: redis-ha-master:6379/11
      celery:
        brokerUrl: redis://redis-ha-master:6379/12
        resultBackend: redis://redis-ha-master:6379/12
    # ExternalsPodiumD's nodeSet: one node, anonymous superuser (Open
    # Inwoner sends no credentials), minus its Azure nodeSelector and
    # storage class.
    eck-elasticsearch:
      annotations:
        co.elastic.co/config-checksum: "xpack-anonymous-auth"
      nodeSets:
        - name: default
          count: 1
          config:
            cluster.initial_master_nodes:
              - openinwoner-elasticsearch-es-default-0
            node.roles:
              - master
              - data
              - ingest
            node.store.allow_mmap: false
            # Laptop budget: thread pools sized for 1 CPU instead of the node's 6.
            node.processors: 1
            xpack.security.authc:
              anonymous:
                username: anonymous
                roles: superuser
                authz_exception: false
          podTemplate:
            spec:
              terminationGracePeriodSeconds: 60
              containers:
                - name: elasticsearch
                  resources:
                    requests:
                      cpu: 200m
                      memory: 1536Mi
                    limits:
                      cpu: 1000m
                      memory: 1536Mi
                  env:
                    # Laptop budget: a quarter of ExternalsPodiumD's 1g heap; old gen stays under 100 MiB.
                    - name: ES_JAVA_OPTS
                      value: "-Xms256m -Xmx256m"
                    - name: PRE_STOP_ADDITIONAL_WAIT_SECONDS
                      value: "15"
          volumeClaimTemplates:
            - metadata:
                name: elasticsearch-data
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 8Gi

  # --- pabc (always on - core) ---
  pabc:
    enabled: true
    replicaCount: 1
    postgresql:
      enabled: false # point at the shared Postgres instead of the chart's bundled bitnami one
    # podiumd's own override remaps all three pabc images to a private Azure
    # Container Registry (acrprodmgmt.azurecr.io) with an IP allowlist -
    # confirmed via a direct pull attempt that it actively denies external
    # IPs. Overridden back to the pabc chart's own upstream defaults
    # (verified these pull successfully): the true public ghcr.io addresses.
    # Only overriding `repository`, deliberately not `tag` - podiumd's own
    # values.yaml already pins a specific tag for the ACR-hosted image
    # (currently "1.1.0", verified matching), and leaving that field alone
    # means we keep tracking whatever tag the currently-selected podiumd
    # version pins, instead of a second, independent hardcoded value here
    # that could silently drift from it after a
    # podiumd-minikube set-podiumd-version swap.
    image:
      repository: ghcr.io/platform-autorisatie-beheer-component/pabc-api
    migrations:
      image:
        repository: ghcr.io/platform-autorisatie-beheer-component/pabc-migrations
    # As ExternalsPodiumD's ontw environments (icat, dim1): PABC seeded once
    # from podiumd's files/pabc-dataset.json, its realm roles and groups by the Keycloak Job.
    datasetConfigMap:
      enabled: true
    seedJob:
      enabled: true
    initContainers:
      waitFor:
        # Same reasoning as pabc's own image override above - repository
        # only, tag left to track whatever podiumd's own value currently is.
        image:
          repository: ghcr.io/groundnuty/k8s-wait-for
    settings:
      database:
        host: postgres
        port: 5432
        username: pabc
        password: pabc
        name: Pabc
      apiKeys:
        - zac-test-api-key
      oidc:
        authority: https://keycloak.local/realms/podiumd/
        oidcUrl: https://pabc.local
        clientId: pabc
        clientSecret: pabcClientSecret
        functioneelBeheerderRole: administrator
        # As ExternalsPodiumD: the username claim. requireHttps and
        # pkceEnabled stay at the chart defaults (Keycloak is https here; the
        # pabc chart does not read pkceEnabled, the vendored realm's "pabc"
        # client requires S256, which PABC's middleware always sends).
        nameClaimType: preferred_username
      keycloakAdmin:
        clientId: pabc-admin-client
        clientSecret: pabcAdminClientSecret
    ingress:
      enabled: true
      hosts:
        - host: pabc.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- brp-personen-mock (always on - core) ---
  brppersonenmock:
    enabled: true
    # Its default nameOverride "brp-personen-mock" is the api-proxy's target.

  # --- api-proxy (always on - core), as ExternalsPodiumD ---
  # Apps call BRP, KvK and BAG at http://api-proxy/<path>, as ExternalsPodiumD.
  # BRP goes to brp-personen-mock and KvK to KvK's test API, as both reference
  # projects (needs internet); BAG goes to WireMock instead of Kadaster's API,
  # whose key is not public.
  # templates/api-proxy/ingress.yaml serves the same paths on api-proxy.local.
  # podiumd's frankgateway replaces it in time; no reference environment
  # routes through it yet.
  apiproxy:
    enabled: true
    resolverIp: 10.96.0.10 # minikube's kube-dns; the chart's 10.0.0.10 is AKS's
    locations:
      bag:
        hostHeader: wiremock
        targetUrl: http://wiremock:8080/lvbag/individuelebevragingen/v2/
      brp:
        hostHeader: brp-personen-mock
        targetUrl: http://brp-personen-mock:5010/haalcentraal/api/brp/
      # KvK's public test-environment key (developers.kvk.nl), as podiumd-infra;
      # podiumd_minikube.openbao also stores it for the Frank!Gateway outway.
      kvkSearch:
        apikey: &kvkTestApiKey l7xx1f2691f2520d487b902f4e0b57a0b197
        hostHeader: api.kvk.nl
        path: /api/v2/zoeken
        targetUrl: https://api.kvk.nl/test/api/v2/zoeken
      kvkBasic:
        apikey: *kvkTestApiKey
        hostHeader: api.kvk.nl
        path: /api/v1/basisprofielen
        targetUrl: https://api.kvk.nl/test/api/v1/basisprofielen
      kvkBranch:
        apikey: *kvkTestApiKey
        hostHeader: api.kvk.nl
        path: /api/v1/vestigingsprofielen
        targetUrl: https://api.kvk.nl/test/api/v1/vestigingsprofielen

  # --- Profile-gated apps (build order step 5). Each one's `enabled` flag
  # here is the one that actually controls whether podiumd renders it (its
  # own Chart.yaml `condition:` on the nested dependency) - the top-level
  # flags at the very top of this file (objecten.enabled, etc.) are this
  # chart's own compose-profile-equivalent flags, used by our own templates
  # (storage-hooks.yaml, the postgres seed script guard, the metrics/wiremock
  # raw templates below). Turning a profile on means flipping BOTH: the
  # top-level flag and this podiumd.<app>.enabled flag. Left disabled here,
  # matching compose's own opt-in-by-profile default. ---

  # --- objecten (+ objecttypen, its always-on dependency once either
  # profile is on) ---
  objecten:
    enabled: false
    replicaCount: 1
    worker:
      # Compose runs objecten-api-celery as a real worker - unlike
      # openzaak/openklant's workers (which compose never runs at all), this
      # one stays on, just scaled down from the chart's default of 2.
      replicaCount: 1
    flower:
      enabled: false # not run in compose; chart default is true
    tags:
      redis: false
    configuration:
      enabled: true
      # Open Object only (podiumd >= 4.10): podiumd's create-required-objecttypen
      # Job calls oidcUrl's API with this superuser token (manifests.fixup_merged_objecten).
      oidcUrl: https://objecten.local
      secrets:
        keycloak_client_secret: keycloakObjectenClientSecret
        create_required_objecttypen_token: objectenRequiredObjecttypenToken
      job:
        # Declaratively wires the Objects API side of the productaanvraag
        # flow (openformulieren -> objects API -> opennotificaties -> ZAC):
        # its own link to Objecttypen API and to Open Notificaties, the
        # productaanvraag objecttype reference, and the read/write tokens
        # ZAC and openformulieren authenticate with. Confirmed live
        # end-to-end against a real minikube cluster before being made
        # declarative here (see plan.md's productaanvraag-flow entry).
        #
        # Deliberately doesn't replicate compose's own "objecten-api-import"
        # container beyond this one objecttype - that container also seeds
        # unrelated demo objecttypes (Boom/Straatverlichting/taak/formio)
        # nothing in this chart consumes.
        enabled: true
      # No compose equivalent to match (objecten isn't part of
      # dimpact-zaakafhandelcomponent's docker-compose stack at all - see
      # this block's own top comment). Unlike openformulieren/openklant/
      # openarchiefbeheer, this chart's start.sh genuinely reads
      # OBJECTS_SUPERUSER_USERNAME/EMAIL/PASSWORD at boot and creates the
      # account itself (confirmed live) - same wiring as objecttypen's own
      # superuser block, no custom Job needed here.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
      # objecttypes-api: dotted Service DNS form, not bare "objecttypen" -
      # same URLValidator gotcha as ZAC's own zgwApis.url above (Django
      # rejects single-label hostnames on any field that round-trips a URL
      # this API hands back) - confirmed live the same way.
      #
      # open-notificaties + notifications_config: lets this Objects API
      # instance publish an "object created" notification whenever a
      # productaanvraag object is written - the trigger the whole flow
      # starts from. Credentials (client_id=objectsapi) match the
      # vng_api_common_credentials entry registered on opennotificaties's
      # own configuration.data above.
      #
      # objecttypes_config: registers this Objects API's reference to each
      # objecttype by UUID; podiumd.objecttypen.create_required_objecttypen_job
      # creates the objecttypes themselves (Objecttypen's setup_configuration
      # only has a step for tokens).
      #
      # tokenauth: fakeZacObjectsToken matches podiumd.zac.objectenApi.token
      # above (zac.local's own existing config, never previously valid since
      # no token row existed until this) - fakeOpenFormulierenObjectsToken
      # is what podiumd.openformulieren's own objects_api service below
      # authenticates with (Open Zaak too). Both only on Productaanvraag-Dimpact,
      # as podiumd-infra's "zaak" and "formulier" tokens.
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: objecten.local
              name: Objecten

        zgw_consumers_config_enable: True
        zgw_consumers:
          services:
            - identifier: objecttypes-api
              label: Objecttypen API
              api_root: https://objecttypen.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token objectenToObjecttypenToken

            - identifier: open-notificaties
              label: Open Notificaties
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: objectsapi
              secret: opennotificatiesObjectsSecret

            # As ExternalsPodiumD.
            - identifier: autorisaties-api
              label: Open Zaak - Autorisaties API
              api_root: https://openzaak.local/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: objecten
              secret: objectenSecret

        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: open-notificaties
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48

        objecttypes_config_enable: true
        # service_identifier here is classic-shape syntax (objects-api
        # <4.0.0's ObjectTypesConfigurationStep requires it - a real,
        # separate Objecttypes API to reference by service). Merged shape
        # (open-object >=4.0.0, "OBJECTEN_MERGED" in
        # src/podiumd_minikube/chart.py) dropped the field entirely - Objects
        # and Objecttypes are now one API, so there's nothing external
        # left to reference - and its own step model rejects it outright
        # (Pydantic extra_forbidden) rather than ignoring it, confirmed
        # against that version's own
        # setup_configuration/models/objecttypes.py. Left in here anyway
        # (this block has to satisfy whichever shape is NOT the one
        # podiumd-minikube deploy strips it for) - src/podiumd_minikube/manifests.py
        # strips it back out of the rendered ConfigMap, but only when
        # OBJECTEN_MERGED=true (see manifests.fix_up).
        objecttypes:
          items:
            # podiumd-infra's only Productaanvraag-Dimpact, created by
            # podiumd.objecttypen.create_required_objecttypen_job.
            - service_identifier: objecttypes-api
              uuid: 11a5f7fd-013e-4e29-9cd1-738249fc3479
              name: Productaanvraag-Dimpact
            # KISS/ITA, as ExternalsPodiumD; UUIDs fixed by
            # podiumd.objecttypen.create_required_objecttypen_job.
            - service_identifier: objecttypes-api
              uuid: 90984726-2692-49d8-8f9d-742075cb761d
              name: Medewerker
            - service_identifier: objecttypes-api
              uuid: c8d301f9-80b8-4575-8b29-3e9431f92994
              name: Afdeling
            - service_identifier: objecttypes-api
              uuid: cbec27ac-157b-490b-b586-9e8a8f5bbb85
              name: Groep
            - service_identifier: objecttypes-api
              uuid: 72240cd6-29bb-4a66-b1c3-ab6589a39a22
              name: InterneTaak
            - service_identifier: objecttypes-api
              uuid: e4d2e353-80ea-4962-8276-920d59a3e8de
              name: Kennisartikel
            - service_identifier: objecttypes-api
              uuid: 6a0d8f9d-f7e2-4e57-a91b-01656968a62d
              name: VAC
            - service_identifier: objecttypes-api
              uuid: 2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
              name: Activiteitenlog

        tokenauth_config_enable: true
        tokenauth:
          items:
            - identifier: zaakafhandelcomponent
              token: fakeZacObjectsToken
              contact_person: ZAC
              email: zac@example.com
              application: ZAC
              permissions:
                - object_type: 11a5f7fd-013e-4e29-9cd1-738249fc3479
                  mode: read_and_write
            - identifier: openformulieren
              token: fakeOpenFormulierenObjectsToken
              contact_person: Open Formulieren
              email: openformulieren@example.com
              application: Open Formulieren
              permissions:
                - object_type: 11a5f7fd-013e-4e29-9cd1-738249fc3479
                  mode: read_and_write
            # As ExternalsPodiumD (icat).
            - identifier: contact
              token: objectenContactToken
              contact_person: Contact
              email: contact@example.com
              application: Contact
              permissions:
                - object_type: 90984726-2692-49d8-8f9d-742075cb761d
                  mode: read_and_write
                - object_type: c8d301f9-80b8-4575-8b29-3e9431f92994
                  mode: read_and_write
                - object_type: cbec27ac-157b-490b-b586-9e8a8f5bbb85
                  mode: read_and_write
                - object_type: 72240cd6-29bb-4a66-b1c3-ab6589a39a22
                  mode: read_and_write
                - object_type: e4d2e353-80ea-4962-8276-920d59a3e8de
                  mode: read_and_write
                - object_type: 6a0d8f9d-f7e2-4e57-a91b-01656968a62d
                  mode: read_and_write
            - identifier: ita
              token: objectenItaToken
              contact_person: ITA
              email: ita@example.com
              application: ITA
              # As ExternalsPodiumD's test environment (dimp/test, also icat and
              # info) and podiumd-infra: Medewerker too, ITA reads a user's
              # groepen from it; dim1 alone leaves it out.
              permissions:
                - object_type: c8d301f9-80b8-4575-8b29-3e9431f92994
                  mode: read_and_write
                - object_type: cbec27ac-157b-490b-b586-9e8a8f5bbb85
                  mode: read_and_write
                - object_type: 2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
                  mode: read_and_write
                - object_type: 90984726-2692-49d8-8f9d-742075cb761d
                  mode: read_and_write
            - identifier: omc
              token: objectenOmcToken
              contact_person: OMC
              email: omc@example.com
              application: OMC
              permissions:
                - object_type: c8d301f9-80b8-4575-8b29-3e9431f92994
                  mode: read_and_write
                - object_type: cbec27ac-157b-490b-b586-9e8a8f5bbb85
                  mode: read_and_write
                - object_type: 2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
                  mode: read_and_write
            - identifier: openbeheer-token
              token: objectenOpenbeheerToken
              contact_person: Open Beheer
              email: openbeheer@example.com
              is_superuser: true
            # As ExternalsPodiumD.
            - identifier: integratieteam
              token: objectenIntegratieteamToken
              contact_person: Integratieteam
              email: integratieteam@example.com
              is_superuser: true
            # As ExternalsPodiumD: Open Archiefbeheer's Objecten plugin, no object type permissions.
            - identifier: openarchiefbeheer
              token: objectenOpenarchiefbeheerToken
              contact_person: Open Archiefbeheer
              email: openarchiefbeheer@example.com

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: objecten
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
    # See templates/objecten/configmap-no-solo-cache-settings.yaml's own
    # header for why this shim exists (django-solo's own cache for
    # NotificationsConfig intermittently going stale, confirmed live while
    # building the productaanvraag flow) - same
    # ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # elsewhere in this file for a docker_no2fa.py-style settings override,
    # just fixing a different upstream gap.
    extraVolumes:
      - name: no-solo-cache-settings
        configMap:
          name: objecten-no-solo-cache-settings
    extraVolumeMounts:
      - name: no-solo-cache-settings
        subPath: docker_no_solo_cache.py
        mountPath: /app/src/objects/conf/docker_no_solo_cache.py
        readOnly: true
    settings:
      # Laptop budget: 1 web process (image default 4); 2 threads keep requests concurrent.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: objectenApiSecretKey
      # As ExternalsPodiumD: also its internal Service, which KISS calls. The
      # objecttypen names reach Open Object (podiumd >= 4.10), which serves both APIs.
      allowedHosts: objecten.local,objecten.podiumd-minikube.svc.cluster.local,objecttypen,objecttypen.podiumd-minikube,objecttypen.local
      # Open Object only (podiumd >= 4.10); its chart requires it.
      siteDomain: objecten.local
      # See openzaak's isHttps comment.
      isHttps: true
      djangoSettingsModule: objects.conf.docker_no_solo_cache
      # Unlike most other apps fixed here, this works natively - confirmed
      # live by reading open_api_framework.conf.base (the shared maykinmedia
      # library objecten's own conf/base.py wildcard-imports from, same as
      # openklant) directly inside the running pod: it reads DISABLE_2FA
      # itself, in the real production settings chain, and sets
      # MAYKIN_2FA_ALLOW_MFA_BYPASS_BACKENDS accordingly - no
      # docker_no2fa.py-style shim needed here at all.
      disable2fa: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        # Compose's objecten-api-database container's actual Postgres
        # user/db is literally named "objects", not "objecten" - copied
        # as-is, matching 00-create-databases.sql.
        username: objects
        password: objects
        name: objects
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/1
        axes: redis-ha-master:6379/1
        # Compose never sets an OIDC-cache env var for objecten either -
        # see opennotificaties's identical CACHE_OIDC comment above (same
        # unconditional-render leak, same fix).
        oidc: redis-ha-master:6379/1
      celery:
        brokerUrl: redis://redis-ha-master:6379/2
        # Set both: see openklant/openarchiefbeheer's identical comment -
        # this chart's own configmap.yaml has the same "resultBackendl" typo.
        resultBackend: redis://redis-ha-master:6379/2
        resultBackendl: redis://redis-ha-master:6379/2
    ingress:
      enabled: true
      hosts:
        - host: objecten.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: objecten
      storageClassName: ""
      size: 10Gi

  objecttypen:
    enabled: false
    replicaCount: 1
    # Version (3.4.2) already matches compose; its digest-qualified chart
    # default is handled by src/podiumd_minikube/manifests.py now, not a
    # hardcoded override here.
    # No worker/beat/flower/redis blocks exist on this chart at all - it's
    # a stateless API with no celery use.
    configuration:
      enabled: true
      secrets:
        keycloak_client_secret: keycloakObjecttypenClientSecret
      job:
        # Only creates the tokens below: Objecttypen's setup_configuration has
        # no step for objecttypes; create_required_objecttypen_job creates them,
        # published.
        enabled: true
      # No compose equivalent to match (objecttypen isn't part of
      # dimpact-zaakafhandelcomponent's docker-compose stack at all - see
      # this block's own top comment). Same admin/admin/admin@example.com
      # convention as opennotificaties's superuser block below purely for
      # local django-admin access; wired the same way (Deployment's
      # envFrom already pulls in this Secret/ConfigMap regardless of the
      # job.enabled=false above, so this alone is enough - confirmed
      # against objecttypen's own templates/{secret,configmap,deployment}.yaml).
      superuser:
        username: admin
        password: admin
        email: admin@example.com
      # Read tokens for the two consumers of the productaanvraag objecttype
      # schema: podiumd.objecten (to validate/serve object data against it)
      # and podiumd.openformulieren (its own admin UI needs to list
      # objecttypes/versions when building a form's registration backend).
      # Values match what those two blocks' own zgw_consumers services
      # authenticate with.
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: objecttypen.local
              name: Objecttypen

        tokenauth_config_enable: true
        tokenauth:
          items:
            - identifier: objects-api
              token: objectenToObjecttypenToken
              contact_person: podiumd-minikube
              email: objecten@example.com
              application: Objects API
            - identifier: open-formulieren
              token: openFormulierenToObjecttypenToken
              contact_person: Open Formulieren
              email: openformulieren@example.com
              application: Open Formulieren
            - identifier: integratieteam
              token: objecttypenIntegratieteamToken
              contact_person: Integratieteam
              email: integratieteam@example.com
            - identifier: omc
              token: objecttypenOmcToken
              contact_person: OMC
              email: omc@example.com
            # As ExternalsPodiumD.
            - identifier: zaak
              token: objecttypenZaakToken
              contact_person: Open Zaak
              email: zaak@example.com
            - identifier: openbeheer-token
              token: objecttypenOpenbeheerToken
              contact_person: Open Beheer
              email: openbeheer@example.com
              organization: Open Beheer
              application: Open Beheer
              administration: Open Beheer

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: objecttypen
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      # For create_required_objecttypen_job.
      oidcUrl: https://objecttypen.local
      token: objecttypenIntegratieteamToken
    # The KISS/ITA objecttypes, as podiumd; downloads each schema from
    # GitHub only when it creates that objecttype. src/podiumd_minikube/deploy.py
    # runs it after the fixtures, whose primary keys it would otherwise take.
    create_required_objecttypen_job:
      enabled: true
    # See settings.djangoSettingsModule below for why this mount exists -
    # same ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # for openzaak's/opennotificaties'/openarchiefbeheer's own
    # docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: objecttypen-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/objecttypes/conf/docker_no2fa.py
        readOnly: true
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      secretKey: objecttypesApiSecretKey
      allowedHosts: objecttypen.local
      # Confirmed live (the hard way - an earlier version of this comment
      # claimed objecttypen never enforces 2FA at all, based on a manual
      # test that turned out to be invalid: `kubectl set env ... KEY-` only
      # removes an explicit env: entry, it can't suppress a value still
      # coming from this ConfigMap via envFrom, so that "proof" was
      # actually still running with DISABLE_2FA=True the whole time). A
      # real values.yaml-driven redeploy with the key genuinely absent
      # does hit a "Set up MFA" wall for a fresh superuser with no
      # registered device - DISABLE_2FA is only read by objecttypes'
      # own conf.dev, not the conf.docker->production chain this container
      # actually uses. Same docker_no2fa.py shim as
      # openzaak/opennotificaties/openforms below (see
      # settings.djangoSettingsModule).
      djangoSettingsModule: objecttypes.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: objecttypes
        password: objecttypes
        name: objecttypes
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/0
        axes: redis-ha-master:6379/0
    ingress:
      enabled: true
      hosts:
        - host: objecttypen.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- opennotificaties ---
  opennotificaties:
    enabled: false
    replicaCount: 1
    # No image.tag pin: tracks the podiumd chart's version. Since 1.16.0
    # Celery Beat sends the scheduled notifications.
    worker:
      replicaCount: 1
    beat:
      replicaCount: 1
    flower:
      enabled: false # already the chart default; explicit for clarity
    tags:
      redis: false
    configuration:
      enabled: true
      oidcUrl: https://opennotificaties.local
      secrets:
        keycloak_client_secret: keycloakOpennotificatiesClientSecret
      job:
        # Wires the "objecten" kanaal + a ZAC abonnement declaratively via
        # this chart's own bundled setup_configuration Job - the productaanvraag
        # flow (openformulieren -> objects API -> opennotificaties -> ZAC)
        # needs this to create a zaak from a submitted form without any
        # manual post-deploy step. Confirmed live end-to-end against a real
        # minikube cluster (see plan.md's productaanvraag-flow entry) before
        # being made declarative here.
        enabled: true
      superuser:
        # Matches compose's OPENNOTIFICATIES_SUPERUSER_USERNAME/_EMAIL and
        # DJANGO_SUPERUSER_PASSWORD exactly.
        username: admin
        password: admin
        email: admin@example.com
      # ZAC's abonnement has ExternalsPodiumD's kanalen (dim1): objecten for
      # productaanvragen, zaken and documenten for its Solr index, besluiten
      # and zaaktypen.
      #
      # autorisaties-api: confirmed live this is NOT optional - opennotificaties
      # defaults to the public https://autorisaties-api.vng.cloud when no
      # local Autorisaties API service is configured, and every incoming
      # notification-publish request (even to the "objecten" kanaal) gets a
      # live 403 from that default before ever reaching our own abonnement.
      # Client "notificaties", as ExternalsPodiumD: its credential and
      # Applicatie are registered in podiumd.openzaak.configuration.data.
      #
      # objectsapi credential: lets the Objects API (podiumd.objecten's own
      # notifications_config below) authenticate its outgoing
      # "object created" notification into this Notificaties API - matched
      # by identifier/secret on both sides, no Autorisaties API round trip
      # needed for this one (vng_api_common_credentials is opennotificaties'
      # own self-contained JWT secret store, confirmed live sufficient for
      # this direction).
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: opennotificaties.local
              name: Open Notificaties

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: opennotificaties
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true

        zgw_consumers_config_enable: True
        zgw_consumers:
          services:
            - identifier: autorisaties-api
              label: Open Zaak - Autorisaties API
              api_root: https://openzaak.local/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret
            # As ExternalsPodiumD: its own notifications, as client "notificaties".
            - identifier: notificaties-api
              label: Notificaties API
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: notificaties
              secret: notificatiesSecret

        notifications_config_enable: True
        notifications_config:
          notifications_api_service_identifier: notificaties-api
          notification_delivery_max_retries: 5
          notification_delivery_retry_backoff: 3
          notification_delivery_retry_backoff_max: 48

        autorisaties_api_config_enable: True
        autorisaties_api:
          authorizations_api_service_identifier: autorisaties-api

        vng_api_common_credentials_config_enable: True
        vng_api_common_credentials:
          items:
            # Credentials for the Objects API (podiumd.objecten) to send notifications
            - identifier: objectsapi
              secret: opennotificatiesObjectsSecret
            # Open Zaak's notifications (client "zaak", as ExternalsPodiumD).
            - identifier: zaak
              secret: zaakSecret
            - identifier: notificaties
              secret: notificatiesSecret

        notifications_kanalen_config_enable: true
        # Kanalen and filters as ExternalsPodiumD; internetaken,
        # klantcontacten and partijen as podiumd-infra (kees00). Defined
        # here because this Job re-runs every deploy: a kanaal listed
        # without filters would lose filters set elsewhere.
        notifications_kanalen_config:
          items:
            - naam: autorisaties
              filters:
                - autorisaties
            - naam: besluittypen
              filters:
                - catalogus
            - naam: informatieobjecttypen
              filters:
                - catalogus
            - naam: zaaktypen
              filters:
                - catalogus
            - naam: zaken
              filters:
                - bronorganisatie
                - zaaktype
                - vertrouwelijkheidaanduiding
            - naam: documenten
              filters:
                - bronorganisatie
                - informatieobjecttype
                - vertrouwelijkheidaanduiding
            - naam: besluiten
              filters:
                - verantwoordelijke_organisatie
                - besluittype
            - naam: objecten
              filters:
                - object
                - object_type
            - naam: internetaken
              filters:
                - nummer
                - gevraagde_handeling
                - toelichting
                - status
            - naam: klantcontacten
              filters:
                - hoofd_onderwerp_type
                - indicatie_contact_gelukt
                - verdere_actie_ondernomen
            - naam: partijen
              filters:
                - nummer
                - interne_notitie
                - soort_partij

        notifications_abonnementen_config_enable: true
        notifications_abonnementen_config:
          items:
            # Fixed uuid so re-running setup_configuration (idempotent, per
            # its own --help text) always updates the same abonnement
            # rather than accumulating duplicates.
            - uuid: fb4e3474-18c8-474b-94ae-980850ea4a7f
              callback_url: https://zac.local/rest/notificaties
              auth: openNotificatiesApiSecretKey
              kanalen:
                - naam: objecten
                - naam: zaken
                - naam: documenten
                - naam: besluiten
                - naam: zaaktypen
    settings:
      # Laptop budget: 1 web process (image default 4); 2 threads keep requests concurrent.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: opennotificatiesApiSecretKey
      allowedHosts: opennotificaties.local
      # See openzaak's isHttps comment.
      isHttps: true
      # See openzaak's own djangoSettingsModule comment above - same
      # DISABLE_2FA-only-lives-in-conf.dev gap, confirmed live against the
      # same "Tweestapsauthenticatie instellen" wall (opennotificaties'
      # actual Django project package is "nrc", not "opennotificaties" -
      # confirmed against the running pod's own /app/src/nrc/conf/ layout).
      djangoSettingsModule: nrc.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: opennotificaties
        password: opennotificaties
        name: opennotificaties
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/3
        axes: redis-ha-master:6379/3
        # Compose never sets an OIDC-cache env var for opennotificaties, but
        # this chart's configmap.yaml always renders CACHE_OIDC
        # unconditionally (no matching {{- if }} guard) - left unset, it
        # fell through to podiumd's own untouched production default
        # (redis-ha-master...). Pointed at the shared Redis instead of
        # leaving that leak in place.
        oidc: redis-ha-master:6379/3
      celery:
        # DB 5, not the more obvious 1 - objecten's own worker already
        # brokers on db1 (openzaak/openklant's own worker db collision
        # with objecten/openformulieren, and the resulting move to db3/
        # db4, is documented on their own values.yaml blocks above) - db5
        # is the first index none of this chart's other Celery workers
        # (objecten=1, openformulieren=2, openzaak=3, openklant=4) use.
        brokerUrl: redis://redis-ha-master:6379/6
        # PUBLISH_BROKER_URL has its own dedicated field (confirmed live
        # against secret.yaml) - matches brokerUrl now that both are Redis.
        publishBrokerUrl: redis://redis-ha-master:6379/6
        # CELERY_RESULT_BACKEND is defined TWICE on this chart: once here
        # (feeding configmap.yaml's tags.redis-false branch) and once via
        # settings.messageBroker.celeryResultBackend below (feeding
        # secret.yaml). Found live: both the ConfigMap and Secret set the
        # same env var name via envFrom, and Kubernetes resolves that by
        # whichever source is listed last in the container's envFrom list
        # winning - rather than depend on that ordering, both are set here
        # to the same value so it's correct either way. Leaving only one
        # set left the other object rendering podiumd's own untouched
        # production default (redis-ha-master...) instead of ours.
        resultBackend: redis://redis-ha-master:6379/6
      messageBroker:
        celeryResultBackend: redis://redis-ha-master:6379/6
    # See settings.djangoSettingsModule above for why this mount exists -
    # same ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # for openzaak's/openarchiefbeheer's own docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: opennotificaties-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/nrc/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      hosts:
        - host: opennotificaties.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: opennotificaties
      storageClassName: ""
      size: 10Gi

  # --- openarchiefbeheer ---
  openarchiefbeheer:
    enabled: false
    # Laptop budget: 1 web process with 2 threads (image default 4 x 1); the
    # chart ignores settings.uwsgi.
    extraEnvVars:
      - name: UWSGI_PROCESSES
        value: "1"
      - name: UWSGI_THREADS
        value: "2"
    # replicaCount/worker/beat/nginx/flower all already default to 1 - no
    # override needed (confirmed live against the chart: unlike the other
    # Maykin-family apps, this one's chart defaults already match compose's
    # single-instance topology exactly, including running celery/beat/flower
    # since compose really does run all of those as separate containers).
    # Versions (image 2.0.0, nginx 1.31.1) already match compose; their
    # digest-qualified chart defaults are handled by
    # src/podiumd_minikube/manifests.py now, not hardcoded overrides here.
    tags:
      redis: false
    configuration:
      oidcUrl: https://openarchiefbeheer-ui.local
      secrets:
        keycloak_client_secret: keycloakOpenarchiefbeheerClientSecret
      job:
        enabled: true # compose's openarchiefbeheer-web-init runs the equivalent setup-configuration step for real, unlike the other apps' fixture-import containers - replicated here via configuration.data below
      # ZGW consumer services with ZAC's Open Zaak client credentials, as
      # ZAC's docker-compose setup.
      data: |-
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
          - identifier: zaken-test
            label: Open Zaak - Zaken API
            api_root: https://openzaak.local/zaken/api/v1/
            api_type: zrc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: documenten-test
            label: Open Zaak - Documenten API
            api_root: https://openzaak.local/documenten/api/v1/
            api_type: drc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: catalogi-test
            label: Open Zaak - Catalogi API
            api_root: https://openzaak.local/catalogi/api/v1/
            api_type: ztc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: besluiten-test
            label: Open Zaak - Besluiten API
            api_root: https://openzaak.local/besluiten/api/v1/
            api_type: brc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: selectielijst
            label: Open Zaak (public) - Selectielijst API
            api_root: https://selectielijst.openzaak.nl/api/v1/
            api_type: orc
            auth_type: no_auth
          # As ExternalsPodiumD: the external registers' services.
          - identifier: objecten-api
            label: Objecten API
            api_root: https://objecten.local/api/v2/
            api_type: orc
            auth_type: api_key
            header_key: Authorization
            header_value: Token objectenOpenarchiefbeheerToken
          - identifier: openklant-klantinteracties
            label: Open Klant - Klantinteracties API
            api_root: https://openklant.local/klantinteracties/api/v1/
            api_type: kc
            auth_type: api_key
            header_key: Authorization
            header_value: Token openklantOpenarchiefbeheerToken
        api_configuration_enabled: true
        api_configuration:
          selectielijst_service_identifier: selectielijst
        external_registers_enabled: true
        external_registers:
          openklant:
            enabled: true
            services_identifiers:
              - openklant-klantinteracties
          objecten:
            enabled: true
            services_identifiers:
              - objecten-api
        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: abc # podiumd's client id, as ExternalsPodiumD
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: false
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
      # No compose equivalent to match (compose never sets openarchiefbeheer
      # SUPERUSER credentials either - it only ever gets as far as a
      # commented-out wish to disable 2FA, see settings.djangoSettingsModule
      # below) and this chart's values.yaml has no configuration.superuser
      # field at all to begin with - these values are consumed by
      # templates/openarchiefbeheer/create-superuser-job.yaml instead, a
      # custom Job added for exactly this gap. See that Job's own header
      # comment.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
    # Real compose *tries* to disable 2FA the naive way
    # (DJANGO_SETTINGS_MODULE=openarchiefbeheer.conf.dev + DISABLE_2FA=true,
    # both left commented out in its own environment block) and gives up -
    # its own comment there says this "errors with `ModuleNotFoundError: No
    # module named 'debug_toolbar'`", leaving 2FA enforced in real compose
    # too. This project's own docker_no2fa.py (vendored below) actually
    # solves it: upstream only reads DISABLE_2FA in that dev-only settings
    # module, which pulls in django-debug-toolbar (not installed in this
    # production image) - so a small custom settings module that mirrors
    # just the DISABLE_2FA handling, without the dev-only dependencies,
    # mounted with a ConfigMap and extraVolumes/extraVolumeMounts.
    settings:
      djangoSettingsModule: openarchiefbeheer.conf.docker_no2fa
      secretKey: oabSecretKey
      # Both hostnames from the compose parity table (plan.md) need to be
      # here: this chart has only ONE native Ingress, and it routes
      # exclusively to the nginx sidecar, which itself proxies
      # /admin|oidc|static|assets|api/ to the backend and serves the SPA
      # for everything else - so both "hostnames" really are the same
      # nginx, just two Host-header entry points. Also feeds nginx's own
      # server_name directive (same mechanism as our raw templates).
      allowedHosts: openarchiefbeheer-web.local,openarchiefbeheer-ui.local
      # See openzaak's isHttps comment.
      isHttps: true
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openarchiefbeheer
        password: openarchiefbeheer
        name: openarchiefbeheer
      cors:
        allowedOrigins: https://openarchiefbeheer-ui.local,https://openarchiefbeheer-web.local
      csrf:
        trustedOrigins: https://openarchiefbeheer-ui.local,https://openarchiefbeheer-web.local
      # Own Redis DB, see openzaak's cache comment.
      cache:
        default: redis-ha-master:6379/13
        axes: redis-ha-master:6379/13
        choices: redis-ha-master:6379/14
      celery:
        brokerUrl: redis://redis-ha-master:6379/14
        # Set both: this chart's own configmap.yaml has a typo reading
        # "resultBackendl" (not "resultBackend", which is what values.yaml
        # itself declares) - found live, confirmed directly against the
        # template. Setting only the correctly-spelled key would silently
        # leave CELERY_RESULT_BACKEND empty.
        resultBackend: redis://redis-ha-master:6379/14
        resultBackendl: redis://redis-ha-master:6379/14
      frontend:
        # As ExternalsPodiumD and podiumd-infra: the UI's own host. The UI's CSP
        # (default-src 'self') refuses an API on another host.
        apiUrl: https://openarchiefbeheer-ui.local
        apiPath: /api/v1
        zaakUrlTemplate: "https://zac.local/zaken/{identificatie}"
      frontendUrl: https://openarchiefbeheer-ui.local
      requestsReadTimeout: "5000"
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openarchiefbeheer-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openarchiefbeheer/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      hosts:
        - host: openarchiefbeheer-web.local
          paths:
            - path: /
              pathType: ImplementationSpecific
        - host: openarchiefbeheer-ui.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: openarchiefbeheer
      storageClassName: ""
      size: 10Gi

  # --- openformulieren (aliased from the openforms chart) ---
  openformulieren:
    enabled: false
    # also pulls in objecten + objecttypen + opennotificaties (compose's
    # own "openformulieren" profile transitively enables all three - see
    # top-level openformulieren.enabled's comment).
    replicaCount: 1
    # As ExternalsPodiumD (dimp test, 4.9.4): the "Open Klant" customer
    # interactions API group, from the openklant-api service below.
    customerInteractionsConfigJob:
      enabled: true
    # Found live: chart default (3.4.9) differs from both compose's own
    # pinned version and this one - a genuine version pin, unlike nginx's
    # own digest-qualified default just below, which is handled by
    # src/podiumd_minikube/manifests.py instead of a hardcoded tag here.
    # Bumped to 3.5.5 per PodiumD 4.9's own release notes (Dimpact
    # Confluence) - one patch behind docker-compose.yaml's own 3.5.6 (which
    # moved independently ahead of PodiumD's own tracked version); no
    # migration/schema changes between 3.5.4 and 3.5.5 per the upstream
    # CHANGELOG.rst (bugfixes only - broken table markup, formio validation,
    # templating fixes; two optional one-off data-repair scripts mentioned
    # there don't apply to this project's own single 2-field test form).
    image:
      tag: "3.5.5"
    nginx:
      replicaCount: 1 # compose runs openformulieren-nginx
    worker:
      replicaCount: 1 # compose runs openformulieren-celery
      concurrency: 1 # laptop budget; chart default 4
    beat:
      replicaCount: 1 # compose runs openformulieren-celery-beat, unlike opennotificaties
    flower:
      enabled: false # chart default is true; not run in compose
    tags:
      redis: false
    configuration:
      enabled: true
      oidcUrl: https://openformulieren-nginx.local
      secrets:
        keycloak_client_secret: keycloakOpenformulierenClientSecret
      job:
        # Wires the ZGW services (openzaak zaken/documenten/catalogi) and the
        # Objects API group this project's own productaanvraag flow uses -
        # NOT compose's own openformulieren-init scope (BRP service link,
        # klantinteracties API group), which this chart's own
        # configuration.data below deliberately doesn't replicate (nothing
        # here consumes either yet). Confirmed live end-to-end (form submit
        # -> objects API -> opennotificaties -> ZAC creates a zaak) against
        # a real minikube cluster before being made declarative here - see
        # plan.md's productaanvraag-flow entry.
        #
        # The form itself (Form/FormDefinition/FormStep/
        # FormRegistrationBackend) isn't configurable through this job at
        # all - setup_configuration has no concept of forms, only
        # services/API groups (confirmed by reading every step registered
        # in this image's own settings.SETUP_CONFIGURATION_STEPS) - see
        # templates/openformulieren/productaanvraag-form-job.yaml instead,
        # a custom Job added for exactly that gap.
        enabled: true
      # Unlike objecttypen/openzaak/opennotificaties, this chart never
      # wires configuration.superuser to an actual user-creation mechanism
      # (confirmed live: grepped every template in the vendored chart for
      # "superuser" - zero hits outside a commented-out
      # django-setup-configuration example) - these values are consumed by
      # templates/openformulieren/create-superuser-job.yaml instead, a
      # custom Job added for exactly this gap. See that Job's own header
      # comment.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
      # openzaak-*: dotted Service DNS form, not bare "openzaak" - same
      # URLValidator gotcha as ZAC's own zgwApis.url above, confirmed live
      # the same way (a self-referencing catalogus/zaaktype/
      # informatieobjecttype URL round-tripped through a validated field
      # elsewhere fails on a single-label hostname). client_id/secret match
      # openzaak's own vendored Applicatie/JWT-secret rows for
      # "open-formulieren" (see
      # vendor/dimpact-zaakafhandelcomponent/postgres/fixtures/openzaak/
      # 01-setup-zac-config.sql) - already fully authorized there, no
      # openzaak-side change needed.
      #
      # objects-api/objecttypes-api: this chart's own read/write access to
      # the productaanvraag objecttype schema and to Objects API itself -
      # tokens match podiumd.objecten's own tokenauth entries and
      # podiumd.objecttypen's own tokenauth entries above.
      #
      # local-objects-api group: catalogue_domain/rsin match ZAC's own
      # "ALG"/"123443210" catalogus (the podiumd/zac chart's own hardcoded
      # CATALOGUS_DOMEIN default - confirmed live via the running zac pod's
      # own env, not something this values.yaml sets itself) - the
      # productaanvraag form's registration backend (wired by the custom
      # form-import Job below) resolves case/document types against this
      # same catalogue.
      data: |-
        zgw_consumers_config_enable: True
        zgw_consumers:
          services:
            # As ExternalsPodiumD.
            - identifier: brp-api
              label: BRP API proxy
              api_root: http://api-proxy/haalcentraal/api/brp/
              api_type: orc
              auth_type: no_auth
            - identifier: kvk-api
              label: KVK API proxy
              api_root: http://api-proxy/api/
              api_type: orc
              auth_type: no_auth
            - identifier: bag-api
              label: BAG API proxy
              api_root: http://api-proxy/lvbag/individuelebevragingen/v2/
              api_type: orc
              auth_type: no_auth
            - identifier: openzaak-zaken
              label: Open Zaak - Zaken API
              api_root: https://openzaak.local/zaken/api/v1/
              api_type: zrc
              auth_type: zgw
              client_id: open-formulieren
              secret: openFormulierenOpenzaakClientSecret

            - identifier: openzaak-documenten
              label: Open Zaak - Documenten API
              api_root: https://openzaak.local/documenten/api/v1/
              api_type: drc
              auth_type: zgw
              client_id: open-formulieren
              secret: openFormulierenOpenzaakClientSecret

            - identifier: openzaak-catalogi
              label: Open Zaak - Catalogi API
              api_root: https://openzaak.local/catalogi/api/v1/
              api_type: ztc
              auth_type: zgw
              client_id: open-formulieren
              secret: openFormulierenOpenzaakClientSecret

            - identifier: objects-api
              label: Objects API
              api_root: https://objecten.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token fakeOpenFormulierenObjectsToken

            - identifier: objecttypes-api
              label: Objecttypen API
              api_root: https://objecttypen.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token openFormulierenToObjecttypenToken

            # As ExternalsPodiumD. Its "pdok" service is left out: Open
            # Formulieren's own migrations already create a service with that
            # api_root (no identifier), and a second one violates
            # zgw_consumers_service_api_root_key.
            - identifier: vng-selectielijst
              label: VNG Selectielijst
              api_root: https://selectielijst.openzaak.nl/api/v1/
              api_type: orc
              auth_type: no_auth

            # As ExternalsPodiumD (dimp test, 4.9.4); customerInteractionsConfigJob uses it.
            - identifier: openklant-api
              label: Open Klant - Klantinteracties API
              api_root: https://openklant.local/klantinteracties/api/v1/
              api_type: kc
              auth_type: api_key
              header_key: Authorization
              header_value: Token openklantOpenformulierenToken

        objects_api_config_enable: True
        objects_api:
          groups:
            - identifier: local-objects-api
              name: Local Objects API
              objects_service_identifier: objects-api
              objecttypes_service_identifier: objecttypes-api
              documenten_service_identifier: openzaak-documenten
              catalogi_service_identifier: openzaak-catalogi
              document_type_submission_report: bijlage
              document_type_submission_csv: bijlage
              document_type_attachment: bijlage
              catalogue_domain: ALG
              catalogue_rsin: "123443210" # podiumd.zac.organizations.bron.rsin
              organisatie_rsin: "123443210"

        # As ExternalsPodiumD's "Open Zaak" ZGW registration backend; the RSINs
        # are ZAC's bron RSIN, which the fixture catalogus carries.
        zgw_api_config_enable: True
        zgw_api:
          groups:
            - identifier: openzaak
              name: Open Zaak
              zaken_service_identifier: openzaak-zaken
              documenten_service_identifier: openzaak-documenten
              catalogi_service_identifier: openzaak-catalogi
              catalogue_domain: ALG
              catalogue_rsin: "123443210" # podiumd.zac.organizations.bron.rsin
              organisatie_rsin: "123443210"
              auteur: Aanvrager
              zaak_vertrouwelijkheidaanduiding: openbaar
              doc_vertrouwelijkheidaanduiding: openbaar
              objects_api_json_content_template: |-
                {
                  "data": {% json_summary %},
                  "type": "{{ "{{" }} productaanvraag_type {{ "}}" }}",
                  "bsn": "{{ "{{" }} variables.auth_bsn {{ "}}" }}",
                  "submission_id": "{{ "{{" }} submission.kenmerk {{ "}}" }}",
                  "language_code": "{{ "{{" }} submission.language_code {{ "}}" }}"
                }

        # As ExternalsPodiumD: admin login through Keycloak, with its claim and group settings.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
          - identifier: keycloak-provider
            oidc_use_nonce: false
            oidc_token_use_basic_auth: true
            oidc_nonce_size: 32
            oidc_state_size: 32
            endpoint_config:
              oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
          - identifier: admin-oidc
            enabled: true
            oidc_rp_client_id: openformulieren
            oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
            oidc_rp_scopes_list:
            - openid
            - email
            - profile
            - roles
            oidc_rp_sign_algo: RS256
            oidc_provider_identifier: keycloak-provider
            userinfo_claims_source: id_token
            options:
              user_settings:
                claim_mappings:
                  username:
                  - preferred_username
                  first_name:
                  - given_name
                  last_name:
                  - family_name
                  email:
                  - email
                username_case_sensitive: true
              groups_settings:
                claim_mapping:
                - groups
                superuser_group_names:
                - administrators
                make_users_staff: true
                sync: true
    # See settings.djangoSettingsModule below for why the no2fa-settings
    # mount exists - same ConfigMap+extraVolumes+extraVolumeMounts pattern
    # already used for openzaak's/opennotificaties's/openarchiefbeheer's
    # own docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openformulieren-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openforms/conf/docker_no2fa.py
        readOnly: true
    settings:
      # Laptop budget: 1 web process (image default 4); 2 threads keep requests concurrent.
      uwsgi:
        processes: 1
        threads: 2
      secretKey: openFormulierenSecretKey
      allowedHosts: openformulieren-nginx.local,openformulieren-web.local
      # As ExternalsPodiumD and podiumd-infra: the public host. Mails drop links
      # to any other host (the pause mail's resume link).
      baseUrl: "https://openformulieren-nginx.local"
      # See openzaak's isHttps comment.
      isHttps: true
      # Confirmed live: DISABLE_2FA is only read by openforms.conf.dev,
      # not the conf.docker->production->base chain this container
      # actually uses, so there's no settings.disable2fa-equivalent field
      # on this chart at all - without this override, a fresh superuser
      # with no registered device hits a real "Tweestapsauthenticatie
      # instellen" (set up two-step auth) wall instead of reaching the
      # admin. Same docker_no2fa.py shim as
      # openzaak/opennotificaties/objecttypen above.
      djangoSettingsModule: openforms.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
        defaultFrom: noreply@dimpact.nl
      database:
        host: postgres
        port: 5432
        username: openformulieren
        password: openformulieren
        name: openformulieren
      cache:
        default: redis-ha-master:6379/9
        axes: redis-ha-master:6379/9
        portalLocker: redis-ha-master:6379/9
      celery:
        brokerUrl: redis://redis-ha-master:6379/10
        # Set both: see openklant/objecten/openarchiefbeheer's identical
        # comment - this chart's own configmap.yaml has the same
        # "resultBackendl" typo.
        resultBackend: redis://redis-ha-master:6379/10
        resultBackendl: redis://redis-ha-master:6379/10
      # As ExternalsPodiumD: its own public host only; two proxies (edge, nginx).
      cors:
        allowAllOrigins: false
        allowedOrigins:
          - https://openformulieren-nginx.local
      csp:
        reportSave: true
      numProxies: 2
    ingress:
      enabled: true
      hosts:
        - host: openformulieren-nginx.local
          paths:
            - path: /
              pathType: ImplementationSpecific
        - host: openformulieren-web.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: openformulieren
      storageClassName: ""
      size: 10Gi

  # --- referentielijsten (profile: referentielijsten), as ExternalsPodiumD ---
  # Keycloak admin login only; nothing in the reference environments calls
  # its API. Redis DB 15, the chart default.
  referentielijsten:
    enabled: false
    configuration:
      oidcUrl: https://referentielijsten.local
      secrets:
        keycloak_client_secret: keycloakReferentielijstenClientSecret
      data: |-
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: keycloak-provider
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
            - identifier: admin-oidc
              oidc_provider_identifier: keycloak-provider
              enabled: true
              oidc_rp_client_id: referentielijsten
              oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
              oidc_rp_scopes_list:
                - openid
                - email
                - profile
                - roles
              oidc_rp_sign_algo: RS256
              userinfo_claims_source: id_token
              options:
                user_settings:
                  claim_mappings:
                    username:
                      - preferred_username
                    first_name:
                      - given_name
                    last_name:
                      - family_name
                    email:
                      - email
                groups_settings:
                  claim_mapping:
                    - groups
                  sync: true
                  sync_pattern: "*"
                  default_groups: []
                  make_users_staff: true
                  superuser_group_names:
                    - administrators
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      allowedHosts: referentielijsten.local,localhost
      secretKey: referentielijstenSecretKey
      disable2fa: true
      environment: podiumd-minikube
      database:
        host: postgres
        port: 5432
        name: referentielijsten
        username: referentielijsten
        password: referentielijsten
      email:
        host: mailpit
        port: 1025
        useTLS: false
        defaultFrom: noreply@example.com
      cache:
        default: redis-ha-master:6379/15
        axes: redis-ha-master:6379/15
    ingress:
      enabled: true
      hosts:
        - host: referentielijsten.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openbeheer (profile: openbeheer), as ExternalsPodiumD ---
  # Catalogi on Open Zaak (client openbeheer), Objecttypen and Objecten
  # tokens "openbeheer-token". apiDomain as ExternalsPodiumD's icat and
  # podiumd-infra: unset, the SPA's API URL renders as "https://". The SPA
  # is served by openbeheer-nginx, the Ingress target in ExternalsPodiumD
  # (templates/openbeheer/ingress.yaml). Redis DB 17, the chart default.
  openbeheer:
    enabled: false
    replicaCount: 1
    configuration:
      oidcUrl: https://openbeheer.local
      secrets:
        keycloak_client_secret: keycloakOpenbeheerClientSecret
      data: |-
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: keycloak-provider
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: https://keycloak.local/realms/podiumd/
          items:
            - identifier: admin-oidc
              oidc_provider_identifier: keycloak-provider
              enabled: true
              oidc_rp_client_id: openbeheer
              oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
              oidc_rp_scopes_list:
                - openid
                - email
                - profile
                - roles
              oidc_rp_sign_algo: RS256
              userinfo_claims_source: id_token
              options:
                user_settings:
                  claim_mappings:
                    username:
                      - preferred_username
                    first_name:
                      - given_name
                    last_name:
                      - family_name
                    email:
                      - email
                groups_settings:
                  claim_mapping:
                    - groups
                  sync: true
                  sync_pattern: "*"
                  default_groups: []
                  make_users_staff: true
                  superuser_group_names:
                    - administrators
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: objecttypen-service
              label: Objecttypen API
              api_root: https://objecttypen.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token objecttypenOpenbeheerToken
            - identifier: objecten-service
              label: Objecten API
              api_root: https://objecten.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token objectenOpenbeheerToken
            - identifier: catalogi-service
              label: Open Zaak - Catalogi API
              api_root: https://openzaak.local/catalogi/api/v1/
              api_type: ztc
              auth_type: zgw
              client_id: openbeheer
              secret: openbeheerSecret
            - identifier: selectielijst-service
              label: Open Zaak (public) - Selectielijst API
              api_root: https://selectielijst.openzaak.nl/api/v1/
              api_type: orc
              auth_type: no_auth
        api_configuration_enabled: true
        api_configuration:
          selectielijst_service_identifier: selectielijst-service
          objecttypen_service_identifier: objecttypen-service
    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      allowedHosts: openbeheer.local,openbeheer-nginx.podiumd-minikube.svc.cluster.local
      apiDomain: openbeheer.local
      secretKey: openbeheerSecretKey
      environment: podiumd-minikube
      database:
        host: postgres
        port: 5432
        name: openbeheer
        username: openbeheer
        password: openbeheer
      email:
        host: mailpit
        port: 1025
        useTLS: false
        defaultFrom: noreply@example.com
      cache:
        default: redis-ha-master:6379/17
        axes: redis-ha-master:6379/17

  # --- omc (profile: omc), as ExternalsPodiumD (icat) ---
  # Notify goes to podiumd-tests' Notify mock (its webhook receiver, created
  # by its bootstrap); podiumd-tests also subscribes OMC to Open
  # Notificaties (neither reference environment does). Besluiten
  # on Open Zaak: ExternalsPodiumD's separate besluiten host does not exist
  # here.
  omc:
    enabled: false
    settings:
      aspnetcore:
        environment: Development
      notify:
        api:
          baseUrl: http://ptest-bootstrap-mock-server.podiumd-minikube/notify
          # ExternalsPodiumD's NotifyNL test key (name-serviceId-secret).
          key: omcconfigtest-0c9cdaaf-7b0a-4d88-a8d8-dacbccf52734-173e579d-0f99-4d29-a6f8-7b522418f57b
        templateId:
          decisionMade: "00000000-0000-1000-8000-000000000000"
          email:
            zaakCreate: 716369c8-edba-44ff-a213-a045b4a8d246
            zaakUpdate: ed368ce1-89b5-4826-b34c-3f563fb418a9
            zaakClose: 123e14bd-181e-4a93-a15b-071bee52e383
          sms:
            zaakCreate: b2a51bd0-df3c-492a-9097-9384fa34060a
            zaakUpdate: 76e9ebe7-edae-4fac-ad3c-834586851ef2
            zaakClose: a8d0026a-afab-48e4-b034-c4d85bb3ca60
      omc:
        actor:
          id: 3a91832c-f2bd-4f22-8d5b-557b44c0ed38
        auth:
          jwt:
            secret: omcAuthJwtSecretForPodiumdMinikubeAtLeastSixtyFourCharactersLong0123
      zgw:
        auth:
          jwt:
            secret: omcSecret
            issuer: omc
          key:
            openklant: openklantOmcToken
            objecten: objectenOmcToken
            objectTypen: objecttypenOmcToken
        endpoint:
          openNotificaties: https://opennotificaties.local/api/v1
          openZaak: https://openzaak.local/zaken/api/v1
          openKlant: https://openklant.local/klantinteracties/api/v1
          contactMomenten: https://openklant.local/klantinteracties/api/v1
          besluiten: https://openzaak.local/besluiten/api/v1
          objecten: https://objecten.local/api/v2
          objectTypen: https://objecttypen.local/api/v2
        whitelist:
          zaakCreate:
            ids: "*"
          zaakUpdate:
            ids: "*"
          zaakClose:
            ids: "*"
          taskAssigned:
            ids: niet-bestaande-id
          decisionMade:
            ids: niet-bestaande-id
          message:
            allowed: false
    ingress:
      enabled: true
      hostname: omc.local

  # --- frankgateway + openbao (profile: frankgateway) ---
  # As ExternalsPodiumD's dim1 Frank!Gateway branch: outway only, OpenBao
  # with a static seal and Keycloak login, one replica each (single node).
  # Beyond it (user's choice, the chart runbook's step 6): the outway carries
  # the api-proxy's paths to the same targets, as the chart's reference routes
  # (only KvK's carries its API-key function; BAG's WireMock needs no key), and
  # podiumd_minikube.manifests.route_outbound points
  # the apps' http://api-proxy/ URLs at it. BRP on the outway, as the routes
  # doc places the real BRP; the mock stands in for it (the doc's internal
  # example routes the in-cluster mock east-west).
  # Fixed admin keys: helm template has no cluster for the chart's lookup and
  # would regenerate them on every render. The seal key comes from
  # .openbao/seal-key (podiumd_minikube.openbao), never from this file.
  frankgateway:
    enabled: false
    replicas: 1
    podDisruptionBudget:
      enabled: false
    admin:
      adminKey: frankgatewayAdminKeyPodiumdMinikube0001
      viewerKey: frankgatewayViewerKeyPodiumdMinikube001
    dashboard:
      enabled: false
    networkPolicies:
      enabled: false
    etcd:
      replicas: 1
      podDisruptionBudget:
        enabled: false
    instances:
      inway:
        enabled: false
      internal:
        enabled: false
      outway:
        enabled: true
        routes:
          apiproxy-brp:
            uri: "/haalcentraal/api/brp/*"
            name: apiproxy-brp
            labels:
              managed-by: iac
            upstream:
              type: roundrobin
              scheme: http
              pass_host: rewrite
              upstream_host: brp-personen-mock
              nodes:
                "brp-personen-mock:5010": 1
          apiproxy-bag:
            uri: "/lvbag/individuelebevragingen/v2/*"
            name: apiproxy-bag
            labels:
              managed-by: iac
            upstream:
              type: roundrobin
              scheme: http
              pass_host: rewrite
              upstream_host: wiremock
              nodes:
                "wiremock:8080": 1
          # The chart routes doc's KvK routes: the test dataset (/test/ prefix),
          # the key read from OpenBao at request time (podiumd_minikube.openbao stores it).
          apiproxy-kvk-basic:
            <<: &kvkRoute
              labels:
                managed-by: iac
              plugins:
                proxy-rewrite:
                  regex_uri: ["^/(.*)", "/test/$1"]
                serverless-pre-function:
                  phase: rewrite
                  functions:
                    - 'local set_secret_header = require("openbao-secret-header") return set_secret_header({ path = "frankgateway", field = "kvk_api_key", header = "apikey" })'
              upstream:
                type: roundrobin
                scheme: https
                pass_host: rewrite
                upstream_host: api.kvk.nl
                nodes:
                  "api.kvk.nl:443": 1
            uri: "/api/v1/basisprofielen*"
            name: apiproxy-kvk-basic
          apiproxy-kvk-branch:
            <<: *kvkRoute
            uri: "/api/v1/vestigingsprofielen*"
            name: apiproxy-kvk-branch
          apiproxy-kvk-search:
            <<: *kvkRoute
            uri: "/api/v2/zoeken*"
            name: apiproxy-kvk-search
  openbao:
    enabled: false
    configuration:
      oidcUrl: https://openbao.local
      secrets:
        keycloak_client_secret: keycloakOpenbaoClientSecret
      keycloak:
        url: https://keycloak.local
    database:
