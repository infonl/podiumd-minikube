  # --- frankgateway + openbao (profile: frankgateway) ---
  # As ExternalsPodiumD's dim1 Frank!Gateway branch: outway only, OpenBao
  # with a static seal and Keycloak login, one replica each (single node).
  # Beyond it (user's choice, the chart runbook's step 6): the outway carries
  # the api-proxy's paths to the same targets, as the chart's reference routes
  # (only KvK's carries its API-key function; BAG's mock needs no key), and
  # podiumd_minikube.manifests.route_outbound points
  # the apps' http://api-proxy/ URLs at it. BRP on the outway, as the routes
  # doc places the real BRP; the mock stands in for it (the doc's internal
  # example routes the in-cluster mock east-west).
  # Fixed admin keys: helm template has no cluster for the chart's lookup and
  # would regenerate them on every render. The seal key comes from
  # .openbao/seal-key (podiumd_minikube.openbao), never from this file.
  frankgateway:
    enabled: false
    replicas: 1
    podDisruptionBudget:
      enabled: false
    admin:
      adminKey: frankgatewayAdminKeyPodiumdMinikube0001
      viewerKey: frankgatewayViewerKeyPodiumdMinikube001
    dashboard:
      enabled: false
    networkPolicies:
      enabled: false
    etcd:
      replicas: 1
      podDisruptionBudget:
        enabled: false
    instances:
      inway:
        enabled: false
      internal:
        enabled: false
      outway:
        enabled: true
        routes:
          apiproxy-brp:
            uri: "/haalcentraal/api/brp/*"
            name: apiproxy-brp
            labels:
              managed-by: iac
            upstream:
              type: roundrobin
              scheme: http
              pass_host: rewrite
              upstream_host: brp-personen-mock
              nodes:
                "brp-personen-mock:5010": 1
          apiproxy-bag:
            uri: "/lvbag/individuelebevragingen/v2/*"
            name: apiproxy-bag
            labels:
              managed-by: iac
            upstream:
              type: roundrobin
              scheme: http
              pass_host: rewrite
              upstream_host: bag-mock
              nodes:
                "bag-mock:8080": 1
          # The chart routes doc's KvK routes: the test dataset (/test/ prefix),
          # the key read from OpenBao at request time (podiumd_minikube.openbao stores it).
          apiproxy-kvk-basic:
            <<: &kvkRoute
              labels:
                managed-by: iac
              plugins:
                proxy-rewrite:
                  regex_uri: ["^/(.*)", "/test/$1"]
                serverless-pre-function:
                  phase: rewrite
                  functions:
                    - 'local set_secret_header = require("openbao-secret-header") return set_secret_header({ path = "frankgateway", field = "kvk_api_key", header = "apikey" })'
              upstream:
                type: roundrobin
                scheme: https
                pass_host: rewrite
                upstream_host: api.kvk.nl
                nodes:
                  "api.kvk.nl:443": 1
            uri: "/api/v1/basisprofielen*"
            name: apiproxy-kvk-basic
          apiproxy-kvk-branch:
            <<: *kvkRoute
            uri: "/api/v1/vestigingsprofielen*"
            name: apiproxy-kvk-branch
          apiproxy-kvk-search:
            <<: *kvkRoute
            uri: "/api/v2/zoeken*"
            name: apiproxy-kvk-search
  openbao:
    enabled: false
    configuration:
      oidcUrl: https://openbao.local
      secrets:
        keycloak_client_secret: keycloakOpenbaoClientSecret
      keycloak:
        url: https://keycloak.local
    database:
      host: postgres
      username: openbao
      password: openbao
      sslmode: disable # minikube's Postgres has no TLS
    server:
      ha:
        replicas: 1

  # --- ita (profile: ita) ---
  # As ExternalsPodiumD: database on the shared Postgres, Open Klant/Objecten
  # tokens and Open Zaak client "ita", the KISS objecttypes (created by
  # podiumd.objecttypen.create_required_objecttypen_job, fixed UUIDs).
  ita:
    enabled: false
    ita:
      baseUrl: https://ita.local
    database:
      host: postgres
      password: ita
    apiConnections:
      openKlant:
        baseUrl: https://openklant.local/klantinteracties/api/v1/
        apiKey: openklantItaToken
      object:
        baseUrl: https://objecten.local/api/v2/
        apiKey: objectenItaToken
      zaakSysteem:
        baseUrl: https://openzaak.local
        key: itaSecret
    afdeling:
      type: https://objecttypen.local/api/v2/objecttypes/c8d301f9-80b8-4575-8b29-3e9431f92994
      typeVersion: 1
    groep:
      type: https://objecttypen.local/api/v2/objecttypes/cbec27ac-157b-490b-b586-9e8a8f5bbb85
      typeVersion: 1
    medewerker:
      type: https://objecttypen.local/api/v2/objecttypes/90984726-2692-49d8-8f9d-742075cb761d
      typeVersion: 1
    logboek:
      type: https://objecttypen.local/api/v2/objecttypes/2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
      typeVersion: 1
    web:
      oidc:
        # Keycloak's admin host, as ExternalsPodiumD and podiumd-infra.
        authority: https://keycloak-admin.local/realms/podiumd
        frontendUrl: https://ita.local/
        clientSecret: itaClientSecret
    smtp:
      fromEmail: noreply@example.com
      host: mailpit
      port: "1025"
      enableSsl: "false"
    ingress:
      enabled: true
      hosts:
        - host: ita.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- kiss (profile: kiss) ---
  # As ExternalsPodiumD (chart name "contact"), with the register of its
  # icat/mayk environments that calls Open Zaak and Open Klant directly:
  # minikube has no e-Suite behind the podiumd-adapter registers of dim1.
  # The adapter still serves the medewerkers sync from Objecten. Elasticsearch
  # one node as podiumd-infra; templates/kiss/elastic-user-secret.yaml fixes
  # its password before ECK generates one.
  kiss:
    enabled: false
    replicaCount: 1 # chart default 2
    configuration:
      oidcUrl: https://contact.local
      oidcSecret: kissClientSecret
    settings:
      database:
        host: postgres
        name: contact
        username: contact
        password: contact
      elastic:
        baseUrl: https://kiss-es-http:9200
        password: kissElasticPassword
      haalCentraal:
        baseUrl: http://api-proxy/haalcentraal/api/
        apiKey: unused-key # api-proxy needs no key
      kvk:
        baseUrl: http://api-proxy/api
        apiKey: unused-key # api-proxy needs no key
      email:
        host: mailpit
        port: 1025
        enableSsl: false
      feedback:
        emailFrom: noreply@example.com
        emailTo: noreply@example.com
      afdelingen:
        baseUrl: http://objecten.podiumd-minikube.svc.cluster.local
        objectTypeUrl: https://objecttypen.local/api/v2/objecttypes/c8d301f9-80b8-4575-8b29-3e9431f92994
        token: objectenContactToken
      groepen:
        baseUrl: http://objecten.podiumd-minikube.svc.cluster.local
        objectTypeUrl: https://objecttypen.local/api/v2/objecttypes/cbec27ac-157b-490b-b586-9e8a8f5bbb85
        token: objectenContactToken
      logboek:
        baseUrl: http://objecten.podiumd-minikube.svc.cluster.local
        objectTypeUrl: https://objecttypen.local/api/v2/objecttypes/2eb81bd1-0d2b-4123-84ab-d55b99b9e75a
        token: objectenContactToken
      managementInformatie:
        apiKey: kissManagementInformatieKey
      registers:
        - isDefault: true
          zaaksysteem:
            catalogiBaseUrl: https://openzaak.local/catalogi/api/v1
            clientId: contact
            clientSecret: contactSecret
            documentenBaseUrl: https://openzaak.local/documenten/api/v1
            zakenBaseUrl: https://openzaak.local/zaken/api/v1
            useExperimentalQueries: true
          klantinteractie:
            baseUrl: https://openklant.local/klantinteracties
            token: openklantContactToken
      syncJobs:
        kennisbank:
          baseUrl: http://objecten.podiumd-minikube.svc.cluster.local
          objectTypeUrl: https://objecttypen.local/api/v2/objecttypes/e4d2e353-80ea-4962-8276-920d59a3e8de
          schedule: "15 6-14 * * 1-5"
          token: objectenContactToken
        medewerkers:
          baseUrl: http://podiumd-minikube-adapter
          objectTypeUrl: https://objecttypen.local/api/v2/objecttypes/90984726-2692-49d8-8f9d-742075cb761d
          schedule: "15 6-14 * * 1-5"
          clientId: contact_intern
          clientSecret: contactAdapterSecret-hs256-needs-over-32-bytes
        vac:
          manageFromKiss: true
          baseUrl: http://objecten.podiumd-minikube.svc.cluster.local
          objectTypeUrl: https://objecttypen.local/api/v2/objecttypes/6a0d8f9d-f7e2-4e57-a91b-01656968a62d
          schedule: "15 6-14 * * 1-5"
          token: objectenContactToken
      oidc:
        authority: https://keycloak.local/realms/podiumd/
        clientSecret: kissClientSecret
      # As ExternalsPodiumD and podiumd-infra.
      organisatieIds:
        - "856683164"
    adapter:
      baseUrl: http://podiumd-minikube-adapter
      clientId: contact_intern
      # Same as syncJobs.medewerkers.clientSecret; HS256 signing needs over 32 bytes.
      secret: contactAdapterSecret-hs256-needs-over-32-bytes
      # podiumd<4.10: the adapter reads these keys here.
      objecttypen: &adapterObjecttypen
        baseUrlIntern: https://objecttypen.local
        baseUrlExtern: https://objecttypen.local
        medewerkerUUID: 90984726-2692-49d8-8f9d-742075cb761d
        afdelingUUID: c8d301f9-80b8-4575-8b29-3e9431f92994
        groepUUID: cbec27ac-157b-490b-b586-9e8a8f5bbb85
        interneTaakUUID: 72240cd6-29bb-4a66-b1c3-ab6589a39a22
        kennisartikelUUID: e4d2e353-80ea-4962-8276-920d59a3e8de
        vacUUID: 6a0d8f9d-f7e2-4e57-a91b-01656968a62d
      # podiumd >= 4.10 reads the objecttypen keys under objecten.
      objecten:
        <<: *adapterObjecttypen
        baseUrl: http://objecten.podiumd-minikube.svc.cluster.local
        token: objectenContactToken
      # No e-Suite here: unreachable, so contactverzoeken through the adapter fail.
      esuite:
        baseUrl: http://esuite.invalid
        clientId: contact-kiss
        secret: unused-esuite-secret
        contactverzoektypen:
          - Terugbelverzoek
    ingress:
      enabled: true
      hosts:
        - host: contact.local
          paths:
            - path: /
              pathType: ImplementationSpecific

# -----------------------------------------------------------------------
# monitoring-logging (the metrics profile): chart defaults except where a
# comment names the single-node reason.
# -----------------------------------------------------------------------
monitoring-logging:
  grafana:
    # Both sidecars (dashboards, datasources); neither reference environment
    # sets them. Settled at 71 MiB each.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          cpu: 100m
          memory: 128Mi
    persistence:
      storageClassName: standard
      size: 2Gi
    # Off: its capability-limited chown fails on Grafana's own 0700 export dirs after
    # the first start (Init:Error); fsGroup covers ownership on minikube's storage.
    initChownData:
      enabled: false
    # The chart's Prometheus URL assumes "<release>-kube-prometheus-prometheus";
    # kube-prometheus-stack truncates the name to "podiumd-minikube-kube-prom-prometheus".
    # The whole list is repeated: Helm replaces lists.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            editable: true
            type: prometheus
            uid: prometheus
            readOnly: false
            url: http://podiumd-minikube-kube-prom-prometheus:9090
            access: proxy
            isDefault: false
          - name: loki
            type: loki
            uid: loki
            readOnly: false
            editable: true
            access: proxy
            isDefault: true
            url: http://podiumd-minikube-loki-gateway
            version: 1
            jsonData:
              timeout: 300
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "1"
    grafana.ini:
      auth.generic_oauth:
        enabled: false # no Keycloak client wired up for this dev tool - anonymous admin access instead, as a dev tool
      auth.anonymous:
        enabled: true
        org_role: Admin
      auth:
        disable_login_form: true
      server:
        domain: grafana.local
        enforce_domain: false # avoids a redirect loop if reached by IP or a different hostname
        root_url: https://grafana.local/
      security:
        cookie_secure: false # plain http://*.local, not https - same fix as openarchiefbeheer's identical cookie issue elsewhere in this file
      smtp:
        host: "mailpit:1025" # see templates/mailpit/ - every other app's email settings point here too
        from_address: noreply@example.com
    ingress:
      enabled: true
      hosts:
        - grafana.local
      path: /
      pathType: ImplementationSpecific
  kube-prometheus-stack:
    # Off: its ServiceMonitor sets trackTimestampsStaleness, which the bundled CRD
    # rejects (version skew inside monitoring-logging).
    kubelet:
      enabled: false
    # Off: these create Services in kube-system, which the deploy's single
    # `kubectl apply -n podiumd-minikube` rejects; minikube's static control-plane
    # pods have nothing for them to scrape.
    coreDns:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    # Off as ExternalsPodiumD: node-exporter, kube-state-metrics, the API
    # server and DNS scrapes, the default alerting rules.
    nodeExporter:
      enabled: false
    kubeStateMetrics:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeDns:
      enabled: false
    defaultRules:
      create: false
    prometheusOperator:
      resources: # as ExternalsPodiumD
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      prometheusConfigReloader:
        resources: # as ExternalsPodiumD
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
    prometheus:
      prometheusSpec:
        logLevel: warn
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        # ExternalsPodiumD: 7d and the chart's 512Mi/2Gi. Capacity only: one
        # day of a laptop's metrics; settled at 345 MiB after a full tier, and
        # the limit gives it GOMEMLIMIT (manifests.limit_runtimes).
        retention: 1d
        retentionSize: 1GB # of its 2Gi volume
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 2Gi
  alloy:
    # Alloy's DaemonSet keeps the chart's AKS node label
    # (kubernetes.azure.com/agentpool: userpool), which Helm could not clear
    # at this nesting depth; provision.py labels the minikube node instead.
    # The chart's own log pipeline, for this namespace (ExternalsPodiumD:
    # podiumd and monitoring).
    logCollectionNamespaces:
      - podiumd-minikube
  prometheus-pushgateway:
    enabled: false # as ExternalsPodiumD
  loki:
    # The rules sidecar; neither reference environment sets it. Settled at 82 MiB.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          cpu: 100m
          memory: 160Mi
    # Chart default (Distributed) runs ~17 separate microservice pods
    # sized for horizontal scale a single-node dev box will never need -
    # SingleBinary is the same functionality (log storage + query) on
    # one pod, and drops the MinIO dependency below entirely.
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      persistence:
        storageClassName: standard
        size: 2Gi
      resources: # as podiumd-infra's SingleBinary Loki
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      # Capacity only: collect at 1.5x the live heap instead of 2x (it grew
      # 202 -> 328 MiB over a day of tiers under its 1Gi GOMEMLIMIT).
      extraEnv:
        - name: GOGC
          value: "50"
    minio:
      enabled: false # only needed by Distributed mode's S3-backed storage
    loki:
      commonConfig:
        # One replica: with the default 3 every query failed with "too many unhealthy
        # instances in the ring".
        replication_factor: 1
      storage:
        type: filesystem # was s3 (pointed at the now-disabled minio)
        object_store:
          type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem # chart default is s3, same reason as above
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      compactor:
        delete_request_store: filesystem # chart default is s3
    resultsCache:
      enabled: false # query-result caching - skippable at dev-scale query volume, not a functional loss
    chunksCache:
      enabled: false # same reasoning as resultsCache above
    # Distributed-mode targets, all 0: SingleBinary runs them, and the chart's
    # validate.yaml refuses single binary and distributed targets together.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    queryScheduler:
      replicas: 0
    queryFrontend:
      replicas: 0
    distributor:
      replicas: 0
    querier:
      replicas: 0
    ingester:
      replicas: 0
  opentelemetry-collector:
    # The chart's logs and metrics pipelines, no traces (no Tempo), as
    # ExternalsPodiumD. Limit 256Mi instead of the chart's 512Mi (settled at
    # 173 MiB); GOMEMLIMIT and memory_limiter's 80% follow it.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    config:
      exporters:
        # Same Prometheus name mismatch as Grafana's datasource above.
        prometheusremotewrite:
          endpoint: http://podiumd-minikube-kube-prom-prometheus:9090/api/v1/write
