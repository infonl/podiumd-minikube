# Every app is reachable in the namespace by its plain name (podiumd sets
# each fullnameOverride), e.g. http://openzaak/, http://openklant/, http://pabc/.

objecten:
  # Open Object (podiumd >= 4.10) or separate objecten/objecttypen charts;
  # set by podiumd-minikube deploy from chart.objecten_shape, never by hand.
  merged: false
metrics:
  enabled: false # monitoring-logging (Grafana, Prometheus, Loki, Alloy), as both reference environments
# Realm acc-mock in our own Keycloak: the stand-in for Dimpact's acceptance
# Keycloak behind identity provider accp-dimp-oidc; its user signs in through it.
accMock:
  username: acc-admin
  password: accMockAdminPassword
  clientSecret: &accMockClientSecret accMockOtaauthClientSecret
images:
  # As the Azure estates (podiumd-infra kees00: Flexible Server 15), not the
  # release's bundled postgres image (16): SQL that needs a newer major fails there.
  postgresMajor: 15
podiumd:
  enabled: true

  # --- Azure/production-specific pieces this chart doesn't use ---
  # --- Keycloak: podiumd's operator and realm config, as both reference environments ---
  keycloak-operator:
    enabled: true
    # As ExternalsPodiumD. It renders the Role that lets the operator write Keycloak's
    # ServiceMonitor: with the monitoring CRDs present it reconciles one, else a 403.
    enableServiceMonitor: true
    # Laptop budget: chart 768Mi; the heap is in manifests.KEYCLOAK_OPERATOR_JAVA_OPTS.
    operator:
      resources:
        limits:
          memory: 384Mi
    jobs:
      ensureOperatorSa:
        clientSecret: keycloakOperatorClientSecret
  keycloak:
    instances: "1"
    auth:
      adminUser: admin
      adminPassword: admin
    externalDatabase:
      database: keycloak
      user: keycloak
      password: keycloak
    # Laptop budget: chart 1700Mi/2Gi. The JVM flags are in manifests.KEYCLOAK_JAVA_OPTS.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 768Mi
    # A fresh install needs the public host, else discovery serves the admin host
    # until the realm import (helm-charts #620 docs); as podiumd-infra kees00.
    hostname:
      hostname: https://keycloak.local
    config:
      realm: podiumd # the chart's default; templates/zac's seed Job reads it
      adminFrontendUrl: https://keycloak-admin.local
      realmFrontendUrl: https://keycloak.local
      # As podiumd-infra and ExternalsPodiumD's ontw environments (icat, dim1, mayk):
      # the realm roles and groups podiumd-tests' bootstrap assigns.
      skipRoles: false
      skipGroups: false
      # As kees00 and ExternalsPodiumD ontw/test (alias accp-dimp-oidc), federating
      # to realm acc-mock (templates/keycloak/acc-mock-realm.yaml) instead of
      # Dimpact's acceptance Keycloak.
      adminIdentityProviders:
        identityProviders:
        - alias: accp-dimp-oidc
          displayName: acc-mock (stand-in for dimpact acceptance users)
          providerId: keycloak-oidc
          enabled: true
          updateProfileFirstLoginMode: "on"
          trustEmail: false
          storeToken: false
          addReadTokenRoleOnCreate: false
          authenticateByDefault: false
          linkOnly: false
          hideOnLogin: false
          config:
            clientId: otaauth
            clientSecret: *accMockClientSecret
            clientAuthMethod: client_secret_post
            issuer: https://keycloak.local/realms/acc-mock
            authorizationUrl: https://keycloak.local/realms/acc-mock/protocol/openid-connect/auth
            logoutUrl: https://keycloak.local/realms/acc-mock/protocol/openid-connect/logout
            # Keycloak does not trust the local CA: its own backchannel calls go in-cluster.
            tokenUrl: http://keycloak-service:8080/realms/acc-mock/protocol/openid-connect/token
            jwksUrl: http://keycloak-service:8080/realms/acc-mock/protocol/openid-connect/certs
            userInfoUrl: http://keycloak-service:8080/realms/acc-mock/protocol/openid-connect/userinfo
            useJwksUrl: "true"
            validateSignature: "true"
            syncMode: LEGACY
            pkceEnabled: "false"
            # Keycloak 26.8 (CVE-2026-12388) refuses admin-mapper with 403 without it.
            allowAdminRoleMapping: "true"
      adminIdentityProviderMappers:
        identityProviderMappers:
          - name: admin-mapper
            identityProviderAlias: accp-dimp-oidc
            identityProviderMapper: oidc-hardcoded-role-idp-mapper
            config:
              syncMode: FORCE
              role: admin
      realmIdentityProviders:
        identityProviders:
        - alias: accp-dimp-oidc
          displayName: acc-mock (stand-in for dimpact acceptance users)
          providerId: keycloak-oidc
          enabled: true
          updateProfileFirstLoginMode: "on"
          trustEmail: false
          storeToken: false
          addReadTokenRoleOnCreate: false
          authenticateByDefault: false
          linkOnly: false
          hideOnLogin: false
          config:
            clientId: otaauth
            clientSecret: *accMockClientSecret
            clientAuthMethod: client_secret_post
            issuer: https://keycloak.local/realms/acc-mock
            authorizationUrl: https://keycloak.local/realms/acc-mock/protocol/openid-connect/auth
            logoutUrl: https://keycloak.local/realms/acc-mock/protocol/openid-connect/logout
            # Keycloak does not trust the local CA: its own backchannel calls go in-cluster.
            tokenUrl: http://keycloak-service:8080/realms/acc-mock/protocol/openid-connect/token
            jwksUrl: http://keycloak-service:8080/realms/acc-mock/protocol/openid-connect/certs
            userInfoUrl: http://keycloak-service:8080/realms/acc-mock/protocol/openid-connect/userinfo
            useJwksUrl: "true"
            validateSignature: "true"
            syncMode: LEGACY
            pkceEnabled: "false"
      realmIdentityProviderMappers:
        identityProviderMappers:
          - name: user are administrators
            identityProviderAlias: accp-dimp-oidc
            identityProviderMapper: oidc-hardcoded-group-idp-mapper
            config:
              syncMode: FORCE
              group: /administrators
      smtp:
        server: mailpit
        port: "1025"
        from: noreply@example.com
        fromDisplayName: PodiumD minikube
        starttls: "false"
      clients:
        # Grafana keeps anonymous access (monitoring-logging.grafana's grafana.ini).
        monitoring:
          secret: keycloakMonitoringClientSecret
          oidcUrl: https://grafana.local
        # No Datamigratie here.
        datamigratie:
          enabled: false
        # Rendered only with podiumd.zaakbrug.enabled.
        zaakbrug:
          secret: keycloakZaakbrugClientSecret
          oidcUrl: https://zaakbrug.local
  # --- Redis: podiumd's redis-operator, as both reference environments ---
  redis-operator:
    enabled: true
    redis-ha:
      replicaCount: 1 # chart 3
      # Laptop budget: chart 256Mi/512Mi.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
  apisix:
    enabled: false # already false by default upstream, set explicitly for clarity
  # --- zgw-office-addin (profile: zgw-office-addin) ---
  # As podiumd-infra anna00/bas00: placeholder MSAL ids, no Entra app, so Office
  # sign-in fails; the frontend serves its manifest and the backend calls Open Zaak.
  zgw-office-addin:
    enabled: false
    common:
      appEnv: podiumd-minikube
      frontendUrl: https://office-addin.local
      msalTenantId: 00000000-0000-0000-0000-000000000000
      msalClientId: 00000000-0000-0000-0000-000000000000
    backend:
      msalSecret: placeholder-entra-not-configured
      zgwApis:
        url: https://openzaak.local
        secret: officeAddInSecret
  # ita and kiss: own blocks before the monitoring-logging dependency.
  # One node, as podiumd-infra (ExternalsPodiumD runs three).
  kiss-eck:
    enabled: false
    # eck-stack's own defaults; one chart level deeper Helm ignores them and
    # renders these parts (eck-fleet-server then fails the render).
    eck-agent:
      enabled: false
    eck-fleet-server:
      enabled: false
    eck-beats:
      enabled: false
    eck-logstash:
      enabled: false
    eck-apm-server:
      enabled: false
    eck-autoops-agent-policy:
      enabled: false
    eck-package-registry:
      enabled: false
    # Laptop budget: Kibana is an admin UI no test uses; enable with
    # --set podiumd.kiss-eck.eck-kibana.enabled=true (ExternalsPodiumD runs it).
    eck-kibana:
      enabled: false
    eck-elasticsearch:
      nodeSets:
        - name: default
          count: 1
          config:
            node.roles:
              - data
              - ingest
              - master
            node.store.allow_mmap: false
            # Laptop budget: thread pools sized for 1 CPU instead of the node's 6.
            node.processors: 1
            # Laptop budget: no ML module (its native controller); nothing here uses ML.
            xpack.ml.enabled: false
          # Laptop budget: an explicit heap (ECK's default 2Gi sizes it at 1 GiB);
          # 1Gi OOMKilled it with a 512m heap.
          podTemplate:
            spec:
              containers:
                - name: elasticsearch
                  # CPU as ExternalsPodiumD.
                  resources:
                    requests:
                      cpu: 200m
                      memory: 1536Mi
                    limits:
                      cpu: 1000m
                      memory: 1536Mi
                  env:
                    # Laptop budget: ExternalsPodiumD 1g; old gen peaks at 100 MiB.
                    - name: ES_JAVA_OPTS
                      value: &esJavaOpts "-Xms192m -Xmx192m"
          volumeClaimTemplates:
            - metadata:
                name: elasticsearch-data
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
  eck-operator:
    enabled: false
    # podiumd's operator watches namespace "podiumd" only; ours is
    # podiumd-minikube (its Role/RoleBinding land there).
    managedNamespaces:
      - podiumd-minikube
    # The metrics profile turns on its podMonitor. ExternalsPodiumD and the chart's
    # values-enable-observability.yaml set metricsPort, which eck-operator 3.x
    # ignores: its metrics.port default "0" wins.
    config:
      metrics:
        port: "8080"
  # As both reference projects, but laptop budget: clamd loads only the EICAR
  # signature (13 MiB instead of 973 MiB with the official databases) and
  # freshclam never runs (no internet needed). The "-" argument makes the
  # image exec clamd directly.
  clamav:
    enabled: false
    extraArgs:
      - --foreground
    # The exporter sidecar (metrics profile), as the chart's values-enable-observability.yaml.
    metrics:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
    extraVolumes:
      - name: signatures
        configMap:
          name: clamav-signatures
    # podiumd's clamdConfig reads /var/lib/clamav, where the image ships the
    # official databases; this mount replaces them.
    extraVolumeMounts:
      - name: signatures
        mountPath: /var/lib/clamav
        readOnly: true
    persistentVolume:
      enabled: false # podiumd's Azure managed-csi PVC; the signatures come from the ConfigMap
    hpa:
      enabled: false
    # clamd starts in about a second with one signature.
    startupProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
    readinessProbe:
      initialDelaySeconds: 5
    livenessProbe:
      initialDelaySeconds: 30
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
  # --- zaakbrug (profile: zaakbrug), as podiumd-infra jimme00 and the chart's
  # zaakbrug-deploy.md; dtap stage as kees00. Laptop budget: heap 768M, C1 only
  # (chart Xms=Xmx=4G, 5Gi/6Gi; ontw idles at 3388 MiB).
  zaakbrug:
    enabled: false
    fullnameOverride: zaakbrug
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1536Mi
    frank:
      memory:
        percentage: false
        minimum: 128M
        maximum: 768M
      # Serial GC by JVM ergonomics (limit below 1792 MiB): old gen settles at 330 MiB.
      javaOpts: -XX:TieredStopAtLevel=1
      dtap:
        stage: TST
      credentials:
        secret: zaakbrug-secrets
        key: credentials.properties
      zakenApi:
        jwt:
          password: zaakbrugSecret
      # Console SSO; Frank binds only these dotted keys.
      environmentVariables:
        application.security.console.authentication.type: OAUTH2
        application.security.console.authentication.provider: custom
        application.security.console.authentication.clientId: zaakbrug
        application.security.console.authentication.clientSecret: keycloakZaakbrugClientSecret
        application.security.console.authentication.issuerUri: https://keycloak.local/realms/podiumd
        application.security.console.authentication.authorizationUri: https://keycloak.local/realms/podiumd/protocol/openid-connect/auth
        application.security.console.authentication.tokenUri: https://keycloak.local/realms/podiumd/protocol/openid-connect/token
        application.security.console.authentication.userInfoUri: https://keycloak.local/realms/podiumd/protocol/openid-connect/userinfo
        application.security.console.authentication.jwkSetUri: https://keycloak.local/realms/podiumd/protocol/openid-connect/certs
        application.security.console.authentication.userNameAttributeName: preferred_username
        application.security.console.authentication.scopes: openid,profile,email,roles
        application.security.console.authentication.authoritiesClaimName: roles
    connections:
      create: true
      jdbc:
        # Empty, as jimme00: the chart then names it jdbc/<release>, which Narayana
        # looks up (the docs' jdbc/podiumd fits only release "podiumd").
        - name: ""
          type: postgresql
          host: postgres
          port: "5432"
          database: zaakbrug
          username: zaakbrug
          password: zaakbrug
          ssl: true
    zaakbrug:
      zgw:
        zakenApi:
          rootUrl: https://openzaak.local/zaken/api/v1/
        catalogiApi:
          rootUrl: https://openzaak.local/catalogi/api/v1/
        documentenApi:
          rootUrl: https://openzaak.local/documenten/api/v1/
        besluitenApi:
          rootUrl: https://openzaak.local/besluiten/api/v1/

  # The chart's phase 1 (ingress allow-lists for the sensitive backends), as
  # podiumd-infra kees00; Cilium enforces them, as on ExternalsPodiumD's dim1-3
  # and dimp clusters. Prometheus runs in this namespace, not in "monitoring";
  # manifests.scrape_only_from_prometheus narrows that rule to its pod.
  networkPolicies:
    enabled: true
    ingressControllerNamespace: ingress-basic
    monitoringNamespace: podiumd-minikube

  # --- zac (always on - the app itself) ---
  zac:
    enabled: true
    replicaCount: 1
    # As ExternalsPodiumD: ZAC's nginx in front of WildFly (podiumd enables
    # it); it adds HSTS and nosniff and allows 150 MB request bodies.
    nginx:
      useXForwardedHost: true
      allowedHosts: zac.local,zac.podiumd-minikube
    autoscaling:
      enabled: false
    # Laptop budget: ExternalsPodiumD runs -Xmx1024m -Xms1024m. A small -Xms and a
    # periodic G1 cycle give unused heap back (the serial GC kept ZAC's heap near -Xmx).
    # TieredStopAtLevel=1: only the C1 compiler, less code cache and compiler memory.
    javaOptions: "-Xms64m -Xmx768m -XX:ActiveProcessorCount=2 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:TieredStopAtLevel=1"
    contextUrl: https://zac.local
    db:
      host: postgres
      name: zac
      user: zac
      password: password
    auth:
      server: https://keycloak.local
      secret: keycloakZacClientSecret
      # No enablePkce: off, as podiumd-infra (pkceEnabled "false").
    keycloak:
      adminClient:
        secret: zacAdminClientSecret
    # As ExternalsPodiumD.
    gemeente:
      code: "3467"
      naam: Gemeente Dimpact
      mail: noreply@dimpact.nl
    organizations:
      verantwoordelijke:
        rsin: "856683164"
      bron:
        rsin: "856683164"
    mail:
      smtp:
        # Mailpit, as every app; it needs no SMTP login.
        server: mailpit
        port: "1025"
        username: ""
        password: ""
    # Dotted Service name: Open Zaak re-validates URLs it built from this host
    # (e.g. ?catalogus=<url>) with Django's URLValidator, which rejects single-label
    # hostnames such as "openzaak".
    zgwApis:
      url: https://openzaak.local/
      clientId: zac # as ExternalsPodiumD
      secret: zacSecret
    notificationsSecretKey: openNotificatiesApiSecretKey
    # Read only by templates/zac/productaanvraag-zaakafhandelparameters-job.yaml.
    # The e2e zaaktype podiumd's create_required_catalogi_job creates; ZAC starts a
    # zaak of it only with a case definition, default group and niet-ontvankelijk
    # resultaat (ZaaktypeCmmnConfiguration.isValide). Group behandelaars of podiumd's
    # PABC dataset.
    productaanvraag:
      zaaktypeIdentificatie: zaaktype-voor-e2e-testen
      caseDefinitionKey: generiek-zaakafhandelmodel
      defaultGroepId: behandelaars
      nietOntvankelijkResultaatNaam: Geweigerd e2e
      productaanvraagtype: productaanvraag-zaaktype-voor-e2e-testen
    klantinteractiesApi:
      url: https://openklant.local
      token: openklantZacToken
    objectenApi:
      url: https://objecten.local
      token: objectenZaakToken
    # No template reads it, but podiumd's placeholder check (validations.yaml)
    # rejects the chart's "objectentoken"; values as objectenApi, URL as podiumd-infra.
    objecttypenApi:
      url: https://objecttypen.local
      token: objectenZaakToken
    # Basic auth between ZAC and Gotenberg; the placeholder check rejects the chart's "dummy".
    office_converter:
      username: zac
      password: zacOfficeConverterPassword
    # BRP/KvK/BAG through the api-proxy, as ExternalsPodiumD.
    brpApi:
      url: http://api-proxy/haalcentraal/api/brp/
      # As ExternalsPodiumD; brp-personen-mock ignores the key. ZAC rejects a
      # header without a value.
      apiKey:
        value: unused-key
        header: x-api-key
    kvkApi:
      url: http://api-proxy/
      apiKey: fakeKvkApiKey
    bagApi:
      url: http://api-proxy/lvbag/individuelebevragingen/v2/
      apiKey: fakeBagApiKey
    openForms:
      url: https://openformulieren-nginx.local # as ExternalsPodiumD: Open Formulieren's public host
    pabcApi:
      url: http://pabc
      # Required: ZAC's PabcClientHeadersFactory fails at class init without it and
      # stays broken until restart. Matches podiumd.pabc.settings.apiKeys.
      apiKey: zac-test-api-key
    zacInternalEndpointsApiKey: fakeZacInternalEndpointsApiKey
    smartDocuments:
      enabled: false
    signaleringen:
      deleteOlderThanDays: "14"
    # ZAC's SolrCloud through the chart's solr-operator, as ExternalsPodiumD; ZAC's
    # init-solr-zac-core container creates the zac collection.
    solr-operator:
      watchNamespaces: podiumd-minikube
      solr:
        replicas: 1 # chart 3
        # Laptop budget: chart -Xms512m -Xmx768m, 1Gi/2Gi. The GC is in manifests.tune_solr.
        javaMem: "-Xms64m -Xmx512m -XX:ActiveProcessorCount=2"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 768Mi
        storage:
          storageClassName: standard
      zookeeper-operator:
        watchNamespace: podiumd-minikube
        zookeeper:
          replicas: 1 # as ExternalsPodiumD
          # Laptop budget: chart 256Mi/512Mi. The heap is in manifests.tune_solr.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          storage:
            storageClassName: standard
    # Off, as ExternalsPodiumD gets by default: ZAC's OTel SDK stays off and its
    # bundled collector is not deployed. One chart level deeper than podiumd,
    # Helm renders that collector unless this is set (checked with helm 4.3.0).
    opentelemetry-collector:
      enabled: false
    ingress:
      enabled: true
      hosts:
        - host: zac.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openzaak (always on - core) ---
  openzaak:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
    flower:
      enabled: false
    worker:
      replicaCount: 1
      concurrency: 1 # laptop budget; chart default 4
    beat:
      replicaCount: 1 # as ExternalsPodiumD and podiumd-infra: runs daily-remove-imports
    tags:
      redis: false # point at the shared Redis instead of the chart's bundled one
    # Creates catalogus ALG with ZAC's bron RSIN, its document and besluit types
    # and, as podiumd-infra, zaaktype-voor-e2e-testen (ExternalsPodiumD: false;
    # the tests use it).
    create_required_catalogi_job:
      enabled: true
      client_id: integratieteam
      secret: integratieteamSecret
      e2eTestZaaktype:
        create: true
    configuration:
      job:
        enabled: true
      # No PKCE: mozilla-django-oidc-db, in every Django app here, cannot send
      # a code_challenge, so a client requiring it fails every login
      # (tests/test_keycloak_realm.py guards this).
      data: |-
        sites_config_enable: true
        sites_config:
          items:
            - domain: openzaak.local
              name: Open Zaak

        # notifications_config is required: without it Open Zaak answers 500 on every
        # create ("Notifications API configuration is broken or absent"). Kanalen are
        # registered on Open Notificaties (notifications_kanalen_config).
        # Client ids, identifiers and Applicatie uuids as ExternalsPodiumD: Open Zaak
        # notifies as "zaak"; Open Notificaties checks it through this Autorisaties
        # API as "notificaties".
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: notificaties-api
              label: Open Notificaties
              api_root: https://opennotificaties.local/api/v1/
              api_type: nrc
              auth_type: zgw
              client_id: zaak
              secret: zaakSecret
            # As ExternalsPodiumD; Open Zaak validates zaakobject URLs with
            # it. Token: Open Formulieren's Objecten token, as podiumd-infra
            # (its "formulier").
            - identifier: objecten-api
              label: Objecten API
              api_root: https://objecten.local/api/v2/
              api_type: orc
              auth_type: api_key
              header_key: Authorization
              header_value: Token objectenFormulierToken
            # As ExternalsPodiumD.
            - identifier: autorisaties-api
              label: Open Zaak - Autorisaties
              api_root: https://openzaak.local/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: zaak
              secret: zaakSecret

        vng_api_common_credentials_config_enable: true
        vng_api_common_credentials:
          items:
            - identifier: zaak
              secret: zaakSecret
            - identifier: notificaties
              secret: notificatiesSecret
            - identifier: openinwoner
              secret: openinwonerSecret
            - identifier: ita
              secret: itaSecret
            - identifier: contact
              secret: contactSecret
            - identifier: omc
              secret: omcSecret
            - identifier: openbeheer
              secret: openbeheerSecret
            - identifier: zaakbrug
              secret: zaakbrugSecret
            # The add-in's backend hardcodes this client id.
            - identifier: office-add-in
              secret: officeAddInSecret
            # As ExternalsPodiumD.
            - identifier: integratieteam
              secret: integratieteamSecret
            - identifier: objecten
              secret: objectenSecret
            - identifier: zac
              secret: zacSecret
            - identifier: formulier
              secret: formulierSecret
            - identifier: openarchiefbeheer
              secret: openarchiefbeheerSecret

        vng_api_common_applicaties_config_enable: true
        vng_api_common_applicaties:
          items:
            - uuid: 6bf5bfb4-e76b-469f-b993-4aedb832b61f
              client_ids:
                - zaak
              heeft_alle_autorisaties: true
              label: Zaak
            - uuid: 4b305285-64c4-484a-8db4-2f66996d4760
              client_ids:
                - zac
              heeft_alle_autorisaties: true
              label: Zaakafhandelcomponent
            - uuid: f00acb0b-bc09-4562-8d7e-7dc18d12972d
              client_ids:
                - formulier
              heeft_alle_autorisaties: true
              label: Formulier
            - uuid: 9d6586fc-3d45-48cc-a04b-7853ebf0fe2a
              client_ids:
                - openarchiefbeheer
              heeft_alle_autorisaties: true
              label: Openarchiefbeheer
            - uuid: c5989254-922d-43f9-a32a-3fa2a44f6230
              client_ids:
                - notificaties
