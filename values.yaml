  openbeheer:
    enabled: false
    replicaCount: 1
    configuration:
      oidcUrl: https://openbeheer.local
      secrets:
        keycloak_client_secret: keycloakOpenbeheerClientSecret
      data: |-
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: keycloak-provider
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: https://keycloak.local/realms/zaakafhandelcomponent/
          items:
            - identifier: admin-oidc
              oidc_provider_identifier: keycloak-provider
              enabled: true
              oidc_rp_client_id: openbeheer
              oidc_rp_client_secret: {value_from: {env: keycloak_client_secret}}
              oidc_rp_scopes_list:
                - openid
                - email
                - profile
                - roles
              oidc_rp_sign_algo: RS256
              userinfo_claims_source: id_token
              options:
                user_settings:
                  claim_mappings:
                    username:
                      - preferred_username
                    first_name:
                      - given_name
                    last_name:
                      - family_name
                    email:
                      - email
                groups_settings:
                  claim_mapping:
                    - groups
                  sync: true
                  sync_pattern: "*"
                  default_groups: []
                  make_users_staff: true
                  superuser_group_names:
                    - administrators
        zgw_consumers_config_enable: true
