# Service naming convention used throughout this file (must match the raw
# templates written in build order step 2): plain, unprefixed Service names
# in this chart's own namespace - postgres, redis, keycloak, solr, wiremock.
# podiumd's own nested apps are similarly reachable by their plain
# fullnameOverride (see below) since podiumd already sets each one to just
# the app's own name (confirmed via `helm show values dimpact/podiumd`),
# e.g. http://openzaak/, http://openklant/, http://pabc/.

# -----------------------------------------------------------------------
# Our own profile flags - compose-profile equivalents. Mirrors
# start-docker-compose.sh's own opt-in behavior (no flags = core stack only).
# -----------------------------------------------------------------------
zac:
  enabled: true # "zac" profile - on by default so the app is visible
wiremock:
  enabled: false # extra wiremock mappings (smartdocuments/kvk/bag) - was "itest", renamed since that's all this flag does now
  # mailpit (SMTP test server) moved out of this profile - it's now
  # unconditional (templates/mailpit/), since every app's own email
  # settings point at it regardless of which optional profiles are on.
objecten:
  enabled: false
opennotificaties:
  enabled: false
openarchiefbeheer:
  enabled: false
openformulieren:
  enabled: false # also pulls in objecten + objecttypen + opennotificaties
metrics:
  enabled: false
monitoringLogging:
  # Optional alternative implementation for the "metrics" profile - off by
  # default (templates/metrics/'s raw templates stay the default). When
  # true, supersedes those raw templates with the "monitoring-logging"
  # Chart.yaml dependency's own grafana/tempo/opentelemetry-collector
  # (+ optionally loki/alloy/kube-prometheus-stack/prometheus-pushgateway)
  # subcharts instead - see the "monitoring-logging" block further down
  # for how each is re-tuned for a single-node minikube box (that chart's
  # own defaults assume a multi-node AKS cluster: Loki in distributed
  # mode with ~17 pods + MinIO, Alloy pinned to an AKS-only node label,
  # managed-csi storage classes, Keycloak OAuth, a production SMTP relay).
  # Requires metrics.enabled=true too - this only decides *which*
  # implementation backs that profile, it doesn't turn the profile on by
  # itself. Needs podiumd.zac.opentelemetry_zaakafhandelcomponent.endpoint
  # repointed at the new otel-collector Service name too when enabling
  # this - see that key's own comment, and scripts/deploy.sh's handling
  # of both together.
  #
  # Flipping this on an *already-deployed* cluster (either direction) always
  # needs a manual cleanup pass afterward - confirmed live: deploy.sh applies
  # via plain `kubectl apply`, which only ever adds/updates resources
  # present in the current render, never deletes ones that dropped out of
  # it (unlike `helm upgrade`, which diffs against the previous release).
  # Toggling this leaves the *other* implementation's Deployments/Services/
  # ConfigMaps/Ingress running right alongside the new ones - exactly the
  # "two Grafanas at once" scenario this flag exists to prevent - until
  # someone deletes them by hand (`kubectl delete deployment,svc,ingress,cm
  # grafana otel-collector prometheus tempo` for raw-templates leftovers
  # when switching *to* monitoringLogging, for example).
  enabled: false

# -----------------------------------------------------------------------
# Raw templates this chart defines itself (Postgres/Redis/Keycloak/Solr/
# WireMock) - see build order step 2.
# -----------------------------------------------------------------------
postgres:
  # Referenced by the openzaak fixture SQL as psql -v variables, matching
  # docker-compose.yaml's openzaak-database service defaults exactly.
  bagApiClientUrl: https://api.bag.kadaster.nl/lvbag/individuelebevragingen/v2/
  bagApiKey: please-request-a-bag-api-key

# -----------------------------------------------------------------------
# The podiumd dependency and everything nested inside it.
# -----------------------------------------------------------------------
podiumd:
  enabled: true

  # --- Azure/production-specific pieces this chart doesn't use ---
  keycloak-operator:
    enabled: false # we run plain Keycloak instead - see templates/keycloak.yaml
  redis-operator:
    enabled: false # we run plain Redis instead - see templates/redis.yaml
  apisix:
    enabled: false # already false by default upstream, set explicitly for clarity
  zgw-office-addin:
    enabled: false
  ita:
    enabled: false
  kiss:
    enabled: false
  kiss-eck:
    enabled: false
  eck-operator:
    enabled: false
  omc:
    enabled: false
  clamav:
    enabled: false
  openinwoner:
    enabled: false
  referentielijsten:
    enabled: false
  openbeheer:
    enabled: false
  zaakbrug:
    enabled: false

  # --- zac (always on - the app itself) ---
  zac:
    enabled: true
    replicaCount: 1
    # Digest-qualified image references (zac itself, curlImage, opa,
    # office_converter) fail to pull in-cluster - see
    # scripts/strip-image-digests.py's own docstring for why, and why that's
    # a post-renderer now instead of hardcoded image.tag overrides here (an
    # earlier version of this fix hardcoded specific tags, which would
    # silently go stale the moment scripts/set-podiumd-version.sh selects a
    # podiumd release whose bundled charts default to different versions).
    # nginx.enabled: true is podiumd's own override, production-specific -
    # the underlying zac chart's own default is actually false, matching
    # compose's single-container architecture (WildFly serves everything,
    # no separate nginx frontend). Disabling this restores that parity and
    # avoids the digest-matching issue for this image entirely.
    nginx:
      enabled: false
    autoscaling:
      enabled: false
    javaOptions: "-Xms512m -Xmx1024m -XX:ActiveProcessorCount=2"
    contextUrl: http://zac.local
    db:
      host: postgres
      name: zac
      user: zac
      password: password
    auth:
      server: http://keycloak:8080
      realm: zaakafhandelcomponent
      clientId: zaakafhandelcomponent
      secret: keycloakZaakafhandelcomponentClientSecret
      sslRequired: none
      # Verified against the actual zac chart version bundled inside podiumd
      # 4.8.1 (1.0.251, older than this repo's current charts/zac): its
      # config.yaml template has no AUTH_ENABLE_PKCE line at all - this
      # setting is a silent no-op on the currently-pinned podiumd version.
      # Left set anyway since it's harmless and matches compose's own intent;
      # takes effect automatically if a newer podiumd version bundles a zac
      # chart that supports it.
      #
      # Found live in step 4: this being a no-op is NOT harmless as assumed -
      # the vendored realm's "zaakafhandelcomponent" client requires PKCE
      # (pkce.code.challenge.method: S256, added upstream alongside PR #6490,
      # unreleased in any ZAC image tag yet), so with PKCE support actually
      # absent from this pinned image, Keycloak rejected every single login
      # with "invalid_request: Missing parameter: code_challenge_method".
      # Fixed on the Keycloak side instead - see
      # vendor/dimpact-zaakafhandelcomponent/NOTES.md's PKCE note for the
      # realm patch and revert-when-upgrading instructions.
      enablePkce: true
    keycloak:
      adminClient:
        id: zaakafhandelcomponent-admin-client
        secret: zaakafhandelcomponentAdminClientSecret
    gemeente:
      code: "9999"
      naam: FakeZacGemeente
      mail: gemeente-zac-test@example.com
    organizations:
      verantwoordelijke:
        rsin: "316245124"
      bron:
        rsin: "123443210"
    mail:
      smtp:
        # Was a fake placeholder Mailjet hostname that nothing ever
        # actually pointed at - repointed at mailpit (see
        # templates/mailpit/), matching every other app's own email
        # settings. Chart docs confirm username/password are optional -
        # mailpit accepts unauthenticated SMTP, same as every other app.
        server: mailpit
        port: "1025"
        username: ""
        password: ""
    zgwApis:
      url: http://openzaak/
      clientId: zac_client
      secret: openzaakZaakafhandelcomponentClientSecret
    notificationsSecretKey: openNotificatiesApiSecretKey
    klantinteractiesApi:
      url: http://openklant
      token: fakeToken
    objectenApi:
      url: http://objecten
      token: fakeZacObjectsToken
    brpApi:
      url: http://wiremock:8080/haalcentraal/api/brp
      logLevel: INFO
      apiKey:
        # Compose defaults both BRP_API_KEY and BRP_API_KEY_HEADER to empty
        # (docker-compose.yaml lines 797-798) - ZAC's own BrpConfiguration
        # validation rejects a header set without a matching key, so these
        # must stay in lockstep, empty together.
        value: ""
        header: ""
      protocollering:
        enabled: true
        doelbinding:
          perZaaktype: true
          zoekmet: BRPACT-Totaal
          raadpleegmet: BRPACT-Totaal
          header: x-doelbinding
        originOin:
          oin: "123443210"
          header: x-origin-oin
        verwerking:
          register: Algemeen
          header: x-verwerking
        toepassing:
          value: ZAC
          header: x-toepassing
        gebruiker:
          header: x-gebruiker
        systemUser: ZacSystemUser
    kvkApi:
      url: fakeKvkApiUrl
      apiKey: fakeKvkApiKey
    bagApi:
      url: https://api.bag.kadaster.nl/lvbag/individuelebevragingen/v2/
      apiKey: fakeBagApiKey
    openForms:
      url: http://localhost:9999 # not used at the moment, matches compose's own placeholder
    pabcApi:
      url: http://pabc
      # Left empty, this is read by PabcClientHeadersFactory's companion
      # object via MicroProfile Config at class-init time - a missing value
      # throws NoSuchElementException there, which Java then caches forever
      # as "Could not initialize class ...PabcClientHeadersFactory" on every
      # later use (found live via the PabcReadinessHealthCheck). Matches
      # podiumd.pabc.settings.apiKeys (below) and compose's own
      # .env.example default.
      apiKey: zac-test-api-key
    zacInternalEndpointsApiKey: fakeZacInternalEndpointsApiKey
    smartDocuments:
      enabled: false
    signaleringen:
      deleteOlderThanDays: "14"
    solr:
      url: http://solr:8983
      # Verified live: createZacCore's initContainer uses the SolrCloud-only
      # Collections API (/solr/admin/collections), which fails against our
      # plain standalone Solr (no SolrCloud/Zookeeper). Our own Solr
      # Deployment runs "solr-precreate zac" at startup instead, matching
      # compose exactly - the core already exists by the time anything
      # needs it, without needing this initContainer at all.
      createZacCore: false
    solr-operator:
      enabled: false # podiumd's own override defaults this to true (unlike charts/zac's own quiet false default) - we use a plain Solr Deployment instead, see templates/solr.yaml
    # Correcting an earlier wrong assumption here, found live while
    # verifying monitoring-logging actually receives ZAC's traces: the
    # bundled zac chart (1.0.251) does NOT hardcode OTEL_SDK_DISABLED/
    # OTEL_EXPORTER_OTLP_ENDPOINT unconditionally - its own
    # templates/config.yaml only renders either env var at all inside
    # `{{- if index .Values "opentelemetry-collector" "enabled" }}`. With
    # this false (as it was), ZAC's OTel SDK was silently disabled the
    # entire time, regardless of metrics.enabled/monitoringLogging.enabled
    # or the endpoint override below - confirmed live: zero OTEL_* keys in
    # the rendered zac ConfigMap either way.
    #
    # Set true to unlock those two env vars - this is also the exact same
    # key Chart.yaml's own `condition:` uses to decide whether to deploy
    # the zac chart's *separate*, unrelated bundled otel-collector subchart
    # (not the one in templates/metrics/ or monitoring-logging's own, which
    # are what we actually want ZAC's traces to go to).
    #
    # fullnameOverride: without it, this subchart's default fullname
    # (release name + chart name, both literally "opentelemetry-collector")
    # collides exactly with monitoring-logging's own otel-collector
    # Deployment name. This project applies via `kubectl apply`, not `helm
    # install`/`upgrade` (see deploy.sh's own header for why), so same-name
    # resources don't merge by release the way a real Helm release would -
    # whichever one renders last in the manifest stream simply overwrites
    # the other's live spec. Confirmed live: without this override, zac's
    # own copy rendered after monitoring-logging's real one and would have
    # silently replaced it, breaking the whole Loki/Tempo/Grafana pipeline
    # it feeds.
    #
    # This subchart's own resources (Deployment/Service/ConfigMap/
    # ServiceAccount) are dropped from the manifest entirely before
    # `kubectl apply` ever sees them - see deploy.sh's render() pipeline
    # and scripts/lib/exclude-zac-bundled-otel-collector.py's own header
    # for why (short version: `replicaCount: 0` looked like the obvious
    # way to stop it running, but isn't - confirmed live in this chart's
    # own deployment.yaml, an omitted `replicas:` field defaults back to
    # Kubernetes' own default of 1, not 0). fullnameOverride here is what
    # that filter targets by name.
    opentelemetry-collector:
      enabled: true
      fullnameOverride: zac-unused-otel-collector
    # Pointed at our own templates/metrics/ otel-collector Service instead
    # of the bundled (now zero-replica) one above (step 5). When
    # metrics.enabled is false this Service doesn't exist either, so ZAC's
    # JVM just harmlessly retries failed trace exports in the background
    # (noisy log warnings, no functional impact) - same previously-accepted
    # behavior, now also the actually-working case once metrics is on.
    #
    # When monitoringLogging.enabled is true instead, this raw Service
    # doesn't exist (see templates/metrics/'s own supersession comment) -
    # the monitoring-logging dependency's own otel-collector Service is
    # named "podiumd-minikube-opentelemetry-collector" (confirmed live via
    # `helm template` against that exact chart version), not "otel-
    # collector". Values.yaml can't express "pick one endpoint or the
    # other" itself (not templated) - scripts/deploy.sh reads
    # monitoringLogging.enabled itself and passes
    # `--set podiumd.zac.opentelemetry_zaakafhandelcomponent.endpoint=...`
    # to override this default automatically when it's on.
    opentelemetry_zaakafhandelcomponent:
      endpoint: http://otel-collector:4317
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: zac.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openzaak (always on - core) ---
  openzaak:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
    # The bundled chart's own default (1.27.3) is older than the version
    # docker-compose.yaml pins (1.29.1) - our vendored fixture SQL does raw
    # INSERTs against this app's own tables, written against schema as of
    # 1.29.1, so the version matters for compatibility, not just parity.
    # openklant's bundled default (2.15.0) already matches compose exactly -
    # no override needed there.
    image:
      tag: "1.29.1"
    flower:
      enabled: false
    worker:
      replicaCount: 0 # compose only runs openzaak-celery under the opennotificaties/openformulieren profiles
    beat:
      replicaCount: 0 # compose never runs a separate openzaak beat/scheduler service at all
    # nginx.replicaCount left at its chart default (1) - compose runs
    # openzaak-nginx unconditionally (chunked transfer-encoding handling).
    # Its digest-qualified default image tag is handled by
    # scripts/strip-image-digests.py now, not a hardcoded override here.
    tags:
      redis: false # point at the shared Redis instead of the chart's bundled one
    create_required_catalogi_job:
      enabled: false # defaults to true with literal placeholder credentials (<openzaak_client_id>/<openzaak_secret>) that would just fail repeatedly, and would try to create its own test zaaktype/catalog - our vendored SQL fixtures already seed this exact data, matching compose
    configuration:
      job:
        # Verified live: with no configuration.data set (matching compose,
        # which doesn't use django-setup-configuration for openzaak at all),
        # this Job's own management command exits with "CommandError: No
        # steps enabled, aborting." - disabling it entirely rather than
        # leaving a permanently-failing Job around.
        enabled: false
      # Matches docker-compose.yaml's DJANGO_SUPERUSER_PASSWORD/
      # OPENZAAK_SUPERUSER_USERNAME/OPENZAAK_SUPERUSER_EMAIL exactly. Found
      # live: left unset, the container never creates the 'admin' user our
      # vendored fixture-seeding script polls for
      # (`select count(id) from accounts_user where username = 'admin'`),
      # so the seed script waited forever and the ZGW API fixtures (zac's
      # own client credentials) never got applied - causing ZAC's boot-time
      # calls to Open Zaak to fail with a 403 invalid-client-identifier.
      superuser:
        username: admin
        password: admin
        email: noreply@example.com
    settings:
      # Matches docker-compose.yaml's openzaak.local value exactly. Found
      # live: left unset, Django refuses every request with
      # "ImproperlyConfigured: The SECRET_KEY setting must not be empty" -
      # same class of gap as openklant's secretKey fix above, just missed
      # for openzaak specifically in the initial pass.
      secretKey: openZaakSecretKey
      # Default ALLOWED_HOSTS only covers the chart's own in-cluster
      # fullname/namespace-qualified name (which already covers ZAC's
      # backend calls via the "openzaak" Service DNS name) - found live:
      # browsing via the Traefik Ingress hostname got Django's own
      # DisallowedHost 400 error page, since "openzaak.local" was never in
      # that list.
      allowedHosts: openzaak.local
      # Chart default (true) makes session/CSRF cookies Secure-only -
      # confirmed live, the browser silently drops both over our plain
      # http://openzaak.local ingress, failing django-admin login with a
      # CSRF error before a single credential is even checked. No compose
      # equivalent to match (compose never exposes openzaak's admin login
      # through a browser at all) - purely for local admin access.
      isHttps: false
      # Confirmed live: DISABLE_2FA is only read by openzaak.conf.dev/.ci,
      # neither part of the conf.docker->production->includes.base chain
      # this container actually uses, so settings.disable2fa is a dead
      # values.yaml field for this chart - without this override, a fresh
      # superuser with no registered device hits a real "Tweestapsauthenticatie
      # instellen" (set up two-step auth) wall instead of reaching the
      # admin. See the vendored docker_no2fa.py's own header for why
      # DJANGO_SETTINGS_MODULE=openzaak.conf.dev isn't an option either
      # (pulls in django-debug-toolbar, not installed in this production
      # image) - same fix already used for openarchiefbeheer.
      djangoSettingsModule: openzaak.conf.docker_no2fa
      # Chart default is "localhost:25" - a compose-only value that's just
      # a no-op inside this pod in Kubernetes. Pointed at mailpit (see
      # templates/mailpit/) instead, matching compose's own openzaak-mail
      # relay role - no auth needed, mailpit accepts unauthenticated SMTP.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        username: openzaak
        password: openzaak
        name: openzaak
      cache:
        default: redis:6379/0
        axes: redis:6379/0
      celery:
        brokerUrl: redis://redis:6379/1
        resultBackend: redis://redis:6379/1
    # Compose's openzaak.local service copies a vendored test PDF into
    # /app/private-media/uploads/2023/{10,11,12}/ before starting (see
    # copy-test-pdf-and-start-openzaak.sh, referenced by the
    # 07-setup-zac-config-after.sql fixture). This chart has no
    # initContainers/extraInitContainers support at all (checked its
    # deployment.yaml directly), but extraVolumes/extraVolumeMounts do exist
    # and are tpl-rendered - mounting the same ConfigMap-backed file via
    # subPath at all three target paths achieves the same result without
    # needing an initContainer.
    extraVolumes:
      - name: fake-test-document
        configMap:
          name: openzaak-fake-test-document
      - name: no2fa-settings
        configMap:
          name: openzaak-no2fa-settings
    extraVolumeMounts:
      - name: fake-test-document
        mountPath: /app/private-media/uploads/2023/10/fake-test-document.pdf
        subPath: fake-test-document.pdf
      - name: fake-test-document
        mountPath: /app/private-media/uploads/2023/11/fake-test-document.pdf
        subPath: fake-test-document.pdf
      - name: fake-test-document
        mountPath: /app/private-media/uploads/2023/12/fake-test-document.pdf
        subPath: fake-test-document.pdf
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openzaak/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: openzaak.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openklant (always on - core) ---
  openklant:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
    configuration:
      job:
        enabled: false # same "No steps enabled, aborting" issue as openzaak - see its own comment above
    flower:
      enabled: false
    worker:
      replicaCount: 0 # compose runs openklant as a single bare container, no celery worker at all
    # nginx.replicaCount left at its chart default (1), even though compose
    # runs openklant without one: verified directly that this chart's own
    # Ingress template hardwires its backend to the "<fullname>-nginx"
    # Service specifically (not configurable to point elsewhere), so
    # scaling nginx to 0 would make openklant.local completely unreachable.
    # Its digest-qualified default image tag is handled by
    # scripts/strip-image-digests.py now, not a hardcoded override here.
    tags:
      redis: false
    settings:
      # See openzaak's own allowedHosts comment above - same gap, same fix.
      allowedHosts: openklant.local
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        username: openklant
        password: openklant
        name: openklant
      # Matches docker-compose.yaml's openklant.local value exactly (yes,
      # it really does reuse openzaak's own secret key literally - a
      # copy-paste artifact in compose itself, not something we introduced).
      secretKey: openZaakSecretKey
      cache:
        default: redis:6379/0
        axes: redis:6379/0
      celery:
        brokerUrl: redis://redis:6379/2
        # Set both: this chart's own configmap.yaml has a typo reading
        # "resultBackendl" (not "resultBackend") - found live while fixing
        # the same bug on openarchiefbeheer's chart (see that comment).
        # Currently a no-op in practice since openklant's own celery
        # worker is disabled (worker.replicaCount: 0 below) and nothing
        # reads this value, but fixed for correctness/future-proofing.
        resultBackend: redis://redis:6379/2
        resultBackendl: redis://redis:6379/2
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: openklant.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- pabc (always on - core) ---
  pabc:
    enabled: true
    replicaCount: 1
    postgresql:
      enabled: false # point at the shared Postgres instead of the chart's bundled bitnami one
    # podiumd's own override remaps all three pabc images to a private Azure
    # Container Registry (acrprodmgmt.azurecr.io) with an IP allowlist -
    # confirmed via a direct pull attempt that it actively denies external
    # IPs. Overridden back to the pabc chart's own upstream defaults
    # (verified these pull successfully): the true public ghcr.io addresses.
    # Only overriding `repository`, deliberately not `tag` - podiumd's own
    # values.yaml already pins a specific tag for the ACR-hosted image
    # (currently "1.1.0", verified matching), and leaving that field alone
    # means we keep tracking whatever tag the currently-selected podiumd
    # version pins, instead of a second, independent hardcoded value here
    # that could silently drift from it after a
    # scripts/set-podiumd-version.sh swap.
    image:
      repository: ghcr.io/platform-autorisatie-beheer-component/pabc-api
    migrations:
      image:
        repository: ghcr.io/platform-autorisatie-beheer-component/pabc-migrations
      # Matches docker-compose.yaml's pabc-migrations JSON_DATASET_PATH
      # mount exactly. Found live: without this, PABC's own database has no
      # application/role/group mapping data at all, so ZAC's own
      # authorization check rejects every logged-in user with "Geen
      # toestemming" (403) regardless of their Keycloak group membership -
      # PABC, not Keycloak roles directly, is the actual source of truth
      # ZAC's authorization now queries.
      dataSetPath: /app/json/pabc-mapping-data.json
      extraVolumes:
        - name: pabc-mapping-data
          configMap:
            name: pabc-mapping-data
      extraVolumeMounts:
        - name: pabc-mapping-data
          subPath: pabc-mapping-data.json
          mountPath: /app/json/pabc-mapping-data.json
          readOnly: true
    initContainers:
      waitFor:
        # Same reasoning as pabc's own image override above - repository
        # only, tag left to track whatever podiumd's own value currently is.
        image:
          repository: ghcr.io/groundnuty/k8s-wait-for
    settings:
      database:
        host: postgres
        port: 5432
        username: pabc
        password: pabc
        name: Pabc
      apiKeys:
        - zac-test-api-key
      oidc:
        authority: http://keycloak:8080/realms/zaakafhandelcomponent/
        clientId: pabc
        clientSecret: pabcClientSecret
        functioneelBeheerderRole: administrator
        requireHttps: false # defaults to true - would reject our HTTP-only Keycloak's tokens entirely; matches compose's own Oidc__RequireHttps: "false"
      keycloakAdmin:
        clientId: pabc-admin-client
        clientSecret: pabcAdminClientSecret
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: pabc.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- brp-personen-mock (always on - core) ---
  brppersonenmock:
    enabled: true
    # No fullnameOverride/ingress overrides needed - this chart already
    # ships nameOverride: "brp-personen-mock" by default (verified via
    # `helm show values dimpact/brp-personen-mock`), matching the vendored
    # brp-personen-wiremock mapping's hardcoded proxyBaseUrl unchanged. Not
    # exposed via Ingress - compose reaches it only in-cluster, through the
    # wiremock proxy.

  # --- Profile-gated apps (build order step 5). Each one's `enabled` flag
  # here is the one that actually controls whether podiumd renders it (its
  # own Chart.yaml `condition:` on the nested dependency) - the top-level
  # flags at the very top of this file (objecten.enabled, etc.) are this
  # chart's own compose-profile-equivalent flags, used by our own templates
  # (storage-hooks.yaml, the postgres seed script guard, the metrics/wiremock
  # raw templates below). Turning a profile on means flipping BOTH: the
  # top-level flag and this podiumd.<app>.enabled flag. Left disabled here,
  # matching compose's own opt-in-by-profile default. ---

  # --- objecten (+ objecttypen, its always-on dependency once either
  # profile is on) ---
  objecten:
    enabled: false
    replicaCount: 1
    # Found live: chart default (3.6.0) differs from compose's pinned
    # version (3.6.1) - matches the fixture/API shape our vendored SQL
    # expects. No digest suffix (unlike some other apps here) so no
    # separate digest-stripping fix is needed for this one.
    image:
      tag: "3.6.1"
    worker:
      # Compose runs objecten-api-celery as a real worker - unlike
      # openzaak/openklant's workers (which compose never runs at all), this
      # one stays on, just scaled down from the chart's default of 2.
      replicaCount: 1
    flower:
      enabled: false # not run in compose; chart default is true
    tags:
      redis: false
    configuration:
      job:
        # No configuration.data set (matching compose, which seeds fixture
        # data through a separate one-shot "objecten-api-import" container
        # running the image's own init.sh - not replicated here; see
        # plan.md's step 5 notes on scope).
        enabled: false
    settings:
      secretKey: objectenApiSecretKey
      allowedHosts: objecten.local
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        # Compose's objecten-api-database container's actual Postgres
        # user/db is literally named "objects", not "objecten" - copied
        # as-is, matching 00-create-databases.sql.
        username: objects
        password: objects
        name: objects
      cache:
        default: redis:6379/0
        axes: redis:6379/0
        # Compose never sets an OIDC-cache env var for objecten either -
        # see opennotificaties's identical CACHE_OIDC comment above (same
        # unconditional-render leak, same fix).
        oidc: redis:6379/0
      celery:
        brokerUrl: redis://redis:6379/1
        # Set both: see openklant/openarchiefbeheer's identical comment -
        # this chart's own configmap.yaml has the same "resultBackendl" typo.
        resultBackend: redis://redis:6379/1
        resultBackendl: redis://redis:6379/1
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: objecten.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: objecten
      storageClassName: ""
      size: 10Gi

  objecttypen:
    enabled: false
    replicaCount: 1
    # Version (3.4.2) already matches compose; its digest-qualified chart
    # default is handled by scripts/strip-image-digests.py now, not a
    # hardcoded override here.
    # No worker/beat/flower/redis blocks exist on this chart at all - it's
    # a stateless API with no celery use.
    configuration:
      job:
        enabled: false # same fixture-import scope note as objecten above
      # No compose equivalent to match (objecttypen isn't part of
      # dimpact-zaakafhandelcomponent's docker-compose stack at all - see
      # this block's own top comment). Same admin/admin/admin@example.com
      # convention as opennotificaties's superuser block below purely for
      # local django-admin access; wired the same way (Deployment's
      # envFrom already pulls in this Secret/ConfigMap regardless of the
      # job.enabled=false above, so this alone is enough - confirmed
      # against objecttypen's own templates/{secret,configmap,deployment}.yaml).
      superuser:
        username: admin
        password: admin
        email: admin@example.com
    # podiumd's own umbrella override enables create_required_objecttypen_job
    # by default with placeholder credentials - same class of problem as
    # openzaak's create_required_catalogi_job (see that override's comment
    # above): would fail repeatedly against our vendored fixture data
    # instead of its own.
    create_required_objecttypen_job:
      enabled: false
    # No dedicated values.yaml field for IS_HTTPS on this chart (unlike
    # openarchiefbeheer's settings.cookie.*), so set via extraEnvVars -
    # confirmed live: without this, SESSION_COOKIE_SECURE/CSRF_COOKIE_SECURE
    # default true, and the browser silently drops both cookies over our
    # plain http://objecttypen.local ingress, failing django-admin login
    # with "CSRF verification failed" before a single credential is checked.
    extraEnvVars:
      - name: IS_HTTPS
        value: "False"
    # See settings.djangoSettingsModule below for why this mount exists -
    # same ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # for openzaak's/opennotificaties'/openarchiefbeheer's own
    # docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: objecttypen-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/objecttypes/conf/docker_no2fa.py
        readOnly: true
    settings:
      secretKey: objecttypesApiSecretKey
      allowedHosts: objecttypen.local
      # Confirmed live (the hard way - an earlier version of this comment
      # claimed objecttypen never enforces 2FA at all, based on a manual
      # test that turned out to be invalid: `kubectl set env ... KEY-` only
      # removes an explicit env: entry, it can't suppress a value still
      # coming from this ConfigMap via envFrom, so that "proof" was
      # actually still running with DISABLE_2FA=True the whole time). A
      # real values.yaml-driven redeploy with the key genuinely absent
      # does hit a "Set up MFA" wall for a fresh superuser with no
      # registered device - DISABLE_2FA is only read by objecttypes'
      # own conf.dev, not the conf.docker->production chain this container
      # actually uses. Same docker_no2fa.py shim as
      # openzaak/opennotificaties/openforms below (see
      # settings.djangoSettingsModule).
      djangoSettingsModule: objecttypes.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        username: objecttypes
        password: objecttypes
        name: objecttypes
      cache:
        default: redis:6379/0
        axes: redis:6379/0
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: objecttypen.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- opennotificaties ---
  opennotificaties:
    enabled: false
    replicaCount: 1
    # Found live: chart default (1.16.0) differs from compose's pinned
    # version (1.15.0).
    image:
      tag: "1.15.0"
    worker:
      replicaCount: 1 # compose runs opennotificaties-celery as a real worker
    beat:
      replicaCount: 0 # compose has no opennotificaties beat container
    flower:
      enabled: false # already the chart default; explicit for clarity
    tags:
      redis: false
    configuration:
      job:
        enabled: false # see plan.md step 5 scope note - opennotificaties-init's setup-configuration data isn't replicated here
      superuser:
        # Matches compose's OPENNOTIFICATIES_SUPERUSER_USERNAME/_EMAIL and
        # DJANGO_SUPERUSER_PASSWORD exactly.
        username: admin
        password: admin
        email: admin@example.com
    settings:
      secretKey: opennotificatiesApiSecretKey
      allowedHosts: opennotificaties.local
      # See openzaak's own isHttps comment above - same chart-default
      # (Secure-only cookies dropped by the browser over plain http://,
      # confirmed live), same fix.
      isHttps: false
      # See openzaak's own djangoSettingsModule comment above - same
      # DISABLE_2FA-only-lives-in-conf.dev gap, confirmed live against the
      # same "Tweestapsauthenticatie instellen" wall (opennotificaties'
      # actual Django project package is "nrc", not "opennotificaties" -
      # confirmed against the running pod's own /app/src/nrc/conf/ layout).
      djangoSettingsModule: nrc.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        username: opennotificaties
        password: opennotificaties
        name: opennotificaties
      cache:
        default: redis:6379/0
        axes: redis:6379/0
        # Compose never sets an OIDC-cache env var for opennotificaties, but
        # this chart's configmap.yaml always renders CACHE_OIDC
        # unconditionally (no matching {{- if }} guard) - left unset, it
        # fell through to podiumd's own untouched production default
        # (redis-ha-master...). Pointed at the shared Redis instead of
        # leaving that leak in place.
        oidc: redis:6379/0
      celery:
        # Compose points this at rabbitmq, not redis - the only one of
        # these apps that does.
        brokerUrl: amqp://guest:guest@rabbitmq:5672//
        # PUBLISH_BROKER_URL has its own dedicated field (confirmed live
        # against secret.yaml) - matches compose's own value exactly.
        publishBrokerUrl: amqp://guest:guest@rabbitmq:5672/%2F
        # CELERY_RESULT_BACKEND is defined TWICE on this chart: once here
        # (feeding configmap.yaml's tags.redis-false branch) and once via
        # settings.messageBroker.celeryResultBackend below (feeding
        # secret.yaml). Found live: both the ConfigMap and Secret set the
        # same env var name via envFrom, and Kubernetes resolves that by
        # whichever source is listed last in the container's envFrom list
        # winning - rather than depend on that ordering, both are set here
        # to the same value so it's correct either way. Leaving only one
        # set left the other object rendering podiumd's own untouched
        # production default (redis-ha-master...) instead of ours.
        resultBackend: redis://redis:6379/1
      messageBroker:
        celeryResultBackend: redis://redis:6379/1
    # Found live: this comment used to claim RABBITMQ_HOST/RABBITMQ_PORT
    # weren't needed since CELERY_BROKER_URL/PUBLISH_BROKER_URL already
    # carry the full connection string - true for the Django app itself,
    # but wrong for the *worker* container specifically: its image bundles
    # its own /wait_for_rabbitmq.sh entrypoint script, run before the
    # celery process ever starts, which reads these two vars completely
    # separately (`rabbit_host=${RABBITMQ_HOST:-localhost}`,
    # `rabbit_port=${RABBITMQ_PORT:-5672}`) and defaults to localhost
    # without them - meaning the worker never actually started at all,
    # stuck retrying forever (only visible as a recurring liveness-probe
    # kill/restart cycle, not an obvious crash). No dedicated values.yaml
    # field exists for either on this chart, so set via extraEnvVars.
    extraEnvVars:
      - name: RABBITMQ_HOST
        value: rabbitmq
      - name: RABBITMQ_PORT
        value: "5672"
    # See settings.djangoSettingsModule above for why this mount exists -
    # same ConfigMap+extraVolumes+extraVolumeMounts pattern already used
    # for openzaak's/openarchiefbeheer's own docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: opennotificaties-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/nrc/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: opennotificaties.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: opennotificaties
      storageClassName: ""
      size: 10Gi

  # --- openarchiefbeheer ---
  openarchiefbeheer:
    enabled: false
    # replicaCount/worker/beat/nginx/flower all already default to 1 - no
    # override needed (confirmed live against the chart: unlike the other
    # Maykin-family apps, this one's chart defaults already match compose's
    # single-instance topology exactly, including running celery/beat/flower
    # since compose really does run all of those as separate containers).
    # Versions (image 2.0.0, nginx 1.31.1) already match compose; their
    # digest-qualified chart defaults are handled by
    # scripts/strip-image-digests.py now, not hardcoded overrides here.
    tags:
      redis: false
    configuration:
      job:
        enabled: true # compose's openarchiefbeheer-web-init runs the equivalent setup-configuration step for real, unlike the other apps' fixture-import containers - replicated here via configuration.data below
      # Matches compose's vendored data.yaml (ZGW consumer services
      # pointing at ZAC's own openzaak client credentials), with API roots
      # repointed from openzaak.local:8000 to the in-cluster Service
      # address - see
      # vendor/dimpact-zaakafhandelcomponent/openarchiefbeheer/NOTES entry.
      # oidc_db_config_enable stays false, matching the vendored file - this
      # app's OIDC admin login isn't configured/needed for the admin login
      # form compose actually exercises (see settings.djangoSettingsModule
      # override below for how that login form is reached instead).
      data: |-
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
          - identifier: zaken-test
            label: Open Zaak - Zaken API
            api_root: http://openzaak/zaken/api/v1/
            api_type: zrc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: documenten-test
            label: Open Zaak - Documenten API
            api_root: http://openzaak/documenten/api/v1/
            api_type: drc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: catalogi-test
            label: Open Zaak - Catalogi API
            api_root: http://openzaak/catalogi/api/v1/
            api_type: ztc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: besluiten-test
            label: Open Zaak - Besluiten API
            api_root: http://openzaak/besluiten/api/v1/
            api_type: brc
            auth_type: zgw
            client_id: zac_client
            secret: openzaakZaakafhandelcomponentClientSecret
          - identifier: selectielijst
            label: Open Zaak (public) - Selectielijst API
            api_root: https://selectielijst.openzaak.nl/api/v1/
            api_type: orc
            auth_type: no_auth
        api_configuration_enabled: true
        api_configuration:
          selectielijst_service_identifier: selectielijst
        oidc_db_config_enable: false
    # Compose overrides DJANGO_SETTINGS_MODULE to a custom docker_no2fa
    # settings module (mounted from a vendored file) purely to disable
    # enforced two-factor auth on the admin login form - upstream only
    # reads DISABLE_2FA in a dev-only settings module that pulls in
    # django-debug-toolbar (not installed in this production image), so
    # that env var alone has no effect here. Replicated with the same
    # ConfigMap+extraVolumes+extraVolumeMounts pattern already used for
    # openzaak's fake-test-document.pdf.
    settings:
      djangoSettingsModule: openarchiefbeheer.conf.docker_no2fa
      secretKey: oabSecretKey
      # Both hostnames from the compose parity table (plan.md) need to be
      # here: this chart has only ONE native Ingress, and it routes
      # exclusively to the nginx sidecar, which itself proxies
      # /admin|oidc|static|assets|api/ to the backend and serves the SPA
      # for everything else - so both "hostnames" really are the same
      # nginx, just two Host-header entry points. Also feeds nginx's own
      # server_name directive (same mechanism as our raw templates).
      allowedHosts: openarchiefbeheer-web.local,openarchiefbeheer-ui.local
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        username: openarchiefbeheer
        password: openarchiefbeheer
        name: openarchiefbeheer
      # Plain HTTP ingress (no TLS) - the chart's own secure-cookie
      # defaults (true) would make the browser silently refuse to send
      # session/CSRF cookies back at all over our http:// hostnames.
      cookie:
        sessionCookieSecure: false
        csrfCookieSecure: false
      cors:
        allowedOrigins: http://openarchiefbeheer-ui.local,http://openarchiefbeheer-web.local
      csrf:
        trustedOrigins: http://openarchiefbeheer-ui.local,http://openarchiefbeheer-web.local
      cache:
        default: redis:6379/0
        axes: redis:6379/0
        choices: redis:6379/0
      celery:
        brokerUrl: redis://redis:6379/0
        # Set both: this chart's own configmap.yaml has a typo reading
        # "resultBackendl" (not "resultBackend", which is what values.yaml
        # itself declares) - found live, confirmed directly against the
        # template. Setting only the correctly-spelled key would silently
        # leave CELERY_RESULT_BACKEND empty.
        resultBackend: redis://redis:6379/0
        resultBackendl: redis://redis:6379/0
      frontend:
        apiUrl: http://openarchiefbeheer-web.local
        apiPath: /api/v1
        zaakUrlTemplate: "https://zac.local/zaken/{identificatie}"
      frontendUrl: http://openarchiefbeheer-ui.local
      requestsReadTimeout: "5000"
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openarchiefbeheer-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openarchiefbeheer/conf/docker_no2fa.py
        readOnly: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: openarchiefbeheer-web.local
          paths:
            - path: /
              pathType: ImplementationSpecific
        - host: openarchiefbeheer-ui.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: openarchiefbeheer
      storageClassName: ""
      size: 10Gi

  # --- openformulieren (aliased from the openforms chart) ---
  openformulieren:
    enabled: false
    # also pulls in objecten + objecttypen + opennotificaties (compose's
    # own "openformulieren" profile transitively enables all three - see
    # top-level openformulieren.enabled's comment).
    replicaCount: 1
    # Found live: chart default (3.4.9) differs from compose's pinned
    # version (3.5.4) - a genuine version pin, unlike nginx's own
    # digest-qualified default just below, which is handled by
    # scripts/strip-image-digests.py instead of a hardcoded tag here.
    image:
      tag: "3.5.4"
    nginx:
      replicaCount: 1 # compose runs openformulieren-nginx
    worker:
      replicaCount: 1 # compose runs openformulieren-celery
    beat:
      replicaCount: 1 # compose runs openformulieren-celery-beat, unlike opennotificaties
    flower:
      enabled: false # chart default is true; not run in compose
    tags:
      redis: false
    configuration:
      job:
        enabled: false # see plan.md step 5 scope note - openformulieren-init's demo-data seeding (BRP service link, klantinteracties API group, importing the test form) isn't replicated here
      # Unlike objecttypen/openzaak/opennotificaties, this chart never
      # wires configuration.superuser to an actual user-creation mechanism
      # (confirmed live: grepped every template in the vendored chart for
      # "superuser" - zero hits outside a commented-out
      # django-setup-configuration example) - these values are consumed by
      # templates/openformulieren/create-superuser-job.yaml instead, a
      # custom Job added for exactly this gap. See that Job's own header
      # comment.
      superuser:
        username: admin
        password: admin
        email: admin@example.com
    # See settings.djangoSettingsModule below for why the no2fa-settings
    # mount exists - same ConfigMap+extraVolumes+extraVolumeMounts pattern
    # already used for openzaak's/opennotificaties's/openarchiefbeheer's
    # own docker_no2fa.py fix.
    extraVolumes:
      - name: no2fa-settings
        configMap:
          name: openformulieren-no2fa-settings
    extraVolumeMounts:
      - name: no2fa-settings
        subPath: docker_no2fa.py
        mountPath: /app/src/openforms/conf/docker_no2fa.py
        readOnly: true
    settings:
      secretKey: openFormulierenSecretKey
      allowedHosts: openformulieren-nginx.local,openformulieren-web.local
      # Chart default (true) makes session/CSRF cookies Secure-only -
      # confirmed live, the browser silently drops both over our plain
      # http://openformulieren-nginx.local ingress, failing django-admin
      # login with a CSRF error before a single credential is even
      # checked. Unlike openzaak/opennotificaties/objecttypen, this chart
      # does expose a dedicated field for it (no extraEnvVars needed).
      isHttps: false
      # Confirmed live: DISABLE_2FA is only read by openforms.conf.dev,
      # not the conf.docker->production->base chain this container
      # actually uses, so there's no settings.disable2fa-equivalent field
      # on this chart at all - without this override, a fresh superuser
      # with no registered device hits a real "Tweestapsauthenticatie
      # instellen" (set up two-step auth) wall instead of reaching the
      # admin. Same docker_no2fa.py shim as
      # openzaak/opennotificaties/objecttypen above.
      djangoSettingsModule: openforms.conf.docker_no2fa
      # See openzaak's own email comment above - same chart-default
      # "localhost:25" gap, same fix.
      email:
        host: mailpit
        port: 1025
        # podiumd's own default (true) is a production-relay assumption -
        # mailpit doesn't speak STARTTLS, so this must be off or mail
        # delivery fails.
        useTLS: false
      database:
        host: postgres
        port: 5432
        username: openformulieren
        password: openformulieren
        name: openformulieren
      cache:
        default: redis:6379/2
        axes: redis:6379/2
        portalLocker: redis:6379/2
      celery:
        brokerUrl: redis://redis:6379/2
        # Set both: see openklant/objecten/openarchiefbeheer's identical
        # comment - this chart's own configmap.yaml has the same
        # "resultBackendl" typo.
        resultBackend: redis://redis:6379/2
        resultBackendl: redis://redis:6379/2
      csrf:
        trustedOrigins:
          - http://openformulieren-nginx.local
          - http://openformulieren-web.local
      cors:
        allowAllOrigins: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: openformulieren-nginx.local
          paths:
            - path: /
              pathType: ImplementationSpecific
        - host: openformulieren-web.local
          paths:
            - path: /
              pathType: ImplementationSpecific
    persistence:
      existingClaim: openformulieren
      storageClassName: ""
      size: 10Gi

# -----------------------------------------------------------------------
# The monitoring-logging dependency and everything nested inside it -
# optional alternative to templates/metrics/'s raw templates, see
# monitoringLogging.enabled's own comment above. Re-tuned throughout for
# a single-node minikube box - see each override's own comment for the
# specific production assumption it replaces. Left everything else at
# this chart's own upstream defaults.
# -----------------------------------------------------------------------
monitoring-logging:
  grafana:
    persistence:
      storageClassName: standard
      size: 2Gi
    # Chart default runs an initContainer that chowns the whole PVC to
    # grafana's own UID/GID on every pod start, but with only CAP_CHOWN (all
    # other capabilities explicitly dropped, including CAP_DAC_OVERRIDE) -
    # confirmed live: that's enough for a *fresh* volume (root:root, world-
    # readable), but grafana itself creates its csv/pdf/png export dirs 0700
    # at runtime after that first successful boot, and the same
    # capability-limited chown can no longer even traverse those on any
    # *later* restart ("Permission denied", pod stuck in Init:Error forever
    # - not something that self-heals; every subsequent restart hits it
    # again). fsGroup (already set at the pod level below via this chart's
    # own default) reliably applies group ownership on minikube's `standard`
    # StorageClass without needing this at all - confirmed live restarting
    # the pod cleanly with this disabled.
    initChownData:
      enabled: false
    # monitoring-logging's own bundled Prometheus datasource hardcodes its
    # URL as "{{ .Release.Name }}-kube-prometheus-prometheus" - doesn't
    # match what actually gets deployed: kube-prometheus-stack's own
    # fullname helper truncates to 26 characters unconditionally (even with
    # fullnameOverride set, so that can't fix this either), and
    # "podiumd-minikube-kube-prometheus-stack" is well over that, so the
    # real Service ends up "podiumd-minikube-kube-prom-prometheus" instead
    # (confirmed live - Grafana's own datasource health check failed with a
    # DNS lookup error against the hardcoded name). This whole list has to
    # be repeated here, not just the one url field - it's a YAML list, and
    # Helm value overrides replace lists wholly rather than merging them
    # (unlike maps). loki/Tempo's own URLs are copied verbatim from
    # monitoring-logging's own values.yaml (correct already - those two
    # charts aren't affected by kube-prometheus-stack's own truncation).
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            editable: true
            type: prometheus
            uid: prometheus
            readOnly: false
            url: http://podiumd-minikube-kube-prom-prometheus:9090
            access: proxy
            isDefault: false
          - name: loki
            type: loki
            uid: loki
            readOnly: false
            editable: true
            access: proxy
            isDefault: true
            url: http://podiumd-minikube-loki-gateway
            version: 1
            jsonData:
              timeout: 300
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "1"
          - name: Tempo
            type: tempo
            uid: tempo
            readOnly: false
            editable: true
            access: proxy
            isDefault: false
            url: http://podiumd-minikube-tempo:3200
            jsonData:
              tracesToLogsV2:
                datasourceUid: loki
                filterByTraceID: true
                filterBySpanID: false
              tracesToMetrics:
                datasourceUid: prometheus
              serviceMap:
                datasourceUid: prometheus
              nodeGraph:
                enabled: true
    grafana.ini:
      auth.generic_oauth:
        enabled: false # no Keycloak client wired up for this dev tool - anonymous admin access instead, matching templates/metrics/grafana.yaml's current GF_AUTH_ANONYMOUS_* behavior
      auth.anonymous:
        enabled: true
        org_role: Admin
      auth:
        disable_login_form: true
      server:
        domain: grafana.local
        enforce_domain: false # avoids a redirect loop if reached by IP or a different hostname
        root_url: http://grafana.local/
      security:
        cookie_secure: false # plain http://*.local, not https - same fix as openarchiefbeheer's identical cookie issue elsewhere in this file
      smtp:
        host: "mailpit:1025" # see templates/mailpit/ - every other app's email settings point here too
        from_address: noreply@example.com
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.local
      path: /
      pathType: ImplementationSpecific
  kube-prometheus-stack:
    # Confirmed live: this specific ServiceMonitor sets a field
    # (spec.endpoints[1].trackTimestampsStaleness) that the CRD schema
    # actually installed (from this same dependency's own bundled "crds"
    # subchart - see apply-monitoring-logging-crds.sh) doesn't recognize -
    # a version-skew bug inside monitoring-logging's own dependency tree,
    # not something introduced here. Rejected outright by the API server's
    # strict decoding ("unknown field"), so kubelet metrics would never
    # scrape anyway - disabling the ServiceMonitor is simpler than patching
    # around a schema mismatch for a scrape target minikube's own single-node
    # kubelet isn't the primary point of this profile regardless.
    kubelet:
      enabled: false
    # These five create a Service explicitly namespaced to "kube-system"
    # each (scraping the control-plane components that, on a "real" cluster,
    # run there) - confirmed live that conflicts outright with deploy.sh's
    # own single `kubectl apply -n podiumd-minikube -f -` covering the whole
    # manifest ("the namespace from the provided object 'kube-system' does
    # not match the namespace 'podiumd-minikube'"). Wouldn't usefully scrape
    # anything on minikube regardless - its control-plane runs as static
    # pods with no equivalent scrapeable Services of their own by default,
    # so disabling loses nothing actually working, unlike kubelet above
    # (that one's ServiceMonitor CRD-schema mismatch was the real blocker,
    # not a namespace conflict - it might otherwise have worked).
    coreDns:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 1d # dev box, not a 7-day production retention window
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 2Gi
        # Matches templates/metrics/prometheus.yaml's own scrape_configs
        # exactly - zac's WildFly management port (see
        # templates/metrics/service-zac-admin.yaml, unconditional on
        # which metrics implementation is active - both need it) and
        # Tempo's own metrics, neither of which this chart's default
        # ServiceMonitor discovery would pick up on their own.
        additionalScrapeConfigs:
          - job_name: zac-admin
            fallback_scrape_protocol: PrometheusText1.0.0
            static_configs:
              - targets: ["zac-admin:9990"]
          - job_name: tempo
            static_configs:
              - targets: ["podiumd-minikube-tempo:3200"]
  alloy:
    # monitoring-logging's own umbrella values.yaml (not the alloy chart's
    # own default, which is already {}) hardcodes an AKS-only node label
    # (kubernetes.azure.com/agentpool: userpool) on the alloy DaemonSet -
    # doesn't exist on minikube's single node, so the DaemonSet's desired
    # count stays 0 forever without it. NOT overridden here - confirmed live
    # that clearing an inherited map key this deep (root chart's own
    # values.yaml -> monitoring-logging's own values.yaml -> alloy's own
    # values.yaml) doesn't work on this project's pinned Helm v3.9.0 (see
    # provision-cluster.sh's own comment on why that version's pinned):
    # neither an empty map override (nodeSelector: {} - ordinary reason,
    # Helm's per-key map merge contributes nothing from an empty map) nor a
    # `null` on the exact key (works for a plain two-level override, but not
    # reliably at this subchart-of-a-subchart nesting depth on this Helm
    # version - confirmed --set *can* reach and overwrite the key's value,
    # just not delete it). Simplest reliable fix instead: make minikube's
    # node actually satisfy the selector - see provision-cluster.sh's own
    # `kubectl label node` step.
    #
    alloy:
      # monitoring-logging's own umbrella values.yaml hardcodes its entire
      # log-collection pipeline as one literal River-config string here
      # (not a separate structured "namespaces" values field - a
      # `logCollectionNamespaces` key, tried here first, doesn't exist
      # anywhere in this chart at all and was silently a no-op) - the
      # `namespaces { names = [...] }` block inside is a *server-side* API
      # watch filter (see its own comment), hardcoded to ["podiumd",
      # "monitoring"], neither of which matches this project's actual
      # namespace. Since it's a plain multi-line string value, the whole
      # block has to be copied and re-specified to change that one line -
      # otherwise identical to monitoring-logging's own default (including
      # the loki_gateway endpoint, still correctly templated via
      # {{ .Release.Name }} since configMap.content itself is tpl-processed).
      configMap:
        content: |
          // Discover only this project's own namespace's pods.
          // Server-side namespace filter: scopes the API watch, not just a relabel drop.
          discovery.kubernetes "pods" {
            role = "pod"

            namespaces {
              names = ["podiumd-minikube"]
            }
          }

          // Relabel: keep only pods on this node, drop terminated pods,
          // build the log path glob, add k8s metadata.
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Only tail files for pods scheduled on this node
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              regex         = env("NODE_NAME")
              action        = "keep"
            }

            // Drop pods in terminal phases
            rule {
              source_labels = ["__meta_kubernetes_pod_phase"]
              regex         = "Pending|Succeeded|Failed|Completed"
              action        = "drop"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            // Build the log path glob — *.log captures all container restarts
            // (0.log, 1.log, …). local.file_match below expands the glob into
            // real file paths; without it, loki.source.file would os.Stat the
            // literal "*.log" string and skip every target.
            // Use ${n} notation: $n_ would include the underscore in the capture group reference.
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              regex         = "(.+)/(.+)/(.+)/(.+)"
              replacement   = "/var/log/pods/${1}_${2}_${3}/${4}/*.log"
              target_label  = "__path__"
            }
          }

          // Resolve __path__ globs into concrete files (0.log, 1.log, …).
          // sync_period determines how often new rotated files are picked up.
          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
            sync_period  = "10s"
          }

          // Tail log files, strip CRI prefix (containerd format: timestamp stream flags log)
          // and forward to Loki. Equivalent to Promtail's pipeline_stages: [cri: {}].
          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.cri.receiver]
          }

          loki.process "cri" {
            forward_to = [loki.write.loki_gateway.receiver]

            stage.cri {}
          }

          loki.write "loki_gateway" {
            endpoint {
              url       = "http://{{ .Release.Name }}-loki-gateway/loki/api/v1/push"
              tenant_id = "1"
            }
          }
  loki:
    # Chart default (Distributed) runs ~17 separate microservice pods
    # sized for horizontal scale a single-node dev box will never need -
    # SingleBinary is the same functionality (log storage + query) on
    # one pod, and drops the MinIO dependency below entirely.
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      persistence:
        storageClassName: standard
        size: 2Gi
    minio:
      enabled: false # only needed by Distributed mode's S3-backed storage
    loki:
      commonConfig:
        # Chart default (3) assumes Distributed mode's normal multi-replica
        # setup - with singleBinary.replicas: 1 above, every ring this feeds
        # (ingester, compactor, scheduler, pattern-ingester) only ever has
        # one real member, so the query path's own quorum math ("need N
        # healthy out of replication_factor") always came up short and
        # failed outright - confirmed live: every Loki query (even a plain
        # label listing) errored "too many unhealthy instances in the ring",
        # despite the ring itself correctly showing that one member ACTIVE.
        # Ingestion (the write path) was never affected, only querying.
        replication_factor: 1
      storage:
        type: filesystem # was s3 (pointed at the now-disabled minio)
        object_store:
          type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem # chart default is s3, same reason as above
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      compactor:
        delete_request_store: filesystem # chart default is s3
    resultsCache:
      enabled: false # query-result caching - skippable at dev-scale query volume, not a functional loss
    chunksCache:
      enabled: false # same reasoning as resultsCache above
    # backend/read/write/compactor and every microservice below are all
    # Distributed-mode-only standalone pods - SingleBinary mode already runs
    # all of this (ingestion, querying, compaction) inside its own single
    # pod above, so every one of these has to stay at 0 or the chart's own
    # templates/validate.yaml refuses to render (confirmed live: monitoring-
    # logging's own umbrella values.yaml defaults to deploymentMode:
    # Distributed and sets indexGateway/queryScheduler/queryFrontend/
    # distributor/querier/ingester to 2-3 replicas each on that assumption -
    # every one of those needs zeroing out too, not just backend/read/write/
    # compactor, or validate.yaml's "single binary and distributed targets
    # both active" check still fails).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    queryScheduler:
      replicas: 0
    queryFrontend:
      replicas: 0
    distributor:
      replicas: 0
    querier:
      replicas: 0
    ingester:
      replicas: 0
  tempo:
    enabled: true # chart default is false - this project already has tracing active today (templates/metrics/tempo.yaml), keep it on when switching implementations
    persistence:
      storageClassName: standard
      size: 2Gi
  opentelemetry-collector:
    # Wires the traces pipeline to Tempo - chart default has no traces
    # pipeline at all (see that key's own upstream comment: "Apply
    # values-enable-tempo.yaml to enable traces → Tempo"), matching
    # monitoring-logging's own documented values-enable-tempo.yaml.
    config:
      exporters:
        otlp/tempo:
          endpoint: ${env:RELEASE_NAME}-tempo:4317
          tls:
            insecure: true
        # Same "${env:RELEASE_NAME}-kube-prometheus-prometheus" mismatch as
        # the grafana Prometheus datasource above (see that key's own
        # comment for the full why) - this chart's default metrics pipeline
        # already wires this exporter in, so without the fix ZAC's own OTLP
        # metrics would silently fail to land in Prometheus at all (DNS
        # lookup failure inside the collector, not a rendering error).
        prometheusremotewrite:
          endpoint: http://podiumd-minikube-kube-prom-prometheus:9090/api/v1/write
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp/tempo]
