        baseUrlExtern: https://objecttypen.local
        medewerkerUUID: 90984726-2692-49d8-8f9d-742075cb761d
        afdelingUUID: c8d301f9-80b8-4575-8b29-3e9431f92994
        groepUUID: cbec27ac-157b-490b-b586-9e8a8f5bbb85
        interneTaakUUID: 72240cd6-29bb-4a66-b1c3-ab6589a39a22
        kennisartikelUUID: e4d2e353-80ea-4962-8276-920d59a3e8de
        vacUUID: 6a0d8f9d-f7e2-4e57-a91b-01656968a62d
      # podiumd >= 4.10 reads the objecttypen keys under objecten.
