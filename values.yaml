    settings:
      # Laptop budget: 1 web process (podiumd sets 2); podiumd's uwsgi threads stay.
      uwsgi:
        processes: 1
      allowedHosts: referentielijsten.local
      secretKey: referentielijstenSecretKey
      disable2fa: true
      environment: podiumd-minikube
      database:
        host: postgres
        port: 5432
        name: referentielijsten
        username: referentielijsten
        password: referentielijsten
      email:
        host: mailpit
        port: 1025
        useTLS: false
        defaultFrom: noreply@example.com
      cache:
        default: redis:6379/15
        axes: redis:6379/15
    ingress:
      enabled: true
      hosts:
        - host: referentielijsten.local
          paths:
            - path: /
              pathType: ImplementationSpecific

  # --- openbeheer (profile: openbeheer), as ExternalsPodiumD ---
